<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIZE · Circuito</title><link rel="stylesheet" href="../../brand/fonts/outfit.css">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head><body><canvas id="out"></canvas>
<script type="module">
/* "Circuito" · 30 s, 120 BPM, 9:16 or 4:5, a perfect loop. One line of light that never cuts carries the whole film
   (storyboard: the «Circuito» art-direction doc). A blue dot stretches into a line; the line writes the coach's plan
   on a frosted pane; «22,5 kg» rises as a pulse to the athlete's phone; the line leaves the phone and becomes the
   barbell; three reps send pulses back along a long loop to the coach (fatiga, pump); the coach's voice returns as a
   wave that flattens into the weekly progress line; the camera rolls 90° and pulls back: the progress was the arc
   of the G. Half a bar of silence, the last point drops into place as the orb, the firma, «Seguí @gize.app», and the
   orb shrinks back into the dot of frame 0. One continuous camera (a spline that never stops), no cuts to black. */
import {C,RGB,E,clamp,lerp,prog,glow,rr,txt,tw,F,hash,createReel,drawFirma,LOGO,rgbLine,rgbRing,fitSize,wobble} from '../lib/engine.js';

const DUR=30,BT=0.5,TAU=Math.PI*2;
const kOf=L=>L.fmt==='4x5'?0.86:1;
const ss=(a,b,x)=>{const u=clamp((x-a)/(b-a));return u*u*(3-2*u);};
const BLUE=[47,160,255],TEAL=[37,232,200],PURPLE=[166,92,255],PINK=[255,61,174];
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ---------------- the world ---------------- */
const CP={x:760,y:40},PANE={w:780,h:560};
const ROW1={x:CP.x-330,y:CP.y-50},ROW2={x:CP.x-330,y:CP.y+55},ROW3={x:CP.x-330,y:CP.y+165};
const R1='Press banca',R2a='3 × 8 · ',R2b='22,5 kg';
const PH={x:820,y:-1500,w:420,h:860,rot:0.05};
const BC={x:PH.x+1300,y:PH.y+60},BAR=560;
const GS=26,WGC={x:-900,y:1800};
// reps: the bar is at the top at t0, bottom at t0+.45, locked out at t0+.75 (on the beat)
const REPS=[8.25,9.25,10.25],LOCK=REPS.map(t=>t+0.75);
const ARRIVE=[12.6,13.1,13.6],PCOL=[TEAL,PURPLE,PINK];

// paths: polylines with arc length
function mk(pts){const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,cum,len:cum[cum.length-1]};}
function at(P,s){s=clamp(s,0,P.len);let lo=0,hi=P.cum.length-1;while(hi-lo>1){const m=(lo+hi)>>1;P.cum[m]<s?lo=m:hi=m;}
  const a=P.pts[lo],b=P.pts[hi],u=(s-P.cum[lo])/((P.cum[hi]-P.cum[lo])||1);return[lerp(a[0],b[0],u),lerp(a[1],b[1],u),Math.atan2(b[1]-a[1],b[0]-a[0])];}
function bez(p0,p1,p2,p3,n=80){const o=[];for(let i=0;i<=n;i++){const t=i/n,m=1-t;o.push([m*m*m*p0[0]+3*m*m*t*p1[0]+3*m*t*t*p2[0]+t*t*t*p3[0],m*m*m*p0[1]+3*m*m*t*p1[1]+3*m*t*t*p2[1]+t*t*t*p3[1]]);}return o;}
function cr(P,n=24){const o=[];for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
  for(let j=0;j<n;j++){const t=j/n,t2=t*t,t3=t2*t;o.push([0,1].map(d=>0.5*((2*p1[d])+(-p0[d]+p2[d])*t+(2*p0[d]-5*p1[d]+4*p2[d]-p3[d])*t2+(-p0[d]+3*p1[d]-3*p2[d]+p3[d])*t3)));}}o.push(P[P.length-1]);return o;}
let PA={},G={},CK=null;
function build(){const A=LOGO.arc;
  G.A=A;G.D=LOGO.dot;G.x0=WGC.x-GS*A.cx;G.y0=WGC.y-GS*A.cy;G.d=((A.a1-A.a0)%TAU+TAU)%TAU;
  G.th=p=>A.a1-p*G.d;G.pt=p=>{const th=G.th(p);return[G.x0+GS*(A.cx+A.r*Math.cos(th)),G.y0+GS*(A.cy+A.r*Math.sin(th))];};
  G.dot=[G.x0+GS*G.D.x,G.y0+GS*G.D.y];
  const S=G.pt(0),dir=[Math.sin(A.a1),-Math.cos(A.a1)];G.S=S;
  const w1=tw(R1,800,64),w2=tw(R2a+R2b,700,52);G.w1=w1;G.w2=w2;G.k22=ROW2.x+tw(R2a,700,52);
  PA.plan=mk([...bez([0,0],[160,0],[ROW1.x-260,ROW1.y+16],[ROW1.x,ROW1.y+16],40),[ROW1.x+w1,ROW1.y+16],...bez([ROW1.x+w1,ROW1.y+16],[ROW1.x+w1+50,ROW1.y+44],[ROW2.x-140,ROW1.y+44],[ROW2.x,ROW2.y+16],20).slice(1),[ROW2.x+w2,ROW2.y+16]]);
  G.planMarks=[PA.plan.cum[40],PA.plan.cum[41],PA.plan.cum[61]];   // where row 1 starts and ends, where row 2 starts (path lengths)
  PA.up=mk(bez([G.k22+tw(R2b,700,52)/2,ROW2.y-40],[G.k22+420,CP.y-560],[PH.x-420,PH.y+1000],[PH.x-40,PH.y+PH.h/2]));
  PA.inPh=mk([[PH.x-40,PH.y+PH.h/2],[PH.x-40,PH.y+150],[PH.x,PH.y-90]]);
  PA.out=mk(bez([PH.x+180,PH.y-120],[PH.x+560,PH.y-120],[BC.x-BAR-420,BC.y],[BC.x-BAR,BC.y]));
  PA.back=mk(cr([[BC.x+BAR,BC.y],[BC.x+880,BC.y+30],[BC.x+1060,BC.y+600],[BC.x+960,CP.y+300],[BC.x+300,CP.y+820],[CP.x+700,CP.y+880],[CP.x+160,CP.y+760],[CP.x,CP.y+PANE.h/2]]));
  PA.wave=mk(bez([CP.x-PANE.w/2,CP.y+60],[CP.x-560,CP.y+1000],[S[0]-dir[0]*620,S[1]-dir[1]*620],S,120));
  const arc=[];for(let i=0;i<=240;i++)arc.push(G.pt(i/240));PA.arc=mk(arc);
  // the camera: key positions, zoom and roll; a spline through them so it never stops
  const zG=640/((2*A.r+A.w)*GS),zF=780/(LOGO.w*GS),fx=G.x0+LOGO.w*GS/2,fy=G.y0+LOGO.h*GS/2+120/zF;G.zF=zF;
  const wm=at(PA.wave,PA.wave.len*0.55);
  CK=[[0,0,0,1,0],[1.0,30,-8,1.02,0],[2.2,ROW1.x+220,CP.y-20,1,0],[3.4,CP.x+60,CP.y,1.02,0],[4.4,CP.x+520,-620,0.82,0.5],[5.3,PH.x+20,PH.y+120,1,0.08],
    [6.4,PH.x+80,PH.y-20,1.08,0],[7.3,PH.x+700,PH.y+40,0.9,0],[8.3,BC.x,BC.y-40,0.82,0],[11.2,BC.x+40,BC.y-40,0.9,0],[12.3,1500,-560,0.29,0],
    [13.3,2150,520,0.55,-0.12],[14.3,CP.x+40,CP.y+80,0.95,0],[15.4,CP.x-260,CP.y+640,0.8,-0.35],[16.7,wm[0],wm[1],0.85,-1.1],[17.8,S[0]+180,S[1]+60,1.05,-Math.PI/2],
    [22.0,WGC.x,WGC.y,zG,0],[23.0,WGC.x,WGC.y,zG*0.98,0],[23.7,WGC.x,WGC.y,zG,0],[24.9,fx,fy,zF,0],[29.0,fx,fy,zF*1.03,0],[30,fx,fy,zF*1.035,0]].map(([t,x,y,z,r])=>({t,x,y,lz:Math.log(z),r}));}
function spl(t,K,f){if(t<=K[0].t)return K[0][f];if(t>=K[K.length-1].t)return K[K.length-1][f];let i=0;while(t>K[i+1].t)i++;
  const a=K[i],b=K[i+1],h=b.t-a.t,u=(t-a.t)/h,m=j=>{const p=K[Math.max(0,j-1)],n=K[Math.min(K.length-1,j+1)];return(n[f]-p[f])/((n.t-p.t)||1);};
  const m0=m(i)*h,m1=m(i+1)*h,u2=u*u,u3=u2*u;return(2*u3-3*u2+1)*a[f]+(u3-2*u2+u)*m0+(-2*u3+3*u2)*b[f]+(u3-u2)*m1;}
// how far the progress line has run round the G
const PK=[{t:17.9,p:0},{t:20.4,p:0.35},{t:22.0,p:1}];
const progG=t=>t<PK[0].t?0:t>=22?1:clamp(spl(t,PK,'p'));
function camAt(t,L){const k=kOf(L);let c={x:spl(t,CK,'x'),y:spl(t,CK,'y'),lz:spl(t,CK,'lz'),r:spl(t,CK,'r')};
  const wF=ss(17.2,18.0,t)*(1-ss(20.4,22.0,t));
  if(wF>0){const p=progG(t),H=G.pt(p),z=lerp(1.1,0.95,ss(18,20.4,t)),r=-Math.PI/2,ox=-80*k,oy=140*k,zk=z*k,cs=Math.cos(r),sn=Math.sin(r);
    const f={x:H[0]-(ox*cs-oy*sn)/zk,y:H[1]-(ox*sn+oy*cs)/zk,lz:Math.log(z),r};for(const key of['x','y','lz','r'])c[key]=lerp(c[key],f[key],wF);}
  return{x:c.x,y:c.y,z:Math.exp(c.lz),r:c.r};}
const SCY=L=>L.sc-60*kOf(L);
function w2s(L,cam,x,y){const k=kOf(L),zk=cam.z*k,dx=(x-cam.x)*zk,dy=(y-cam.y)*zk,cs=Math.cos(-cam.r),sn=Math.sin(-cam.r);return[L.CX+dx*cs-dy*sn,SCY(L)+dx*sn+dy*cs];}

/* ---------------- drawing the line ---------------- */
function trace(P,s0,s1,mod,step=0){const p=new Path2D();if(s1<=s0)return p;
  if(!mod&&!step){let a=at(P,s0);p.moveTo(a[0],a[1]);for(let i=0;i<P.pts.length;i++){if(P.cum[i]<=s0)continue;if(P.cum[i]>=s1)break;p.lineTo(P.pts[i][0],P.pts[i][1]);}a=at(P,s1);p.lineTo(a[0],a[1]);return p;}
  const st=step||10;for(let s=s0,first=true;;s+=st){const ss_=Math.min(s,s1),a=at(P,ss_),m=mod?mod(ss_,a):[0,0];first?p.moveTo(a[0]+m[0],a[1]+m[1]):p.lineTo(a[0]+m[0],a[1]+m[1]);first=false;if(ss_>=s1)break;}return p;}
function neon(c,path,zk,{col=BLUE,a=1,w=1}={}){if(a<=0)return;c.save();c.globalCompositeOperation='lighter';c.lineCap='round';c.lineJoin='round';
  c.strokeStyle=rgba(col,0.16*a);c.lineWidth=18*w/zk;c.stroke(path);c.strokeStyle=rgba(col,0.5*a);c.lineWidth=6*w/zk;c.stroke(path);
  c.strokeStyle=`rgba(225,242,255,${0.95*a})`;c.lineWidth=2.2*w/zk;c.stroke(path);c.restore();}
function head(c,x,y,zk,col=BLUE,s=1){c.save();c.globalCompositeOperation='lighter';glow(c,x,y,70*s/zk,col,0.55);glow(c,x,y,22*s/zk,[255,255,255],0.8);c.restore();}
function pulse(c,P,s,zk,col,trail=320,mod){const s0=Math.max(0,s-trail/zk*0.6);for(let i=0;i<4;i++){const a=s0+(s-s0)*i/4;neon(c,trace(P,a,s,mod),zk,{col,a:0.35,w:1+i*0.5});}const h=at(P,s),m=mod?mod(s,h):[0,0];head(c,h[0]+m[0],h[1]+m[1],zk,col,1.3);}

/* ---------------- the coach's pane and the athlete's phone ---------------- */
function frost(c,x,y,w,h,r,zk,lit){c.save();c.shadowColor='rgba(0,0,0,0.6)';c.shadowBlur=40;c.fillStyle='rgba(14,17,23,0.82)';rr(c,x,y,w,h,r);c.fill();c.restore();
  const g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'rgba(255,255,255,0.07)');g.addColorStop(0.5,'rgba(255,255,255,0.01)');g.addColorStop(1,'rgba(255,255,255,0.04)');c.fillStyle=g;rr(c,x,y,w,h,r);c.fill();
  c.lineWidth=1.6/zk;c.strokeStyle='rgba(255,255,255,0.13)';rr(c,x,y,w,h,r);c.stroke();
  if(lit>0){c.save();c.globalAlpha=lit;c.lineWidth=3/zk;c.strokeStyle=rgbRing(c,x+w/2,y+h/2,0.6);rr(c,x,y,w,h,r);c.stroke();c.globalCompositeOperation='lighter';c.lineWidth=14/zk;c.globalAlpha=lit*0.25;c.stroke();c.restore();}}
function pane(c,t,zk,pen){const a=E.outCubic(prog(t,1.15,1.6));if(a<=0)return;const x=CP.x-PANE.w/2,y=CP.y-PANE.h/2,s=lerp(0.96,1,a);
  c.save();c.globalAlpha*=a;c.translate(CP.x,CP.y);c.rotate(-0.03);c.scale(s,s);c.translate(-CP.x,-CP.y);
  frost(c,x,y,PANE.w,PANE.h,34,zk,E.outCubic(prog(t,13.6,14.0))*(1-0.4*ss(14.2,15,t)));
  c.font=F(600,22);c.letterSpacing='5px';c.fillStyle=C.text2;c.fillText('PLAN DE HOY',ROW1.x,CP.y-180);c.letterSpacing='0px';
  // the rows, written by the pen
  const clipTo=(x0,x1,y0,y1,fn)=>{c.save();c.beginPath();c.rect(x0,y0,Math.max(0,x1-x0),y1-y0);c.clip();fn();c.restore();};
  clipTo(ROW1.x-10,pen.x1,ROW1.y-80,ROW1.y+30,()=>txt(c,R1,ROW1.x,ROW1.y,800,64,'#fff'));
  clipTo(ROW2.x-10,pen.x2,ROW2.y-70,ROW2.y+30,()=>{txt(c,R2a,ROW2.x,ROW2.y,700,52,'#fff');const gl=E.outCubic(prog(t,3.45,3.65))*(1-ss(4.4,5.2,t));
    txt(c,R2b,G.k22,ROW2.y,700,52,gl>0?`rgb(${lerp(255,37,gl)|0},${lerp(255,232,gl)|0},${lerp(255,200,gl)|0})`:'#fff');if(gl>0){c.save();c.globalCompositeOperation='lighter';glow(c,G.k22+tw(R2b,700,52)/2,ROW2.y-18,170,TEAL,0.35*gl);c.restore();}});
  // what came back from the athlete
  [['Fatiga 3/5',TEAL,0],['Pump 4/5',PURPLE,300]].forEach(([s,col,dx],i)=>{const u=t-ARRIVE[i];if(u<0)return;const e=E.outCubic(clamp(u/0.3));c.save();c.globalAlpha*=e;
    c.translate(0,(1-e)*16);txt(c,s,ROW3.x+dx,ROW3.y,700,46,rgba(col,1));c.globalCompositeOperation='lighter';glow(c,ROW3.x+dx+tw(s,700,46)/2,ROW3.y-16,150,col,0.4*Math.exp(-u*2.5)+0.08);c.restore();});
  c.restore();}
function phone(c,t,zk){const a=E.outCubic(prog(t,4.3,4.9));if(a<=0)return;const w=PH.w,h=PH.h,s=lerp(0.95,1,a);
  c.save();c.globalAlpha*=a;c.translate(PH.x,PH.y);c.rotate(PH.rot);c.scale(s,s);c.translate(-w/2,-h/2);
  c.fillStyle='#0C0E13';rr(c,-12,-12,w+24,h+24,58);c.fill();c.lineWidth=1.6/zk;c.strokeStyle='rgba(255,255,255,0.16)';c.stroke();
  c.save();rr(c,0,0,w,h,48);c.clip();c.fillStyle='#000';c.fillRect(0,0,w,h);glow(c,-40,90,460,BLUE,0.38);glow(c,w+40,h-60,440,PINK,0.3);
  c.fillStyle='#000';rr(c,w/2-54,14,108,30,15);c.fill();
  const on=E.outCubic(prog(t,5.25,5.6));txt(c,'Press banca',30,170,800,40,'#fff');txt(c,'Tu coach propone',30,236,500,26,C.text2);
  c.fillStyle='#12151B';rr(c,24,258,w-48,84,22);c.fill();c.lineWidth=(1.4+2*on)/zk;c.strokeStyle=on>0?rgbRing(c,w/2,300,t):'rgba(255,255,255,0.12)';c.stroke();
  if(on>0){c.save();c.globalCompositeOperation='lighter';c.globalAlpha*=on;glow(c,w/2,300,260,BLUE,0.35*Math.exp(-(t-5.25)*1.5)+0.1);c.restore();}
  txt(c,'22,5 kg × 8',48,312,800,34,on>0?'#fff':C.text2);
  for(let i=0;i<3;i++){const y=372+i*86;c.fillStyle='#0E1116';rr(c,24,y,w-48,70,18);c.fill();txt(c,String(i+1),56,y+45,700,26,C.text2,'center');c.fillStyle='rgba(255,255,255,0.08)';rr(c,96,y+22,120,26,8);c.fill();rr(c,236,y+22,90,26,8);c.fill();}
  c.restore();c.restore();}

/* ---------------- the bar ---------------- */
function repY(t){let y=0;for(const t0 of REPS){const u=t-t0;if(u<0||u>1)continue;y=u<0.45?240*E.inOutSine(u/0.45):u<0.5?240:240*(1-E.outCubic(clamp((u-0.5)/0.25)));}return y;}
function bar(c,t,zk){const grow=E.outExpo(prog(t,7.28,7.55)),th=lerp(2.2/zk,22,E.outCubic(prog(t,7.45,7.85)));if(grow<=0)return;const dy=repY(t);
  let bend=0;for(const tl of LOCK)if(t>tl)bend=10*wobble(t-tl,2.6,5);const x0=BC.x-BAR,x1=BC.x-BAR+2*BAR*grow,y=BC.y+dy;
  // plates and collars, behind the bar's glow
  const pe=t<7.6?0:1-Math.exp(-(t-7.6)*7)*Math.cos((t-7.6)*16);
  if(pe>0)for(const sd of[-1,1])for(const[o,w,h]of[[BAR-40,46,260],[BAR-104,60,340],[BAR-160,22,90]]){const cx=BC.x+sd*o,hh=h*clamp(pe,0,1.15),yy=y+bend*0.6;
    c.fillStyle=o>BAR-130?'#0B0D11':'#1A1E26';rr(c,cx-w/2,yy-hh/2,w,hh,10);c.fill();c.lineWidth=2.4/zk;c.strokeStyle=rgbLine(c,cx,yy-hh/2,cx,yy+hh/2);c.stroke();
    c.save();c.globalCompositeOperation='lighter';c.fillStyle='rgba(120,190,255,0.35)';c.fillRect(cx-w/2+4,yy-hh/2,w-8,2.5/zk);c.restore();}
  const p=new Path2D();p.moveTo(x0,y);p.quadraticCurveTo((x0+x1)/2,y+bend,x1,y);
  c.save();c.lineCap='round';c.globalCompositeOperation='lighter';c.strokeStyle=rgba(BLUE,0.22);c.lineWidth=th+26/zk;c.stroke(p);c.restore();
  c.save();c.lineCap='round';const g=c.createLinearGradient(0,y-th/2,0,y+th/2);g.addColorStop(0,'#FFFFFF');g.addColorStop(0.5,'#BFD9F2');g.addColorStop(1,'#6E7F95');c.strokeStyle=g;c.lineWidth=th;c.stroke(p);c.restore();}
const barEnd=(t,s,len,atStart)=>{const dy=repY(t);return atStart?dy*(1-ss(0,520,s)):dy*ss(len-520,len,s);};

/* ---------------- HUD, captions, grain ---------------- */
const CHAP=[[0,'01','EL PLAN'],[8,'02','LA SERIE'],[15,'03','EL PROGRESO']];
const CAPS=[[2.2,3.9,'Tu coach arma el plan.'],[5.5,8.0,'Lo tenés en tu celu.'],[8.3,11.6,'Vos registrás cada serie.'],[12.5,14.6,'Tu coach lo ve.'],
  [15.0,17.8,'Y te corrige en cada ejercicio.'],[18.3,21.8,'Semana a semana.']];
function hud(c,L,t){const a=clamp(t/0.6)*(1-ss(22.3,22.7,t));if(a<=0)return;const k=kOf(L),l=L.safe.left+4,r=L.W-L.safe.left-4,tp=L.safe.top+8,bo=L.safe.bottom-8,m=34*k;
  c.save();c.globalAlpha=a*0.85;c.strokeStyle='rgba(255,255,255,0.55)';c.lineWidth=2;for(const[x,y,sx,sy]of[[l,tp,1,1],[r,tp,-1,1],[l,bo,1,-1],[r,bo,-1,-1]]){c.beginPath();c.moveTo(x,y+sy*m);c.lineTo(x,y);c.lineTo(x+sx*m,y);c.stroke();}
  drawFirma(c,l+14,tp+16,0.24*k,{});
  c.font=F(600,17*k);c.letterSpacing=`${4*k}px`;c.fillStyle=C.text2;c.textAlign='right';const lab='ENTRENAMIENTO CON COACH',lw=c.measureText(lab).width;c.fillText(lab,r-14,tp+38*k);c.textAlign='left';
  c.fillStyle=rgbLine(c,r-14-lw-44*k,0,r-14-lw-14*k,0);c.fillRect(r-14-lw-44*k,tp+32*k,30*k,2.5);
  const ch=[...CHAP].reverse().find(x=>t>=x[0]),ce=E.outExpo(prog(t,ch[0],ch[0]+0.4));c.font=F(700,19*k);c.fillStyle='#fff';c.globalAlpha=a*ce;c.fillText(`${ch[1]}`,l+14,bo-18*k);
  c.fillStyle=C.text2;c.fillText(`/  ${ch[2]}`,l+14+tw(ch[1],700,19*k)+10*k,bo-18*k);c.letterSpacing='0px';c.globalAlpha=a*0.85;
