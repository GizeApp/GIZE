<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIZE · Logo solo con letras</title><link rel="stylesheet" href="../../brand/fonts/outfit.css">
<style>html,body{margin:0;background:#111}canvas{display:block;max-width:100vw;max-height:100vh}</style>
</head><body><canvas id="out"></canvas>
<script type="module">
/* GIZE — letters-only logos, 1080 × 1080. Most are built from the logotype's own letters (Bigger Display,
   already in curves in brand/logo): the word, the word in a square frame (the gesture of the old CORE logo),
   stacked GI / ZE, treatments of it, and its G alone. One proposes a lowercase in Outfit where the i's dot is
   the brand's blue dot.   window.renderVariant(id) / window.renderBoard() -> PNG data URLs. */
import {LOGO,loadLogo,F,rgba,rng} from '../lib/engine.js';

const W=1080,CX=540,CY=540,Z=2,S=W*Z,TAU=Math.PI*2;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const PAD=180;
function layerP(fn){const cv=mk(S+2*PAD*Z,S+2*PAD*Z),c=cv.getContext('2d');c.setTransform(Z,0,0,Z,PAD*Z,PAD*Z);fn(c);return cv;}
function putP(c,cv,{filter='none',alpha=1,op='source-over'}={}){c.save();c.setTransform(1,0,0,1,0,0);c.filter=filter;c.globalAlpha=alpha;c.globalCompositeOperation=op;c.drawImage(cv,-PAD*Z,-PAD*Z);c.restore();}
function layer(fn){const cv=mk(S,S),c=cv.getContext('2d');c.setTransform(Z,0,0,Z,0,0);fn(c);return cv;}
function put(c,cv,{filter='none',alpha=1,op='source-over'}={}){c.save();c.setTransform(1,0,0,1,0,0);c.filter=filter;c.globalAlpha=alpha;c.globalCompositeOperation=op;c.drawImage(cv,0,0);c.restore();}
const blur=r=>`blur(${r*Z}px)`;
let NOISE=null;
function grain(c,a,op='soft-light'){if(!NOISE){NOISE=mk(S,S);const x=NOISE.getContext('2d'),d=x.createImageData(S,S),r=rng(7);for(let i=0;i<d.data.length;i+=4){const v=(r()+r()+r())/3*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);}put(c,NOISE,{alpha:a,op});}
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function radial(c,x,y,r,col,a,a1=0){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,a1));c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);}
function lin(c,x0,y0,x1,y1,cols){const g=c.createLinearGradient(x0,y0,x1,y1);cols.forEach((s,i)=>g.addColorStop(i/(cols.length-1),s));return g;}
function fill(c,style){c.fillStyle=style;c.fillRect(0,0,W,W);}
function txt(c,s,x,y,w,px,col,al='left',ls=0){c.font=F(w,px);c.fillStyle=col;c.textAlign=al;c.letterSpacing=ls+'px';c.fillText(s,x,y);c.letterSpacing='0px';c.textAlign='left';}
function blobs(x,list){list.forEach(([px,py,r,a,b])=>{const g=x.createLinearGradient(px-r,py-r,px+r,py+r);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,TAU);x.fill();});}
const RGB4=['#2FA0FF','#A65CFF','#FF3DAE','#25E8C8'];

/* ---------------- the logotype's letters, placed one by one ---------------- */
// font units: cap height 800, baseline 0, y up; ink box x-range per letter; the word's own gap is 44 u
const GL={G:{i:0,x0:10.5,x1:357.5},I:{i:1,x0:10.6,x1:149.4},Z:{i:2,x0:10.5,x1:357.5},E:{i:3,x0:8.9,x1:321.1}},GAP=44,CAP=800;
const wordW=(s)=>[...s].reduce((a,ch,i)=>a+(GL[ch].x1-GL[ch].x0)+(i?GAP:0),0);
// lay out lines of letters: [{s:'GIZE', x, yBase, k}] -> [{ch, x (ink left), yBase, k}]
function place(lines){const out=[];for(const L of lines){let x=L.x;for(const ch of L.s){out.push({ch,x,y:L.y,k:L.k});x+=(GL[ch].x1-GL[ch].x0+GAP)*L.k;}}return out;}
function glyphPath(c,g,skew=0){const L=GL[g.ch],P=LOGO.wm.letters[L.i].p;c.save();c.translate(g.x,g.y);if(skew)c.transform(1,0,-skew,1,0,0);c.scale(g.k,-g.k);c.translate(-L.x0,0);return P;}
function fillGlyphs(c,gs,style,{skew=0}={}){for(const g of gs){const P=glyphPath(c,g,skew);c.fillStyle=style;c.fill(P);c.restore();}}
function strokeGlyphs(c,gs,style,w,{skew=0}={}){for(const g of gs){const P=glyphPath(c,g,skew);c.strokeStyle=style;c.lineWidth=w/g.k;c.lineJoin='round';c.stroke(P);c.restore();}}
// fill any style in canvas space (gradients don't follow the letters' flipped transforms)
function paintGlyphs(c,gs,paint,o={}){const P=layer(paint);put(c,layer(x=>{x.save();x.setTransform(1,0,0,1,0,0);x.drawImage(P,0,0);x.globalCompositeOperation='destination-in';x.drawImage(layer(m=>fillGlyphs(m,gs,'#fff',o)),0,0);x.restore();}));}
// layouts
function wordAt(width,cy=CY){const k=width/wordW('GIZE');return place([{s:'GIZE',x:CX-width/2,y:cy+CAP*k/2,k}]);}
function stacked(width,cy=CY,lead=0.1){const k2=width/wordW('ZE'),k1=width/wordW('GI'),h1=CAP*k1,h2=CAP*k2,gap=CAP*k2*lead,top=cy-(h1+gap+h2)/2;
  return place([{s:'GI',x:CX-width/2,y:top+h1,k:k1},{s:'ZE',x:CX-width/2,y:top+h1+gap+h2,k:k2}]);}
function boxOf(gs){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const g of gs){const L=GL[g.ch];x0=Math.min(x0,g.x);x1=Math.max(x1,g.x+(L.x1-L.x0)*g.k);y0=Math.min(y0,g.y-CAP*g.k);y1=Math.max(y1,g.y);}return{x0,x1,y0,y1};}
function rule(c,x0,x1,y,h=4){c.fillStyle=lin(c,x0,0,x1,0,RGB4);c.fillRect(x0,y,x1-x0,h);}

const V=[];const def=(id,name,draw)=>V.push({id,name,draw});

/* ---------------- the word ---------------- */
def('l01-palabra','La palabra',c=>{fill(c,'#000');const gs=wordAt(720);fillGlyphs(c,gs,'#fff');const b=boxOf(gs);rule(c,b.x0,b.x1,b.y1+44,5);});
def('l02-palabra-azul','La palabra, en azul',c=>{const g=c.createRadialGradient(400,330,30,540,560,800);g.addColorStop(0,'#3AAEFF');g.addColorStop(0.55,'#1287E6');g.addColorStop(1,'#0059A8');fill(c,g);grain(c,0.04);fillGlyphs(c,wordAt(720),'#fff');});
// the letters are tall and narrow (Bigger Display), so GI / ZE stacked is a tall totem: same cap height, rows centred
function totem(h,cy=CY,lead=0.09){const k=h/(CAP*(2+lead)),w1=wordW('GI')*k,w2=wordW('ZE')*k;return place([{s:'GI',x:CX-w1/2,y:cy-h/2+CAP*k,k},{s:'ZE',x:CX-w2/2,y:cy+h/2,k}]);}
def('l03-recuadro','En recuadro',c=>{fill(c,'#000');c.strokeStyle='#2FA0FF';c.lineWidth=11;c.strokeRect(160,160,760,760);fillGlyphs(c,wordAt(560),'#2FA0FF');});
def('l04-recuadro-azul','En recuadro, azul',c=>{fill(c,'#2FA0FF');c.strokeStyle='#000';c.lineWidth=11;c.strokeRect(160,160,760,760);fillGlyphs(c,wordAt(560),'#000');});
def('l05-torre','Torre GI / ZE',c=>{fill(c,'#000');radial(c,CX,CY,520,hex('#0B2A55'),0.45);fillGlyphs(c,totem(760),'#fff');});
def('l06-italica','Itálica deportiva',c=>{fill(c,'#000');radial(c,CX,CY,600,hex('#0B2A55'),0.5);const sk=0.2,gs=wordAt(700).map(g=>({...g,x:g.x+CAP*g.k*sk/2}));
  const L=layer(x=>{x.lineCap='round';const r=rng(3);for(let i=0;i<16;i++){const y=380+r()*320,len=120+r()*260,x0=100+r()*220;x.strokeStyle=rgba(hex(RGB4[i%4]),0.35+0.4*r());x.lineWidth=2+r()*4;x.beginPath();x.moveTo(x0,y);x.lineTo(x0+len,y);x.stroke();}});
  put(c,L,{filter:blur(1)});fillGlyphs(c,gs,'#fff',{skew:sk});});

/* ---------------- treatments of the word ---------------- */
def('l07-contorno','Contorno',c=>{fill(c,'#000');const gs=wordAt(760);fillGlyphs(c,gs.slice(0,2),'#fff');strokeGlyphs(c,gs.slice(2),'#fff',5);});
def('l08-rgb','RGB',c=>{fill(c,'#000');const gs=wordAt(760);paintGlyphs(c,gs,x=>{x.fillStyle=lin(x,160,300,920,780,RGB4);x.fillRect(0,0,W,W);});});
def('l09-cromo','Cromo',c=>{const bg=c.createRadialGradient(470,420,40,540,580,800);bg.addColorStop(0,'#13254F');bg.addColorStop(0.6,'#06102A');bg.addColorStop(1,'#02040B');fill(c,bg);
  const gs=wordAt(760),b=boxOf(gs);
  paintGlyphs(c,gs,x=>{const g=x.createLinearGradient(0,b.y0,0,b.y1);[[0,'#E9EEF8'],[0.16,'#FFFFFF'],[0.34,'#8E9AB5'],[0.48,'#26314D'],[0.54,'#3B4766'],[0.7,'#C9D3E6'],[0.86,'#FFFFFF'],[1,'#56637F']].forEach(([o,col])=>g.addColorStop(o,col));x.fillStyle=g;x.fillRect(0,0,W,W);});
  strokeGlyphs(c,gs,'rgba(255,255,255,0.55)',1.5);grain(c,0.04);});
def('l10-neon','Neón',c=>{fill(c,'#04060B');radial(c,CX,CY,560,hex('#0A1E40'),0.6);const gs=wordAt(760);
  const tube=(x,w,col)=>strokeGlyphs(x,gs,col,w);
  put(c,layer(x=>tube(x,18,'#2FA0FF')),{filter:blur(40),op:'screen'});put(c,layer(x=>tube(x,10,'#A65CFF')),{filter:blur(14),op:'screen'});put(c,layer(x=>tube(x,7,'#7CC8FF')),{op:'screen'});put(c,layer(x=>tube(x,2.4,'#F2FAFF')),{op:'screen'});grain(c,0.05);});
def('l11-vidrio','Vidrio',c=>{const BG=layerP(x=>{x.fillStyle='#03050C';x.fillRect(-PAD,-PAD,W+2*PAD,W+2*PAD);blobs(x,[[300,330,280,'#62C4FF','#0B5BD6'],[800,280,220,'#B07BFF','#4A2BD1'],[720,800,280,'#2FE0FF','#0077C8'],[250,800,170,'#FF6BC0','#C2185B']]);});
  putP(c,BG);const gs=wordAt(800);put(c,layer(x=>fillGlyphs(x,gs,'rgba(0,0,0,0.55)')),{filter:blur(16)});
  const glass=layer(x=>{x.save();x.setTransform(1,0,0,1,0,0);x.filter=blur(24);x.drawImage(BG,-PAD*Z,-PAD*Z);x.restore();x.fillStyle='rgba(255,255,255,0.2)';x.fillRect(0,0,W,W);
    const h=x.createLinearGradient(140,300,940,780);h.addColorStop(0,'rgba(255,255,255,0.5)');h.addColorStop(0.5,'rgba(255,255,255,0.06)');h.addColorStop(1,'rgba(255,255,255,0.22)');x.fillStyle=h;x.fillRect(0,0,W,W);
    x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='destination-in';x.drawImage(layer(m=>fillGlyphs(m,gs,'#fff')),0,0);x.restore();});
  put(c,glass);strokeGlyphs(c,gs,'rgba(255,255,255,0.5)',1.5);});
// the logotype's own G, alone: a letters-only mark for the app icon
def('l15-g-de-la-palabra','La G de la palabra',c=>{fill(c,'#000');radial(c,CX,CY,520,hex('#0B2A55'),0.4);const k=640/CAP,gs=place([{s:'G',x:CX-(GL.G.x1-GL.G.x0)*k/2,y:CY+CAP*k/2,k}]);fillGlyphs(c,gs,'#fff');});

/* ---------------- a lowercase, with the brand's dot on the i ---------------- */
function lower(c,px,col,dot,cy=CY){c.font=F(800,px);c.letterSpacing=`${-px*0.02}px`;const s='gıze',w=c.measureText(s).width,x=CX-w/2,y=cy+px*0.2;c.fillStyle=col;c.fillText(s,x,y);
  const wg=c.measureText('g').width,wi=c.measureText('ı').width;c.letterSpacing='0px';c.fillStyle=dot;c.beginPath();c.arc(x+wg-px*0.02+wi/2,y-px*0.69,px*0.085,0,TAU);c.fill();}
def('l12-minuscula','gize, minúscula',c=>{fill(c,'#000');lower(c,290,'#fff','#2FA0FF');});
def('l13-minuscula-clara','gize, en claro',c=>{fill(c,'#FFFFFF');lower(c,290,'#0B0D11','#2FA0FF');});
def('l14-minuscula-azul','gize, en azul',c=>{const g=c.createRadialGradient(400,330,30,540,560,800);g.addColorStop(0,'#3AAEFF');g.addColorStop(0.55,'#1287E6');g.addColorStop(1,'#0059A8');fill(c,g);grain(c,0.04);lower(c,290,'#fff','#04122B');});

/* ---------------- render + board ---------------- */
function renderBig(v){const cv=mk(S,S),c=cv.getContext('2d');c.setTransform(Z,0,0,Z,0,0);v.draw(c);return cv;}
function halve(cv){const o=mk(cv.width/2,cv.height/2),c=o.getContext('2d');c.imageSmoothingQuality='high';c.drawImage(cv,0,0,o.width,o.height);return o;}
window.VARIANTS=V.map(v=>({id:v.id,name:v.name}));
window.renderVariant=id=>halve(renderBig(V.find(v=>v.id===id))).toDataURL('image/png');
window.renderBoard=()=>{const cols=5,T=420,gap=40,M=90,head=260,rowH=T+84,BW=M*2+cols*T+(cols-1)*gap,rows=Math.ceil(V.length/cols),BH=head+rows*rowH+M-20,cv=mk(BW,BH),c=cv.getContext('2d');
  c.fillStyle='#0B0D11';c.fillRect(0,0,BW,BH);txt(c,'Logo solo con letras · '+V.length+' opciones',M,112,800,52,'#fff');
  txt(c,'Con las letras del logotipo (la palabra, en recuadro como el viejo CORE, en torre, sus tratamientos, la G sola) y una minúscula en Outfit con el punto azul en la i.',M,160,500,25,'#8F98A6');
  c.fillStyle=lin(c,M,0,BW-M,0,RGB4);c.fillRect(M,206,BW-2*M,3);
  V.forEach((v,i)=>{const col=i%cols,row=Math.floor(i/cols),x=M+col*(T+gap),y=head+row*rowH,img=renderBig(v);c.save();c.imageSmoothingQuality='high';c.beginPath();c.roundRect(x,y,T,T,18);c.clip();c.drawImage(img,x,y,T,T);c.restore();
    const r=62,ax=x+T-r-14,ay=y+T-r-14;c.save();c.beginPath();c.arc(ax,ay,r,0,TAU);c.clip();c.drawImage(img,ax-r,ay-r,2*r,2*r);c.restore();c.strokeStyle='#0B0D11';c.lineWidth=6;c.beginPath();c.arc(ax,ay,r+3,0,TAU);c.stroke();
    txt(c,v.id.slice(1,3),x,y+T+44,700,24,'#2FA0FF');txt(c,v.name,x+40,y+T+44,600,26,'#fff');});
  return cv.toDataURL('image/png');};
window.READY=false;
(async()=>{await Promise.all([500,600,700,800].map(w=>document.fonts.load(F(w,40),'gıze GIZE')));await loadLogo();window.READY=true;})();
</script></body></html>
