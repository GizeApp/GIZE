<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIZE · Íconos de la app</title><link rel="stylesheet" href="../../brand/fonts/outfit.css">
<style>html,body{margin:0;background:#111}canvas{display:block;max-width:100vw;max-height:100vh}</style>
</head><body><canvas id="out"></canvas>
<script type="module">
/* GIZE — app icon candidates, 1024 × 1024, full bleed and square (iOS and Android apply their own masks).
   Group A keeps to brand/BRAND.md (white G with the blue dot on dark grounds, one-colour on blue and light);
   group B are explorations that bend it (chrome, neon, RGB, glass G) so the range can be judged.
   Each icon can have a light-mode version; the board shows every icon masked like iOS, at its real size on a
   dark and a light home screen.   window.renderVariant(id[, 'light']) / window.renderBoard() -> PNG data URLs. */
import {LOGO,loadLogo,drawFirma,F,rgba,rng,clamp,lerp} from '../lib/engine.js';

const W=1024,CX=512,CY=512,Z=2,S=W*Z,TAU=Math.PI*2;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const PAD=180;
function layerP(fn){const cv=mk(S+2*PAD*Z,S+2*PAD*Z),c=cv.getContext('2d');c.setTransform(Z,0,0,Z,PAD*Z,PAD*Z);fn(c);return cv;}
function putP(c,cv,{filter='none',alpha=1,op='source-over'}={}){c.save();c.setTransform(1,0,0,1,0,0);c.filter=filter;c.globalAlpha=alpha;c.globalCompositeOperation=op;c.drawImage(cv,-PAD*Z,-PAD*Z);c.restore();}
function layer(fn){const cv=mk(S,S),c=cv.getContext('2d');c.setTransform(Z,0,0,Z,0,0);fn(c);return cv;}
function put(c,cv,{filter='none',alpha=1,op='source-over'}={}){c.save();c.setTransform(1,0,0,1,0,0);c.filter=filter;c.globalAlpha=alpha;c.globalCompositeOperation=op;c.drawImage(cv,0,0);c.restore();}
const blur=r=>`blur(${r*Z}px)`;
let NOISE=null;
function grain(c,a,op='soft-light'){if(!NOISE){NOISE=mk(S,S);const x=NOISE.getContext('2d'),d=x.createImageData(S,S),r=rng(7);for(let i=0;i<d.data.length;i+=4){const v=(r()+r()+r())/3*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);}put(c,NOISE,{alpha:a,op});}
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function radial(c,x,y,r,col,a,a1=0){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,a1));c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);}
function lin(c,x0,y0,x1,y1,cols){const g=c.createLinearGradient(x0,y0,x1,y1);cols.forEach((s,i)=>g.addColorStop(i/(cols.length-1),s));return g;}
function fill(c,style){c.fillStyle=style;c.fillRect(0,0,W,W);}
function txt(c,s,x,y,w,px,col,al='left',ls=0){c.font=F(w,px);c.fillStyle=col;c.textAlign=al;c.letterSpacing=ls+'px';c.fillText(s,x,y);c.letterSpacing='0px';c.textAlign='left';}
// the G, centred on its ring; d = outer diameter of the ring
const D=560;
function gGeom(cx=CX,cy=CY,d=D){const A=LOGO.arc,k=d/(2*(A.r+A.w/2));return{A,k,x:cx-A.cx*k,y:cy-A.cy*k,gx:cx,gy:cy,dot:{x:cx+(LOGO.dot.x-A.cx)*k,y:cy+(LOGO.dot.y-A.cy)*k,r:LOGO.dot.r*k}};}
function G(c,{mono=false,color='#FFFFFF',d=D,cx=CX,cy=CY}={}){const g=gGeom(cx,cy,d);drawFirma(c,g.x,g.y,g.k,{wordmark:false,color,mono});}
function gArc(c,g){c.beginPath();c.arc(g.gx,g.gy,g.A.r*g.k,g.A.a1,g.A.a0,true);}
function blobs(x,list){list.forEach(([px,py,r,a,b])=>{const g=x.createLinearGradient(px-r,py-r,px+r,py+r);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,TAU);x.fill();});}

const V=[];const def=(id,name,group,draw,light)=>V.push({id,name,group,draw,light});

/* ---------------- A · inside the brand book ---------------- */
def('a01-clasico','Clásico','A',c=>{fill(c,'#000');G(c);},c=>{fill(c,'#FFFFFF');G(c,{mono:true,color:'#0B0D11'});});
def('a02-superficie','Superficie','A',c=>{fill(c,lin(c,0,0,W,W,['#1A1E27','#090A0E']));radial(c,260,200,560,hex('#2FA0FF'),0.08);grain(c,0.05);G(c);},
  c=>{fill(c,lin(c,0,0,W,W,['#FFFFFF','#E4E9F1']));grain(c,0.04);G(c,{mono:true,color:'#0B0D11'});});
def('a03-noche','Noche','A',c=>{const g=c.createRadialGradient(512,560,40,512,560,760);g.addColorStop(0,'#0D3270');g.addColorStop(1,'#020713');fill(c,g);radial(c,512,512,300,hex('#2FA0FF'),0.18);grain(c,0.06);G(c);});
def('a04-aurora','Aurora','A',c=>{fill(c,'#000');const L=layerP(x=>[[130,170,480,'#2FA0FF'],[910,150,430,'#A65CFF'],[900,900,470,'#FF3DAE'],[120,880,460,'#25E8C8']].forEach(([px,py,r,col])=>radial(x,px,py,r,hex(col),0.85)));
  putP(c,L,{filter:blur(90),alpha:0.85});radial(c,CX,CY,470,[0,0,0],0.6);grain(c,0.07);G(c);});
def('a05-anillo-rgb','Anillo RGB','A',c=>{fill(c,'#000');radial(c,CX,CY,480,hex('#0B2A55'),0.5);
  const ring=(x,w)=>{const g=x.createConicGradient(-Math.PI/2,CX,CY);['#2FA0FF','#A65CFF','#FF3DAE','#25E8C8','#2FA0FF'].forEach((s,i)=>g.addColorStop(i/4,s));x.strokeStyle=g;x.lineWidth=w;x.beginPath();x.arc(CX,CY,395,0,TAU);x.stroke();};
  put(c,layer(x=>ring(x,60)),{filter:blur(46),alpha:0.55});put(c,layer(x=>ring(x,22)),{filter:blur(10),alpha:0.7});ring(c,10);G(c,{d:500});});
def('a06-azul-electrico','Azul eléctrico','A',c=>{fill(c,lin(c,0,0,W,W,['#4DB2FF','#2FA0FF','#1677E0']));radial(c,280,220,520,[255,255,255],0.16);grain(c,0.04);G(c,{mono:true});});
def('a07-azul-francia','Azul Francia','A',c=>{const g=c.createRadialGradient(400,330,30,512,560,800);g.addColorStop(0,'#1A8CDF');g.addColorStop(0.5,'#0072BB');g.addColorStop(1,'#00396B');fill(c,g);grain(c,0.05);G(c,{mono:true});});
def('a08-en-azul','Disco azul','A',c=>{fill(c,'#000');const g=c.createRadialGradient(400,360,30,512,512,420);g.addColorStop(0,'#46B4FF');g.addColorStop(1,'#0F7FE0');c.fillStyle=g;c.beginPath();c.arc(CX,CY,400,0,TAU);c.fill();G(c,{mono:true,d:470});},
  c=>{fill(c,'#FFFFFF');const g=c.createRadialGradient(400,360,30,512,512,420);g.addColorStop(0,'#46B4FF');g.addColorStop(1,'#0F7FE0');c.fillStyle=g;c.beginPath();c.arc(CX,CY,400,0,TAU);c.fill();G(c,{mono:true,d:470});});
def('a09-vidrio-noche','Vidrio noche','A',c=>{const BG=layerP(x=>{x.fillStyle='#02040C';x.fillRect(-PAD,-PAD,W+2*PAD,W+2*PAD);blobs(x,[[230,240,370,'#2F8CFF','#0B3FB0'],[840,210,320,'#8A4DFF','#3E1C9E'],[820,820,380,'#1FD8C0','#086B73'],[160,860,240,'#FF3DAE','#8A1760']]);});
  putP(c,BG,{filter:blur(32)});fill(c,'rgba(255,255,255,0.05)');const g=c.createRadialGradient(290,230,0,290,230,700);g.addColorStop(0,'rgba(255,255,255,0.22)');g.addColorStop(0.55,'rgba(255,255,255,0.03)');g.addColorStop(1,'rgba(255,255,255,0)');fill(c,g);grain(c,0.05);G(c);});
def('a10-mesh-neon','Mesh neón','A',c=>{const L=layerP(x=>{x.fillStyle='#0A2C7A';x.fillRect(-PAD,-PAD,W+2*PAD,W+2*PAD);[[190,200,570,'#3AAEFF',1],[880,140,530,'#040A3A',1],[860,870,570,'#7FDCFF',0.6],[130,870,600,'#1A18A0',1],[570,580,320,'#0090FF',0.55]].forEach(([px,py,r,col,a])=>radial(x,px,py,r,hex(col),a));});
  putP(c,L,{filter:`${blur(66)} saturate(1.12)`});const Gl=layerP(x=>{x.globalCompositeOperation='screen';radial(x,1030,40,360,hex('#FF3DAE'),0.75);radial(x,-10,1010,400,hex('#A65CFF'),0.75);radial(x,1000,1000,360,hex('#25E8C8'),0.7);});
  putP(c,Gl,{filter:blur(56),op:'screen'});grain(c,0.08);G(c,{mono:true});});
def('a11-degrade-rgb','Degradé RGB','A',c=>{fill(c,lin(c,0,0,W,W,['#2FA0FF','#A65CFF','#FF3DAE']));radial(c,900,950,420,hex('#25E8C8'),0.55);radial(c,CX,CY,420,[0,0,0],0.12);grain(c,0.05);G(c,{mono:true});});
def('a12-hielo','Hielo','A',c=>{fill(c,'#061A33');radial(c,CX,CY,520,hex('#0B3A72'),0.6);G(c,{mono:true,color:'#2FA0FF'});},
  c=>{const g=c.createRadialGradient(512,420,20,512,560,760);g.addColorStop(0,'#FFFFFF');g.addColorStop(0.6,'#E3F1FF');g.addColorStop(1,'#BCDDFF');fill(c,g);G(c,{mono:true,color:'#0072BB'});});

/* ---------------- B · explorations that bend the brand book ---------------- */
// chrome, drawn: a tube's shading across its width (radial from the ring's centre), light and shade round the ring, glints
def('b01-cromo','Cromo','B',c=>{const bg=c.createRadialGradient(470,420,40,512,560,760);bg.addColorStop(0,'#13254F');bg.addColorStop(0.6,'#06102A');bg.addColorStop(1,'#02040B');fill(c,bg);
  const g=gGeom(),r=g.A.r*g.k,w=g.A.w*g.k,ri=r-w/2,ro=r+w/2,tube=(x,style)=>{x.strokeStyle=style;x.lineWidth=w;x.lineCap='round';gArc(x,g);x.stroke();};
  const across=c.createRadialGradient(g.gx,g.gy,ri,g.gx,g.gy,ro);[[0,'#141C33'],[0.1,'#5C6A8C'],[0.22,'#F3F6FC'],[0.36,'#9AA6C0'],[0.52,'#26314D'],[0.68,'#7D8BAA'],[0.84,'#E8EDF7'],[0.95,'#6A7899'],[1,'#1A2340']].forEach(([o,col])=>across.addColorStop(o,col));
  tube(c,across);
  const round=c.createConicGradient(-Math.PI*0.75,g.gx,g.gy);[[0,'rgba(255,255,255,0.35)'],[0.25,'rgba(255,255,255,0)'],[0.5,'rgba(0,0,0,0.45)'],[0.75,'rgba(0,0,0,0.1)'],[1,'rgba(255,255,255,0.35)']].forEach(([o,col])=>round.addColorStop(o,col));
  c.save();c.globalCompositeOperation='overlay';tube(c,round);c.restore();
  const glint=(a,s0)=>{const x=g.gx+Math.cos(a)*(ri+w*0.24),y=g.gy+Math.sin(a)*(ri+w*0.24);put(c,layer(l=>radial(l,x,y,s0,[255,255,255],0.95)),{filter:blur(4),op:'screen'});};
  glint(-2.35,26);glint(-2.0,14);glint(2.6,12);
  const gd=c.createRadialGradient(g.dot.x-g.dot.r*0.35,g.dot.y-g.dot.r*0.4,0,g.dot.x,g.dot.y,g.dot.r);gd.addColorStop(0,'#BFE6FF');gd.addColorStop(0.35,'#2FA0FF');gd.addColorStop(1,'#0A57B0');c.fillStyle=gd;c.beginPath();c.arc(g.dot.x,g.dot.y,g.dot.r,0,TAU);c.fill();
  grain(c,0.04);});
def('b02-neon','Neón','B',c=>{fill(c,'#04060B');radial(c,CX,CY,520,hex('#0A1E40'),0.6);const g=gGeom(),w=g.A.w*g.k*0.36;
  const tube=(x,lw,col)=>{x.lineCap='round';x.strokeStyle=col;x.lineWidth=lw;gArc(x,g);x.stroke();x.fillStyle=col;x.beginPath();x.arc(g.dot.x,g.dot.y,g.dot.r*0.62,0,TAU);x.fill();};
  put(c,layer(x=>tube(x,w*1.6,'#2FA0FF')),{filter:blur(60),op:'screen'});put(c,layer(x=>tube(x,w*1.2,'#5AB8FF')),{filter:blur(18),op:'screen'});put(c,layer(x=>tube(x,w,'#7CC8FF')),{op:'screen'});put(c,layer(x=>tube(x,w*0.38,'#F2FAFF')),{filter:blur(1),op:'screen'});
  grain(c,0.05);});
def('b03-g-rgb','G en RGB','B',c=>{fill(c,'#000');radial(c,CX,CY,500,hex('#0B1A33'),0.6);const g=gGeom(),cg=c.createConicGradient(-Math.PI*0.25,g.gx,g.gy);['#2FA0FF','#A65CFF','#FF3DAE','#25E8C8','#2FA0FF'].forEach((s,i)=>cg.addColorStop(i/4,s));
  put(c,layer(x=>{x.strokeStyle=cg;x.lineCap='round';x.lineWidth=g.A.w*g.k;gArc(x,g);x.stroke();}),{filter:blur(40),alpha:0.5});c.strokeStyle=cg;c.lineCap='round';c.lineWidth=g.A.w*g.k;gArc(c,g);c.stroke();
  c.fillStyle='#fff';c.beginPath();c.arc(g.dot.x,g.dot.y,g.dot.r,0,TAU);c.fill();});
def('b04-g-de-vidrio','G de vidrio','B',c=>{const BG=layerP(x=>{x.fillStyle='#03050C';x.fillRect(-PAD,-PAD,W+2*PAD,W+2*PAD);blobs(x,[[300,330,250,'#62C4FF','#0B5BD6'],[760,270,190,'#B07BFF','#4A2BD1'],[690,760,240,'#2FE0FF','#0077C8'],[250,780,150,'#FF6BC0','#C2185B']]);});
  putP(c,BG);const g=gGeom(),glass=layer(x=>{x.save();x.setTransform(1,0,0,1,0,0);x.filter=blur(26);x.drawImage(BG,-PAD*Z,-PAD*Z);x.restore();x.fillStyle='rgba(255,255,255,0.16)';x.fillRect(0,0,W,W);
    const h=x.createLinearGradient(g.gx-280,g.gy-280,g.gx+280,g.gy+280);h.addColorStop(0,'rgba(255,255,255,0.45)');h.addColorStop(0.5,'rgba(255,255,255,0.05)');h.addColorStop(1,'rgba(255,255,255,0.2)');x.fillStyle=h;x.fillRect(0,0,W,W);
    x.save();x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='destination-in';x.drawImage(layer(m=>G(m,{mono:true,color:'#fff'})),0,0);x.restore();});   // one mask, one operation
  put(c,layer(x=>{G(x,{mono:true,color:'rgba(0,0,0,0.5)'});}),{filter:blur(16)});put(c,glass);
  c.fillStyle='#2FA0FF';c.beginPath();c.arc(g.dot.x,g.dot.y,g.dot.r*0.98,0,TAU);c.fill();});

/* ---------------- render + board ---------------- */
function renderBig(v,mode){const cv=mk(S,S),c=cv.getContext('2d');c.setTransform(Z,0,0,Z,0,0);((mode==='light'&&v.light)||v.draw)(c);return cv;}
function halve(cv){const o=mk(cv.width/2,cv.height/2),c=o.getContext('2d');c.imageSmoothingQuality='high';c.drawImage(cv,0,0,o.width,o.height);return o;}
window.VARIANTS=V.map(v=>({id:v.id,name:v.name,light:!!v.light}));
window.renderVariant=(id,mode)=>halve(renderBig(V.find(v=>v.id===id),mode)).toDataURL('image/png');
// the iOS mask: a superellipse (close to Apple's continuous corners)
function squircle(c,x,y,s){const n=5,a=s/2,cx=x+a,cy=y+a;c.beginPath();for(let i=0;i<=160;i++){const t=i/160*TAU,ct=Math.cos(t),st=Math.sin(t);const px=cx+a*Math.sign(ct)*Math.abs(ct)**(2/n),py=cy+a*Math.sign(st)*Math.abs(st)**(2/n);i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();}
function icon(c,img,x,y,s){c.save();squircle(c,x,y,s);c.clip();c.imageSmoothingQuality='high';c.drawImage(img,x,y,s,s);c.restore();}
const OTHER=[['#FF9F0A','#FF6B00'],['#34C759','#1E9E45'],['#5E5CE6','#3A38C9'],['#FF375F','#D70F3F'],['#64D2FF','#2AA7E0'],['#FFD60A','#F2B705']];
function homeTile(c,x,y,w,h,img,dark){c.save();c.beginPath();c.roundRect(x,y,w,h,26);c.clip();
  const g=c.createLinearGradient(x,y,x+w,y+h);if(dark){g.addColorStop(0,'#141A2B');g.addColorStop(1,'#05070C');}else{g.addColorStop(0,'#F4F7FC');g.addColorStop(1,'#D7E2F0');}c.fillStyle=g;c.fillRect(x,y,w,h);
  const s=96,gap=(w-3*s)/4;for(let i=0;i<3;i++){const ix=x+gap+i*(s+gap),iy=y+16;if(i===1)icon(c,img,ix,iy,s);else{const[a,b]=OTHER[(i*3+(dark?1:0))%OTHER.length];squircle(c,ix,iy,s);c.fillStyle=lin(c,ix,iy,ix+s,iy+s,[a,b]);c.fill();}
    txt(c,i===1?'GIZE':['Fotos','Mapas','Música','Notas'][(i+(dark?1:0))%4],ix+s/2,iy+s+26,500,19,dark?'#FFFFFF':'#1C1F26','center');}
  c.restore();}
window.renderBoard=()=>{const cols=4,CW=520,CH_=700,gap=40,M=90,head=280,rows=Math.ceil(V.length/cols),BW=M*2+cols*CW+(cols-1)*gap,BH=head+rows*(CH_+gap)+M,cv=mk(BW,BH),c=cv.getContext('2d');
  c.fillStyle='#0B0D11';c.fillRect(0,0,BW,BH);drawFirma(c,M,72,0.95,{});txt(c,'Íconos para la app · '+V.length+' opciones',M+300,114,800,52,'#fff');
  txt(c,'Cada uno con la máscara de iOS, en grande y en tamaño real sobre una pantalla oscura y una clara. A: dentro del manual · B: exploraciones que lo estiran.',M+300,162,500,24,'#8F98A6');
  const rg=c.createLinearGradient(M,0,BW-M,0);['#2FA0FF','#A65CFF','#FF3DAE','#25E8C8'].forEach((s,i)=>rg.addColorStop(i/3,s));c.fillStyle=rg;c.fillRect(M,206,BW-2*M,3);
  V.forEach((v,i)=>{const col=i%cols,row=Math.floor(i/cols),x=M+col*(CW+gap),y=head+row*(CH_+gap),dk=renderBig(v,'dark'),lt=renderBig(v,'light');
    c.fillStyle='#12151B';c.beginPath();c.roundRect(x,y,CW,CH_,28);c.fill();
    icon(c,dk,x+CW/2-130,y+34,260);
    txt(c,v.id.slice(0,3).toUpperCase(),x+30,y+342,700,22,v.group==='A'?'#2FA0FF':'#FF3DAE');txt(c,v.name,x+90,y+342,700,26,'#fff');if(v.light)txt(c,'+ versión clara',x+CW-30,y+342,500,19,'#8F98A6','right');
    homeTile(c,x+24,y+366,CW-48,150,dk,true);homeTile(c,x+24,y+528,CW-48,150,lt,false);});
  return cv.toDataURL('image/png');};
window.READY=false;
(async()=>{await Promise.all([500,600,700,800].map(w=>document.fonts.load(F(w,40))));await loadLogo();window.READY=true;})();
</script></body></html>
