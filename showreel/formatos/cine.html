<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIZE · Nadie te ve a esta hora</title><link rel="stylesheet" href="../../brand/fonts/outfit.css">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head><body><canvas id="out"></canvas>
<script type="module">
/* "Nadie te ve a esta hora" · ~27.5 s, 9:16 or 4:5. Cinematic storytelling with no people in it, only places and
   light: cinema bars close in; 6:02, the phone lights the dark room (a message from the coach); rain on the window;
   the gym's fluorescent light flickers on over a barbell; the phone on the bench, a set ticked and a PR; a montage
   of weeks cut on the beat; sunrise over the city ("Nadie te vio. Pero se nota."); the bars open on «Entrená con
   GIZE.» and the end card. Slow pushes, dips to black, grain, anamorphic flares, subtitles. */
import {C,RGB,E,clamp,lerp,prog,glow,rr,txt,tw,F,hash,createReel,riseWords,rgbLine,fitSize,tick} from '../lib/engine.js';
import {endcard,endcardBg,endcardCues} from '../lib/endcard.js';
import {kOf,lines,confetti} from '../trends/kit.js';

const SC=[[0,3.6],[3.6,7.0],[7.0,10.6],[10.6,14.0],[14.0,17.4],[17.4,21.0],[21.0,23.4]],T_END=23.4,DUR=T_END+4;
const SUB=[['Nadie te ve a esta hora.',1.7,3.3],['Afuera llueve. Adentro, la cama insiste.',4.1,6.7],['Los primeros minutos cuestan.',7.9,10.3],['Después, ya no.',11.7,13.7],
  ['Una semana. Otra. Otra más.',14.25,17.1],['Nadie te vio.',17.9,20.7],['Pero se nota.',18.9,20.7]];
const MB=60/140,CUT=MB;   // the montage cuts on the beat
const barH=L=>L.fmt==='4x5'?120:230;

/* ---------------- helpers ---------------- */
function flare(c,x,y,len,a,col=[90,170,255]){if(a<=0)return;const g=c.createLinearGradient(x-len,0,x+len,0);g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(0.5,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);
  c.save();c.globalCompositeOperation='lighter';c.fillStyle=g;c.fillRect(x-len,y-2,2*len,4);c.globalAlpha=0.5;c.fillRect(x-len*0.6,y-7,1.2*len,14);c.restore();}
function phone(c,cx,cy,w,h,rot,screen){c.save();c.translate(cx,cy);c.rotate(rot);c.translate(-w/2,-h/2);c.fillStyle='#0C0E13';rr(c,-14,-14,w+28,h+28,w*0.13);c.fill();c.strokeStyle='#2A2E37';c.lineWidth=2;c.stroke();
  c.save();rr(c,0,0,w,h,w*0.11);c.clip();screen(c,w,h);c.restore();c.fillStyle='#000';rr(c,w/2-w*0.13,14,w*0.26,w*0.07,w*0.035);c.fill();c.restore();}
function push(c,L,u,dur,amt=0.07,dx=0,dy=0){const s=1+amt*u/dur;c.translate(L.CX+dx*u/dur,L.CY+dy*u/dur);c.scale(s,s);c.translate(-L.CX,-L.CY);}

/* ---------------- 1 · 6:02 ---------------- */
function s1(c,L,u,k){c.fillStyle='#030409';c.fillRect(0,0,L.W,L.H);const lit=u<0.55?0:u<0.6?0.5:u<0.66?0.15:1;c.save();push(c,L,u,3.6,0.08);
  glow(c,L.CX,L.sc,L.H*0.55,[70,90,200],0.32*lit);c.fillStyle=`rgba(40,50,90,${0.25*lit})`;c.fillRect(0,L.sc+560*k,L.W,L.H);   // the nightstand top catches the light
  const vib=u>1.25&&u<1.65?Math.sin(u*120)*4*k:0,w=500*k,h=1040*k;
  phone(c,L.CX+vib,L.sc-20*k,w,h,-0.06,(c,w,h)=>{if(lit<=0){c.fillStyle='#050608';c.fillRect(0,0,w,h);const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(255,255,255,0.06)');g.addColorStop(0.5,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,w,h);return;}
    const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1A1346');g.addColorStop(1,'#060A1C');c.fillStyle=g;c.fillRect(0,0,w,h);glow(c,w*0.1,h*0.15,w,RGB.purple,0.35);glow(c,w,h*0.8,w,RGB.blue,0.3);
    c.globalAlpha=lit;txt(c,'martes',w/2,h*0.16,500,28*k,'rgba(255,255,255,0.8)','center');txt(c,'6:02',w/2,h*0.31,200,190*k,'#fff','center');
    const na=E.outCubic(clamp((u-1.2)/0.35));if(na>0){c.save();c.globalAlpha=lit*na;c.translate(0,(1-na)*-40*k);const nx=20*k,ny=h*0.39,nw=w-40*k,nh=170*k;c.fillStyle='rgba(255,255,255,0.16)';rr(c,nx,ny,nw,nh,30*k);c.fill();
      c.fillStyle='#000';rr(c,nx+20*k,ny+24*k,62*k,62*k,15*k);c.fill();GizeOrb.ball(c,nx+51*k,ny+55*k,13*k,{k:1.4});txt(c,'GIZE',nx+100*k,ny+48*k,600,22*k,'rgba(255,255,255,0.75)');txt(c,'ahora',nx+nw-22*k,ny+48*k,500,22*k,'rgba(255,255,255,0.6)','right');
      txt(c,'Martina',nx+100*k,ny+86*k,800,28*k,'#fff');lines(c,'Hoy toca piernas 🦵 ¿Arrancamos?',nx+100*k,ny+124*k,nw-120*k,500,26*k,'#fff',1.2,'left');c.restore();}
    c.globalAlpha=1;});
  c.restore();flare(c,L.CX,L.sc-20*k,L.W*0.7,0.5*lit*(0.8+0.2*Math.sin(u*3)));}

/* ---------------- 2 · rain on the window ---------------- */
function s2(c,L,u,k){c.fillStyle='#05070D';c.fillRect(0,0,L.W,L.H);c.save();push(c,L,u,3.4,0.06,0,-30*k);
  const cols=[[255,170,80],[255,210,140],[47,160,255],[255,61,174],[120,140,255]];for(let i=0;i<38;i++){const x=L.W*hash(i+3)+Math.sin(u*0.4+i)*12,y=L.H*(0.2+0.6*hash(i+21)),r=(50+120*hash(i+7))*k;glow(c,x,y,r,cols[i%5],0.16+0.22*hash(i+5));}
  // droplets on the glass, and a few running down
  for(let i=0;i<160;i++){const x=L.W*hash(i*1.3),y=L.H*hash(i*2.7+1),r=(2+5*hash(i+0.5))*k;c.fillStyle='rgba(180,200,230,0.18)';c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle='rgba(255,255,255,0.35)';c.beginPath();c.arc(x-r*0.3,y-r*0.3,r*0.35,0,7);c.fill();}
  for(let i=0;i<14;i++){const x=L.W*hash(i+90),sp=(120+260*hash(i+40))*k,y=((u*sp+L.H*hash(i+70))%(L.H*1.1))-40,len=(80+120*hash(i+11))*k;const g=c.createLinearGradient(0,y-len,0,y);g.addColorStop(0,'rgba(200,220,255,0)');g.addColorStop(1,'rgba(200,220,255,0.45)');
    c.strokeStyle=g;c.lineWidth=3*k;c.beginPath();c.moveTo(x,y-len);c.quadraticCurveTo(x+6*k,y-len/2,x,y);c.stroke();c.fillStyle='rgba(220,235,255,0.6)';c.beginPath();c.arc(x,y,5*k,0,7);c.fill();}
  // the window frame
  c.fillStyle='#020306';c.fillRect(L.CX-14*k,-100,28*k,L.H+200);c.fillRect(-100,L.sc+120*k,L.W+200,26*k);c.restore();}

/* ---------------- 3 · the gym light ---------------- */
function lightAt(u){const fl=[[0.35,0.42],[0.55,0.6],[0.72,0.78]];if(u<0.35)return 0;for(const[a,b]of fl)if(u>=a&&u<b)return 0.85;return u>=0.9?1:0.05;}
function barbell(c,cx,y,k,lit){const bw=900*k;c.fillStyle='#16181D';c.fillRect(cx-bw/2,y-7*k,bw,14*k);
  for(const s of[-1,1])for(const[o,h,w]of[[300,300,46],[352,260,40],[398,190,30]]){const x=cx+s*o*k-(s<0?w*k:0);c.fillStyle='#0D0E12';rr(c,x,y-h*k/2,w*k,h*k,8*k);c.fill();c.fillStyle=`rgba(255,240,215,${0.28*lit})`;c.fillRect(x,y-h*k/2,w*k,4*k);}
  c.fillStyle='#24272E';for(const s of[-1,1])c.fillRect(cx+s*250*k-(s<0?24*k:0),y-16*k,24*k,32*k);}
function s3(c,L,u,k){const lit=lightAt(u);c.fillStyle='#030304';c.fillRect(0,0,L.W,L.H);c.save();push(c,L,u,3.6,0.09,0,20*k);
  const top=L.safe.top-60*k,floor=L.sc+330*k;
  if(lit>0){const g=c.createLinearGradient(0,top,0,floor+80*k);g.addColorStop(0,`rgba(255,236,205,${0.4*lit})`);g.addColorStop(1,`rgba(255,236,205,${0.05*lit})`);c.fillStyle=g;c.beginPath();c.moveTo(L.CX-80*k,top);c.lineTo(L.CX+80*k,top);c.lineTo(L.CX+560*k,floor+60*k);c.lineTo(L.CX-560*k,floor+60*k);c.fill();
    c.save();c.translate(L.CX,floor+60*k);c.scale(1,0.18);glow(c,0,0,640*k,[255,230,190],0.5*lit);c.restore();
    for(let i=0;i<70;i++){const yy=top+(floor-top)*((hash(i)+u*0.03*(0.5+hash(i+3)))%1),spread=lerp(80,540,(yy-top)/(floor-top))*k,x=L.CX+(hash(i+9)-0.5)*2*spread+Math.sin(u+i)*10;c.fillStyle=`rgba(255,240,220,${0.5*lit*hash(i+2)})`;c.fillRect(x,yy,3,3);}}
  c.fillStyle=`rgba(255,240,220,${0.9*lit})`;rr(c,L.CX-110*k,top-10*k,220*k,18*k,9*k);c.fill();glow(c,L.CX,top,260*k,[255,236,205],0.4*lit);
  barbell(c,L.CX,floor-10*k,k,lit);c.restore();flare(c,L.CX,L.safe.top-62*k,L.W*0.6,0.45*lit,[255,220,170]);}

/* ---------------- 4 · the phone on the bench ---------------- */
function s4(c,L,u,k){c.fillStyle='#050507';c.fillRect(0,0,L.W,L.H);c.save();push(c,L,u,3.4,0.07,-20*k,0);
  for(let i=0;i<16;i++)glow(c,L.W*hash(i+50),L.H*(0.15+0.5*hash(i+60)),(80+140*hash(i+2))*k,[255,225,180],0.12);
  c.fillStyle='#0E0F12';c.fillRect(-100,L.sc+430*k,L.W+200,L.H);   // the bench
  const w=520*k,h=880*k;phone(c,L.CX,L.sc+20*k,w,h,0.04,(c,w,h)=>{c.fillStyle='#000';c.fillRect(0,0,w,h);glow(c,0,h*0.1,w*1.1,RGB.blue,0.35);glow(c,w,h*0.95,w,RGB.pink,0.3);
    txt(c,'Sentadilla',30*k,110*k,800,44*k,'#fff');txt(c,'La vez pasada · 80 kg × 8',30*k,156*k,500,24*k,C.text2);
    const rows=[['82,5','8',0.6],['82,5','8',1.4],['82,5','9',2.2]];rows.forEach(([kg,r,t0],i)=>{const y=210*k+i*120*k,done=u>=t0;c.fillStyle='#14171D';rr(c,24*k,y,w-48*k,100*k,22*k);c.fill();
      txt(c,String(i+1),56*k,y+62*k,800,30*k,C.text2,'center');txt(c,`${kg} kg`,100*k,y+62*k,800,34*k,'#fff');txt(c,`× ${r}`,290*k,y+62*k,800,34*k,'#fff');
      const bx=w-110*k,by=y+18*k,bs=64*k;c.fillStyle=done?'#fff':'#1E2129';rr(c,bx,by,bs,bs,16*k);c.fill();if(done){c.save();c.beginPath();c.rect(bx,by,bs*clamp((u-t0)/0.15),bs);c.clip();tick(c,bx+bs/2,by+bs/2,28*k,'#000',6*k);c.restore();}});
    if(u>=2.45){const e=E.outBack(clamp((u-2.45)/0.3));c.save();c.translate(w/2,620*k);c.scale(e,e);c.fillStyle=C.gold;rr(c,-170*k,-36*k,340*k,72*k,36*k);c.fill();txt(c,'🏆 PR +2,5 kg',0,12*k,900,34*k,'#000','center');c.restore();
      for(let i=0;i<20;i++){const an=hash(i)*Math.PI*2,e2=E.outCubic(clamp((u-2.45)/0.7)),r=(120+200*hash(i+3))*k*e2;c.fillStyle=`rgba(255,201,64,${1-e2})`;c.fillRect(w/2+Math.cos(an)*r,620*k+Math.sin(an)*r,7,7);}}});
  c.restore();}

/* ---------------- 5 · the montage ---------------- */
const WEEKS=[1,2,3,5,7,9,11,12];
function plate(c,x,y,R,rot,k){c.save();c.translate(x,y);c.rotate(rot);const g=c.createRadialGradient(-R*0.3,-R*0.3,R*0.1,0,0,R);g.addColorStop(0,'#3A3D45');g.addColorStop(1,'#0E0F12');c.fillStyle=g;c.beginPath();c.arc(0,0,R,0,7);c.fill();
  c.strokeStyle='rgba(255,255,255,0.12)';c.lineWidth=6*k;for(const f of[0.92,0.62,0.3]){c.beginPath();c.arc(0,0,R*f,0,7);c.stroke();}c.fillStyle='#050506';c.beginPath();c.arc(0,0,R*0.16,0,7);c.fill();
  txt(c,'20 KG',0,-R*0.7,800,R*0.16,'rgba(255,255,255,0.55)','center',4*k);c.restore();}
function s5(c,L,u,k){const i=clamp(Math.floor(u/CUT),0,WEEKS.length-1),v=u-i*CUT,kind=i%4;c.fillStyle='#040405';c.fillRect(0,0,L.W,L.H);c.save();const s=1+0.06*v/CUT;c.translate(L.CX,L.sc);c.scale(s,s);c.translate(-L.CX,-L.sc);
  if(kind===0)plate(c,L.CX,L.sc,430*k,v*0.8+i,k);
  else if(kind===1){for(let q=0;q<140;q++){const an=hash(q+i*7)*Math.PI*2,sp=(200+900*hash(q+3))*k,e=E.outCubic(clamp(v/0.4)),r=sp*e*0.6;c.fillStyle=`rgba(240,240,235,${0.5*(1-e*0.6)*hash(q+1)})`;c.beginPath();c.arc(L.CX+Math.cos(an)*r,L.sc+Math.sin(an)*r*0.7,(6+18*hash(q+8))*k*(0.5+e),0,7);c.fill();}}
  else if(kind===2){const g=c.createLinearGradient(0,0,0,L.H);g.addColorStop(0,'rgba(255,236,205,0.5)');g.addColorStop(1,'rgba(255,236,205,0)');c.fillStyle=g;c.beginPath();c.moveTo(L.CX-60*k,0);c.lineTo(L.CX+60*k,0);c.lineTo(L.CX+480*k,L.H);c.lineTo(L.CX-480*k,L.H);c.fill();barbell(c,L.CX,L.sc+300*k,k,1);}
  else{c.fillStyle='#fff';rr(c,L.CX-150*k,L.sc-150*k,300*k,300*k,60*k);c.fill();c.save();c.beginPath();c.rect(L.CX-150*k,L.sc-150*k,300*k*clamp(v/0.12),300*k);c.clip();tick(c,L.CX,L.sc,130*k,'#000',26*k);c.restore();}
  c.restore();txt(c,`SEMANA ${String(WEEKS[i]).padStart(2,'0')}`,L.CX,L.sc-(L.fmt==='4x5'?440:560)*k,300,64*k,'rgba(255,255,255,0.92)','center',18*k);}

/* ---------------- 6 · sunrise ---------------- */
function s6(c,L,u,k){const e=E.inOutCubic(clamp(u/3.6)),hz=L.sc+300*k;const g=c.createLinearGradient(0,0,0,hz);g.addColorStop(0,`rgb(${lerp(8,28,e)|0},${lerp(14,40,e)|0},${lerp(40,92,e)|0})`);g.addColorStop(0.6,`rgb(${lerp(60,200,e)|0},${lerp(30,90,e)|0},${lerp(80,110,e)|0})`);
  g.addColorStop(1,`rgb(${lerp(140,255,e)|0},${lerp(70,150,e)|0},${lerp(60,70,e)|0})`);c.fillStyle=g;c.fillRect(0,0,L.W,L.H);c.save();push(c,L,u,3.6,0.05,0,40*k);
  const sy=hz+90*k-430*k*e;glow(c,L.CX,sy,700*k,[255,170,90],0.55);glow(c,L.CX,sy,220*k,[255,230,180],0.9);c.fillStyle='#FFE9C6';c.beginPath();c.arc(L.CX,sy,70*k,0,7);c.fill();
  // the skyline
  c.fillStyle='#08070C';let x=-60;for(let i=0;x<L.W+60;i++){const w=(70+120*hash(i+4))*k,h=(120+360*hash(i+9))*k*(0.35+0.65*Math.min(1,Math.abs(x+w/2-L.CX)/(380*k)));c.fillRect(x,hz-h,w,L.H);if(hash(i+30)>0.6)c.fillRect(x+w*0.4,hz-h-60*k,6*k,60*k);
    for(let q=0;q<8;q++){if(hash(i*13+q)>0.82){c.fillStyle='rgba(255,200,120,0.6)';c.fillRect(x+10*k+(q%3)*22*k,hz-h+20*k+Math.floor(q/3)*34*k,10*k,14*k);c.fillStyle='#08070C';}}x+=w+4*k;}
  c.fillRect(-100,hz,L.W+200,L.H);c.restore();flare(c,L.CX,sy,L.W*0.9,0.6,[255,190,120]);}

/* ---------------- compose ---------------- */
function subs(c,L,t,k){const y=L.fmt==='4x5'?L.H-barH(L)-70*k:L.safe.bottom-40*k;for(const[s,a,b]of SUB){if(t<a||t>b+0.35)continue;const al=E.outCubic(clamp((t-a)/0.35))*(1-clamp((t-b)/0.35));
  const two=SUB.find(x=>x[0]==='Pero se nota.'),off=s==='Nadie te vio.'&&t>=two[1]?-64*k:0;c.save();c.globalAlpha=al;c.shadowColor='rgba(0,0,0,0.9)';c.shadowBlur=18;
  txt(c,s,L.CX,y+off+(1-al)*10*k,s==='Pero se nota.'?600:400,fitSize(s,400,L.W-140,46*k),'#fff','center',1.5*k);c.restore();}}
const SCN=[s1,s2,s3,s4,s5,s6];
createReel({dur:DUR,
  hits:[[SC[2][0]+0.9,4,0],[SC[4][0],6,0.01],...WEEKS.map((_,i)=>[SC[4][0]+i*CUT,3,0.006]),[SC[5][0],8,0.015],[T_END+0.9375,4,0.01]],fast:[[SC[4][0]-0.05,SC[5][0]+0.1]],
  bloom:t=>t>=SC[5][0]&&t<SC[6][0]?0.5:0.4,vignette:()=>0.55,
  draw(c,t,L,P){const k=kOf(L);const i=SC.findIndex(([a,b])=>t>=a&&t<b);
    if(i>=0&&i<6){const[a,b]=SC[i],u=t-a;SCN[i](c,L,u,k);
      // dips to black between scenes (hard cuts in and out of the montage)
      const din=i===5?0:1-E.outCubic(clamp(u/0.35)),dout=i===3||i===4?0:clamp((u-(b-a-0.3))/0.3);const d=Math.max(din,dout);if(d>0){c.fillStyle=`rgba(0,0,0,${d})`;c.fillRect(0,0,L.W,L.H);}
      if(i===5&&u<0.12){c.fillStyle=`rgba(255,240,220,${0.6*(1-u/0.12)})`;c.fillRect(0,0,L.W,L.H);}}
    else if(t<T_END){c.fillStyle='#000';c.fillRect(0,0,L.W,L.H);const u=t-SC[6][0];glow(c,L.CX,L.sc,L.H*0.6,RGB.blue,0.18*clamp(u/0.6));
      riseWords(c,{lines:['Entrená con GIZE.'],x:L.CX,y:L.sc+30*k,lh:100*k,t0:SC[6][0]+0.2,t1:T_END-0.15,px:88*k,weight:300,col:'#fff',key:[0,'GIZE.']});}
    // grain
    c.save();c.globalAlpha=0.06;for(let q=0;q<900;q++){const x=hash(q+Math.floor(t*24)*13.1)*L.W,y=hash(q*2.3+Math.floor(t*24)*7.7)*L.H;c.fillStyle=q%2?'#fff':'#000';c.fillRect(x,y,2,2);}c.restore();
    // the cinema bars: close in at the start, open on the brand line
    const bh=barH(L)*E.inOutCubic(clamp(t/1.2))*(1-E.inOutCubic(clamp((t-SC[6][0])/0.9)));if(bh>0){c.fillStyle='#000';c.fillRect(0,0,L.W,bh);c.fillRect(0,L.H-bh,L.W,bh);}
    subs(c,L,t,k);
    if(t>=T_END-0.25){endcardBg(c,t,T_END,L,E.outCubic(prog(t,T_END-0.25,T_END+0.15)));endcard(c,t,T_END,L,{cta:P.cta});}},
