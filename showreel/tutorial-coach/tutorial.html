/* ---------------- intro / outro ---------------- */
function intro(c,t){const a=E.outCubic(prog(t,0.1,0.6))*(1-E.inCubic(prog(t,3.5,3.95)));if(a<=0)return;c.save();c.globalAlpha=a;
  const k=2.0,w=269.4*k;drawFirma(c,960-w/2,300,k,{arcP:E.inOutCubic(prog(t,0.15,0.75))});
  c.fillStyle=rgbLine(c,700,0,1220,0);c.fillRect(960-260*E.outExpo(prog(t,0.6,1.1)),530,520*E.outExpo(prog(t,0.6,1.1)),4);
  txt(c,'Tutorial para coaches',960,620,800,64,'#fff','center');txt(c,'Tu panel, paso a paso, y cómo le llega cada cosa a tu cliente.',960,680,500,30,C.text2,'center');c.restore();}
function outro(c,t){const u=t-125;const a=E.outCubic(prog(u,0.1,0.6));c.save();c.globalAlpha=a;const k=2.0,w=269.4*k;drawFirma(c,960-w/2,250,k,{arcP:E.inOutCubic(prog(u,0.15,0.75))});
  c.fillStyle=rgbLine(c,700,0,1220,0);c.fillRect(700,480,520,4);txt(c,'¡Listo!',960,580,800,72,'#fff','center');txt(c,'Copiá tu código y sumá a tu primer cliente.',960,640,600,36,'#fff','center');
  txt(c,'¿Dudas? Escribinos por WhatsApp.',960,720,500,28,C.text2,'center');c.restore();}

/* ---------------- compose ---------------- */
const kv=(k,u,i)=>ekeys(u,k.map(r=>[r[0],r[i]]));
createReel({dur:DUR,fps:30,bloom:()=>0.22,vignette:()=>0.3,fast:[],
  draw(c,t,L){bg(c,t);const k=chAt(t),u=t-k.t;
    if(k.id==='intro'){intro(c,t);return;}if(k.id==='outro'){outro(c,t);return;}
    const S=SC[k.id],e=E.outCubic(clamp(u/0.4));CAM={x:kv(S.cam,u,1),y:kv(S.cam,u,2),z:kv(S.cam,u,3)};
    const dP=S.dimP?kv(S.dimP,u,1):0,dC=S.dimC?kv(S.dimC,u,1):0;
    headerBar(c,t);c.save();c.globalAlpha=k.id==='panel'?e:1;browser(c,u,S.panel,dP);phone(c,u,S.phone,dC);c.restore();
    if(S.cur){const x=kv(S.cur,u,1),y=kv(S.cur,u,2),[fx,fy]=toF(x,y);cursor(c,u,fx,fy,S.clicks||[]);}
    if(S.over)S.over(c,u);caption(c,u,S.caps||[]);
    // between chapters: a quick dip so each step reads as a new one
    const d=Math.max(1-clamp(u/0.25),clamp((u-(k.d-0.2))/0.2));if(d>0&&k.id!=='panel'){c.fillStyle=`rgba(0,0,0,${0.55*d})`;c.fillRect(0,0,1920,1080);}},
  cues(){const q=[{t:0,s:'groove',t1:DUR-0.5,bpm:100,chords:Array.from({length:Math.ceil(DUR/4.8)},(_,i)=>[i*4.8,['Am','F','C','G'][i%4]]),parts:['pad','arp','hat','bass']},
      {t:0.15,s:'pen'},{t:0.6,s:'shimmer'},{t:125.15,s:'pen'},{t:125.6,s:'shimmer'},{t:126,s:'chord',ch:'C',d:2.5}];
    for(const k of CH){if(k.title)q.push({t:k.t,s:'whoosh',d:0.4,f0:600,f1:2400,g:0.3});const S=SC[k.id];if(!S||!S.cues)continue;
      for(const[u,s,d]of S.cues){const t=k.t+u;if(s==='typing'){for(let i=0;i<8;i++)q.push({t:t+i*d/8,s:'type',g:0.35});}
        else if(s==='click')q.push({t,s:'click',f:1800,g:0.7});else if(s==='bloop')q.push({t,s:'bloop',k:1,v:0.7});else if(s==='whoosh')q.push({t,s:'whoosh',d:0.7,f0:400,f1:2600,g:0.4});else q.push({t,s,g:0.8});}}
    return q;},
});
