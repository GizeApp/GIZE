/* ---------------- math & easing ---------------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  inQuad:x=>x*x,outQuad:x=>1-(1-x)*(1-x),inCubic:x=>x*x*x,outCubic:x=>1-(1-x)**3,
  inOutCubic:x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2,inExpo:x=>x<=0?0:2**(10*x-10),outExpo:x=>x>=1?1:1-2**(-10*x),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?2**(20*x-10)/2:(2-2**(-20*x+10))/2,
  outBack:x=>{const c1=1.70158,c3=c1+1;return 1+c3*(x-1)**3+c1*(x-1)**2},inBack:x=>{const c1=1.70158;return(c1+1)*x**3-c1*x*x},
};
const spring=(dt,f=2.2,z=6)=>dt<=0?0:1-Math.exp(-z*dt)*Math.cos(2*Math.PI*f*dt);
const wobble=(dt,f=3,z=8)=>dt<=0?0:Math.exp(-z*dt)*Math.sin(2*Math.PI*f*dt);
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453123;return s-Math.floor(s);};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function keys(t,k){if(t<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++){if(t<k[i][0]){const a=k[i-1],b=k[i];return lerp(a[1],b[1],(t-a[0])/(b[0]-a[0]));}}return k[k.length-1][1];}
function ekeys(t,k){if(t<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++){if(t<k[i][0]){const a=k[i-1],b=k[i];return lerp(a[1],b[1],E.inOutCubic((t-a[0])/(b[0]-a[0])));}}return k[k.length-1][1];}

function reset(c){c.globalAlpha=1;c.globalCompositeOperation='source-over';c.lineCap='butt';c.lineJoin='miter';c.setLineDash([]);c.textAlign='left';c.textBaseline='alphabetic';c.letterSpacing='0px';c.filter='none';c.shadowColor='transparent';c.shadowBlur=0;}
function bg(c,col){c.fillStyle=col;c.fillRect(-600,-600,W+1200,H+1200);}
function glow(c,x,y,r,rgb,a){if(a<=0.002)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(rgb,a));g.addColorStop(1,rgba(rgb,0));c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);}
function rgbLine(c,x0,y0,x1,y1){const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,C.blue);g.addColorStop(1/3,C.purple);g.addColorStop(2/3,C.pink);g.addColorStop(1,C.teal);return g;}
function rgbRing(c,x,y,a0){const g=c.createConicGradient(a0,x,y);g.addColorStop(0,C.blue);g.addColorStop(.25,C.purple);g.addColorStop(.5,C.pink);g.addColorStop(.75,C.teal);g.addColorStop(1,C.blue);return g;}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}

function tap(c,x,y,t,t0){const u=t-t0;if(u<-0.06||u>0.45)return;const e=E.outCubic(clamp(u/0.45));c.fillStyle=`rgba(255,255,255,${0.35*(1-e)*(u<0?0:1)})`;c.beginPath();c.arc(x,y,10+30*e,0,7);c.fill();

const LOGO={};
async function loadLogo(){
  const svg=new DOMParser().parseFromString(await (await fetch('../../brand/logo/gize-firma-horizontal.svg')).text(),'image/svg+xml').documentElement;
  const vb=svg.getAttribute('viewBox').split(/[ ,]+/).map(Number);LOGO.w=vb[2];LOGO.h=vb[3];
  const arc=svg.querySelector(':scope > path'),n=arc.getAttribute('d').match(/[-\d.]+/g).map(Number);
  const[x0,y0,r,,,fA,fS,x1,y1]=n,hx=(x0-x1)/2,hy=(y0-y1)/2,sg=fA!==fS?1:-1,co=sg*Math.sqrt(Math.max(0,(r*r*r*r-r*r*hy*hy-r*r*hx*hx)/(r*r*hy*hy+r*r*hx*hx)));
  const cx=co*hy+(x0+x1)/2,cy=-co*hx+(y0+y1)/2,a0=Math.atan2(y0-cy,x0-cx),a1=Math.atan2(y1-cy,x1-cx),sweep=((a1-a0)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  LOGO.arc={cx,cy,r,a0,a1,len:r*sweep,w:+arc.getAttribute('stroke-width'),path:new Path2D(arc.getAttribute('d'))};
  const ci=svg.querySelector('circle');LOGO.dot={x:+ci.getAttribute('cx'),y:+ci.getAttribute('cy'),r:+ci.getAttribute('r'),fill:ci.getAttribute('fill')};
  const g=svg.querySelector('g'),m=g.getAttribute('transform').match(/translate\(([-\d.]+),([-\d.]+)\)\s*scale\(([-\d.]+),([-\d.]+)\)/);
  LOGO.wm={tx:+m[1],ty:+m[2],sx:+m[3],sy:+m[4],letters:[...g.querySelectorAll('path')].map(p=>({p:new Path2D(p.getAttribute('d')),tx:+p.getAttribute('transform').match(/translate\(([-\d.]+)/)[1]}))};
}
function drawFirma(c,x,y,k,o={}){
  const col=o.color||C.text,A=LOGO.arc;c.save();c.translate(x,y);c.scale(k,k);
  if(o.symbol!==false){const p=o.arcP??1;c.strokeStyle=col;c.lineWidth=A.w;c.lineCap='round';
    if(p>=1)c.stroke(A.path);else if(p>0){c.setLineDash([A.len*p,A.len*2]);c.beginPath();c.arc(A.cx,A.cy,A.r,A.a1,A.a0,true);c.stroke();c.setLineDash([]);}
    if(o.dot!==false){const D=LOGO.dot,d=typeof o.dot==='object'?o.dot:{x:D.x,y:D.y,sx:1,sy:1};c.fillStyle=o.mono?col:D.fill;c.beginPath();c.ellipse(d.x,d.y,D.r*d.sx,D.r*d.sy,0,0,7);c.fill();}}
  if(o.wordmark!==false){const M=LOGO.wm;c.fillStyle=col;M.letters.forEach((L,i)=>{c.save();c.translate(0,o.dy?o.dy[i]:0);c.translate(M.tx,M.ty);c.scale(M.sx,M.sy);c.translate(L.tx,0);c.fill(L.p);c.restore();});}
  c.restore();
}
function makeBall(yRest,y0,tDrop,tImp,e){
  const T=tImp-tDrop,g=2*(yRest-y0)/(T*T);const imp=[tImp],vim=[g*T];let v=g*T,tt=tImp;
  for(;;){v*=e;const Tb=2*v/g;if(Tb<0.016)break;tt+=Tb;imp.push(tt);vim.push(v);}
  return{yRest,imp,vim,
    phys(t){if(t<tImp){const u=Math.max(0,t-tDrop);return{y:y0+0.5*g*u*u,vy:g*u};}
      for(let k=0;k<imp.length-1;k++){if(t<imp[k+1]){const u=t-imp[k],vv=vim[k+1];return{y:yRest-(vv*u-0.5*g*u*u),vy:-(vv-g*u)};}}return{y:yRest,vy:0};},
    squash(t,w=0.024,amp=0.55){let s=0;for(let k=0;k<imp.length;k++){const d=(t-imp[k])/w;if(d>-3&&d<3)s+=Math.min(amp*0.92,amp*vim[k]/vim[0])*Math.exp(-d*d);}return s;}};
}

    const u=prog(t,8.95,ARRIVE);if(u>0&&u<1){const A=athP(t),Bq=coP(t),p0=phonePoint(A,195,REVGY()),p1=phonePoint(Bq,195,251),e=E.inOutCubic(u);
      const x=lerp(p0[0],p1[0],e),y=lerp(p0[1],p1[1],e)-Math.sin(Math.PI*e)*360;glow(c,x,y,130,RGB.blue,0.65);
      for(let q=6;q>=0;q--){const ee=E.inOutCubic(clamp(u-q*0.03)),xx=lerp(p0[0],p1[0],ee),yy=lerp(p0[1],p1[1],ee)-Math.sin(Math.PI*ee)*360;c.fillStyle=q?`rgba(47,160,255,${(1-q/7)*0.7})`:C.blue;c.beginPath();c.arc(xx,yy,22-q*2.4,0,7);c.fill();}}}
  if(t>=T_DROP)captions(c,t);
  if(t>=T_OUT-0.3){outro(c,t);}
  loopWipe(c,t);
  c.setTransform(1,0,0,1,0,0);reset(c);
}
function REVGY(){return 426+52+10+3*60+12+25-60;}   // "Guardar entreno de hoy" centre, after collapse + scroll

/* ---------------- post: motion blur, CA, bloom, vignette ---------------- */
const acc=new Float32Array(W*H*3);let OUT_IMG=null;
const BW=270,BH=480,BS=mk(BW,BH),bs=BS.getContext('2d',{willReadFrequently:true}),BS2=mk(BW,BH),bs2=BS2.getContext('2d');let BIMG=null;
const bloomAmt=t=>keys(t,[[0,0],[T_DROP,0],[T_DROP+0.3,0.3],[T_OUT,0.3],[T_OUT+0.4,0.45],[T_LOOP,0.45],[14.85,0]]);
const vigAmt=t=>keys(t,[[0,0.28],[T_STAMP,0.28],[T_STAMP+0.1,0.45],[T_DROP+0.3,0.35],[T_LOOP,0.35],[14.85,0.28]]);
const XO=new Int16Array(W);
function post(f,sub){
  const t=f/FPS,inv=1/sub,o=OUT_IMG.data;let ca=0.8;for(const[ti,amp]of HITS){const u=t-ti;if(u>=0&&u<0.25)ca=Math.max(ca,amp*0.45*Math.exp(-u*14));}
  for(let x=0;x<W;x++)XO[x]=Math.round(ca*(x-CX)/CX);
  for(let y=0;y<H;y++){const rb=y*W;let oi=y*W*4;for(let x=0;x<W;x++,oi+=4){const d=XO[x];let xr=x-d,xb=x+d;xr=xr<0?0:xr>=W?W-1:xr;xb=xb<0?0:xb>=W?W-1:xb;
    o[oi]=acc[(rb+xr)*3]*inv;o[oi+1]=acc[(rb+x)*3+1]*inv;o[oi+2]=acc[(rb+xb)*3+2]*inv;o[oi+3]=255;}}
  ctx.setTransform(1,0,0,1,0,0);reset(ctx);ctx.putImageData(OUT_IMG,0,0);
  const amt=bloomAmt(t);if(amt>0.01){const d=BIMG.data,thr=0.55*255;
    for(let by=0;by<BH;by++)for(let bx=0;bx<BW;bx++){let r=0,g=0,b=0;for(let sy=0;sy<4;sy+=2)for(let sx=0;sx<4;sx+=2){const i=((by*4+sy+1)*W+bx*4+sx+1)*4;r+=o[i];g+=o[i+1];b+=o[i+2];}
      r/=4;g/=4;b/=4;const l=0.2126*r+0.7152*g+0.0722*b,k=l>thr?(l-thr)/(255-thr):0,j=(by*BW+bx)*4;d[j]=r*k;d[j+1]=g*k;d[j+2]=b*k;d[j+3]=255;}
    bs.putImageData(BIMG,0,0);ctx.save();ctx.globalCompositeOperation='lighter';ctx.imageSmoothingQuality='high';
    for(const[rad,a]of[[2,0.5],[7,0.45],[18,0.4]]){bs2.clearRect(0,0,BW,BH);bs2.filter=`blur(${rad}px)`;bs2.drawImage(BS,0,0);bs2.filter='none';ctx.globalAlpha=amt*a;ctx.drawImage(BS2,0,0,W,H);}ctx.restore();}
  const va=vigAmt(t),vg=ctx.createRadialGradient(CX,CY,H*0.3,CX,CY,H*0.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,`rgba(0,0,0,${va})`);ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
const FAST=[[T_STAMP-0.03,T_STAMP+0.2],[T_DROP-0.02,T_DROP+0.7],[8.4,9.1],[10.95,11.35],[11.8,12.25]];
function subsFor(t){for(const[a,b]of FAST)if(t>=a&&t<=b)return 24;return 10;}
window.renderFrame=function(f,opt={}){
  const t=f/FPS,sub=opt.sub||subsFor(t),shutter=0.5;FRAME_T=t;acc.fill(0);
  for(let s=0;s<sub;s++){const ts=Math.max(0,(f+(sub===1?0:((s+0.5)/sub-0.5)*shutter))/FPS);drawAll(ctx,ts);
    const d=ctx.getImageData(0,0,W,H).data;for(let i=0,j=0;i<d.length;i+=4,j+=3){acc[j]+=d[i];acc[j+1]+=d[i+1];acc[j+2]+=d[i+2];}}
  post(f,sub);return cv.toDataURL('image/png');
};
window.READY=false;
(async()=>{
  await Promise.all([400,500,600,700,800,900].map(w=>document.fonts.load(F(w,100))));await document.fonts.load('italic 500 11px Outfit');
  await loadLogo();buildPlanilla();initTitle();initReveal();initOutro();OUT_IMG=ctx.createImageData(W,H);BIMG=bs.createImageData(BW,BH);
  window.READY=true;
  if(location.search.includes('play')){let t0=null,audio=null;const start=()=>{t0=performance.now();if(audio){audio.currentTime=0;audio.play().catch(()=>{});}};
    try{audio=new Audio('soundtrack.wav');}catch(e){}document.body.addEventListener('click',start);start();
    const loop=()=>{const t=((performance.now()-t0)/1000)%DUR;FRAME_T=t;drawAll(ctx,t);requestAnimationFrame(loop);};loop();}
})();
