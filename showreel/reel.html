<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIZE — Motion Reel</title>
<link rel="stylesheet" href="../brand/fonts/outfit.css">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;position:absolute;inset:0;margin:auto;max-width:100vw;max-height:100vh;width:100%;height:auto;aspect-ratio:16/9}
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
"use strict";
/* =====================================================================
   GIZE — MOTION REEL '26
   15 s, 1920x1080, 60 fps, 120 BPM. Built only from the brand system in
   /brand: Outfit (variable), the RGB range and the logo SVG, which is parsed
   at runtime, never retyped. Every pixel is a pure function of time t, so
   frames render in any order with true sub-frame motion blur.
   Open with ?play for a real-time preview (no blur / post).
   ===================================================================== */
const W=1920,H=1080,FPS=60,DUR=15,CX=W/2,CY=H/2;
const C={bg:'#000000',surface:'#0B0D11',surface2:'#12151B',border:'#1C2029',text:'#FFFFFF',text2:'#8F98A6',
  blue:'#2FA0FF',purple:'#A65CFF',pink:'#FF3DAE',teal:'#25E8C8',light:'#F5F7FA',ink:'#0A0C10',mute:'#5B6472'};
const RGB={bg:[0,0,0],surface:[11,13,17],surface2:[18,21,27],border:[28,32,41],text:[255,255,255],text2:[143,152,166],
  blue:[47,160,255],purple:[166,92,255],pink:[255,61,174],teal:[37,232,200],light:[245,247,250],ink:[10,12,16]};
const GAMA=[RGB.blue,RGB.purple,RGB.pink,RGB.teal];
const rgba=(a,al=1)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const F=(w,px)=>`${w} ${px}px Outfit`;
const TR=7.75;          // route -> particles hand-off
const LINE_Y=600;       // end-card rule

/* ---------------- math & easing ---------------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  inQuad:x=>x*x, outQuad:x=>1-(1-x)*(1-x),
  inCubic:x=>x*x*x, outCubic:x=>1-(1-x)**3,
  inOutCubic:x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2,
  inQuart:x=>x**4, outQuart:x=>1-(1-x)**4,
  inOutQuart:x=>x<.5?8*x**4:1-(-2*x+2)**4/2,
  inExpo:x=>x<=0?0:2**(10*x-10),
  outExpo:x=>x>=1?1:1-2**(-10*x),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?2**(20*x-10)/2:(2-2**(-20*x+10))/2,
  outBack:x=>{const c1=1.70158,c3=c1+1;return 1+c3*(x-1)**3+c1*(x-1)**2},
  inBack:x=>{const c1=1.70158;return (c1+1)*x**3-c1*x*x},
};
const spring=(dt,f=2.2,z=6)=>dt<=0?0:1-Math.exp(-z*dt)*Math.cos(2*Math.PI*f*dt);
const wobble=(dt,f=3,z=8)=>dt<=0?0:Math.exp(-z*dt)*Math.sin(2*Math.PI*f*dt);
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453123;return s-Math.floor(s);};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function keys(t,k){if(t<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++){if(t<k[i][0]){const a=k[i-1],b=k[i];return lerp(a[1],b[1],(t-a[0])/(b[0]-a[0]));}}return k[k.length-1][1];}
function gamaAt(u){u=clamp(u);const x=u*3,i=Math.min(2,Math.floor(x));return mixc(GAMA[i],GAMA[i+1],x-i);}
function invIOC(y){return y<.5?Math.cbrt(y/4):1-Math.cbrt(2-2*y)/2;}

/* ---------------- canvases & drawing helpers ---------------- */
const cv=document.getElementById('out');
const ctx=cv.getContext('2d',{willReadFrequently:true});
const mk=(w=W,h=H)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const L1=mk(),l1=L1.getContext('2d');
const MC=mk(8,8).getContext('2d');
let FRAME_T=0;
function reset(c){c.globalAlpha=1;c.globalCompositeOperation='source-over';c.lineCap='butt';c.lineJoin='miter';c.setLineDash([]);c.lineDashOffset=0;c.textAlign='left';c.textBaseline='alphabetic';c.letterSpacing='0px';c.filter='none';}
function bg(c,col){c.fillStyle=col;c.fillRect(-500,-500,W+1000,H+1000);}
function glow(c,x,y,r,rgb,a){if(a<=0.002)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(rgb,a));g.addColorStop(1,rgba(rgb,0));c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);}
function rgbLine(c,x0,y0,x1,y1){const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,C.blue);g.addColorStop(1/3,C.purple);g.addColorStop(2/3,C.pink);g.addColorStop(1,C.teal);return g;}
function rgbRing(c,x,y,a0){const g=c.createConicGradient(a0,x,y);g.addColorStop(0,C.blue);g.addColorStop(.25,C.purple);g.addColorStop(.5,C.pink);g.addColorStop(.75,C.teal);g.addColorStop(1,C.blue);return g;}
function dotGrid(c,amt,alpha,col=C.text2){if(amt<=0)return;c.fillStyle=col;for(let gx=0;gx<=32;gx++)for(let gy=0;gy<=18;gy++){const x=gx*60,y=gy*60;const d=Math.hypot(x-CX,y-CY)/1100;const a=clamp(amt*1.7-d)*alpha;if(a<0.003)continue;c.globalAlpha=a;c.fillRect(x-1.5,y-1.5,3,3);}c.globalAlpha=1;}
function slantPoly(c,edge,slant,side){const yT=-500,yB=H+500,xT=edge+(yT-CY)*slant,xB=edge+(yB-CY)*slant,far=side<0?-4000:W+4000;c.beginPath();c.moveTo(far,yT);c.lineTo(xT,yT);c.lineTo(xB,yB);c.lineTo(far,yB);c.closePath();}
// the brand's aurora: four slow blobs of the RGB range
function aurora(c,t,a){if(a<=0)return;c.save();c.globalCompositeOperation='lighter';
  [[0.22,0.35,1.0],[0.55,0.2,1.3],[0.78,0.6,0.8],[0.35,0.8,1.1]].forEach(([px,py,sp],i)=>{const x=W*(px+0.07*Math.sin(t*0.6*sp+i*2)),y=H*(py+0.06*Math.cos(t*0.5*sp+i));glow(c,x,y,640,GAMA[i],0.2*a);});c.restore();}
// fixed-width digits (tabular-nums by hand, canvas has no font-variant-numeric)
function tnum(c,str,x,y,align='left'){const dw=c.measureText('0').width;let w=0;for(const ch of str)w+=/\d/.test(ch)?dw:c.measureText(ch).width;
  let xx=align==='right'?x-w:align==='center'?x-w/2:x;const ta=c.textAlign;c.textAlign='left';
  for(const ch of str){if(/\d/.test(ch)){c.fillText(ch,xx+(dw-c.measureText(ch).width)/2,y);xx+=dw;}else{c.fillText(ch,xx,y);xx+=c.measureText(ch).width;}}c.textAlign=ta;}
const fmt1=v=>v.toFixed(1).replace('.',',');

/* ---------------- brand logo (parsed from brand/logo/gize-firma-horizontal.svg) ---------------- */
const LOGO={};
async function loadLogo(){
  const svg=new DOMParser().parseFromString(await (await fetch('../brand/logo/gize-firma-horizontal.svg')).text(),'image/svg+xml').documentElement;
  const vb=svg.getAttribute('viewBox').split(/[ ,]+/).map(Number);LOGO.w=vb[2];LOGO.h=vb[3];
  const arc=svg.querySelector(':scope > path'),n=arc.getAttribute('d').match(/[-\d.]+/g).map(Number);
  const[x0,y0,r,,,fA,fS,x1,y1]=n,hx=(x0-x1)/2,hy=(y0-y1)/2,sg=fA!==fS?1:-1,co=sg*Math.sqrt(Math.max(0,(r*r*r*r-r*r*hy*hy-r*r*hx*hx)/(r*r*hy*hy+r*r*hx*hx)));
  const cx=co*hy+(x0+x1)/2,cy=-co*hx+(y0+y1)/2,a0=Math.atan2(y0-cy,x0-cx),a1=Math.atan2(y1-cy,x1-cx),sweep=((a1-a0)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  LOGO.arc={cx,cy,r,a0,a1,len:r*sweep,w:+arc.getAttribute('stroke-width'),path:new Path2D(arc.getAttribute('d'))};
  const ci=svg.querySelector('circle');LOGO.dot={x:+ci.getAttribute('cx'),y:+ci.getAttribute('cy'),r:+ci.getAttribute('r'),fill:ci.getAttribute('fill')};
  const g=svg.querySelector('g'),m=g.getAttribute('transform').match(/translate\(([-\d.]+),([-\d.]+)\)\s*scale\(([-\d.]+),([-\d.]+)\)/);
  LOGO.wm={tx:+m[1],ty:+m[2],sx:+m[3],sy:+m[4],letters:[...g.querySelectorAll('path')].map(p=>({p:new Path2D(p.getAttribute('d')),tx:+p.getAttribute('transform').match(/translate\(([-\d.]+)/)[1]}))};
}
// o: {color, mono, arcP 0..1, dot:false|{x,y,sx,sy}, wordmark:false, symbol:false, dy:[per-letter, logo units]}
function drawFirma(c,x,y,k,o={}){
  const col=o.color||C.text,A=LOGO.arc;c.save();c.translate(x,y);c.scale(k,k);
  if(o.symbol!==false){const p=o.arcP??1;c.strokeStyle=col;c.lineWidth=A.w;c.lineCap='round';
    if(p>=1)c.stroke(A.path);else if(p>0){c.setLineDash([A.len*p,A.len*2]);c.beginPath();c.arc(A.cx,A.cy,A.r,A.a1,A.a0,true);c.stroke();c.setLineDash([]);}
    if(o.dot!==false){const D=LOGO.dot,d=typeof o.dot==='object'?o.dot:{x:D.x,y:D.y,sx:1,sy:1};c.fillStyle=o.mono?col:D.fill;c.beginPath();c.ellipse(d.x,d.y,D.r*d.sx,D.r*d.sy,0,0,7);c.fill();}}
  if(o.wordmark!==false){const M=LOGO.wm;c.fillStyle=col;M.letters.forEach((L,i)=>{c.save();c.translate(0,o.dy?o.dy[i]:0);c.translate(M.tx,M.ty);c.scale(M.sx,M.sy);c.translate(L.tx,0);c.fill(L.p);c.restore();});}
  c.restore();
}

/* ---------------- layout (after fonts load) ---------------- */
const LAY={};
function capOf(w){MC.font=F(w,1000);return MC.measureText('H').actualBoundingBoxAscent/1000;}
function glyphs(str,font,sp=0){MC.font=font;MC.letterSpacing='0px';const gl=[];for(let i=0;i<str.length;i++)gl.push({ch:str[i],x:MC.measureText(str.slice(0,i)).width+i*sp,w:MC.measureText(str[i]).width});return{gl,width:MC.measureText(str).width+(str.length-1)*sp};}
function initLayout(){
  const c9=capOf(900);
  { let cap=250,g;for(;;){g=glyphs('ENTRENÁ',F(900,cap/c9),6);if(g.width<1640||cap<120)break;cap-=4;}LAY.entrena={...g,f:F(900,cap/c9),cap,x0:CX-g.width/2,base:CY+cap/2}; }
  { let size=300;for(;;){MC.font=F(900,size);if(MC.measureText('REGISTRÁ').width<1560)break;size-=4;}LAY.registra={str:'REGISTRÁ',size,base:CY+size*c9/2}; }
  { let cap=240;const L=['P','R','O','G','R','E','S','Á'];let lay;
    for(;;){const f=F(900,cap/c9);MC.font=f;const R=cap*0.545,gap=cap*0.07;const ws=L.map(ch=>ch==='O'?2*R:MC.measureText(ch).width);const tot=ws.reduce((a,b)=>a+b,0)+gap*(L.length-1);
      if(tot<1680||cap<120){let x=CX-tot/2;const base=CY+cap/2;lay={f,cap,base,R,rin:R*0.5,L:L.map((ch,i)=>{const o={ch,x,w:ws[i]};x+=ws[i]+gap;return o;})};break;}cap-=4;}
    lay.O={cx:lay.L[2].x+lay.R,cy:lay.base-cap/2};LAY.progresa=lay; }
  { const f=F(800,210),g=glyphs('energize',f,-2);MC.font=f;LAY.energize={...g,f,x0:CX-g.width/2,split:CX-g.width/2+MC.measureText('ener').width-6}; }
  { const k=2.9,Fm={k,x:CX-LOGO.w*k/2,y:LINE_Y-24-LOGO.h*k};const D=LOGO.dot;Fm.dotX=Fm.x+D.x*k;Fm.dotR=D.r*k;Fm.ball=makeBall(Fm.y+D.y*k,-160,13.6,14.0,0.3);LAY.firma=Fm; }
  { MC.font=F(700,27);LAY.btn={w:MC.measureText('Creá tu cuenta').width+96,h:70,x:CX,y:LINE_Y+172}; }
}

/* ---------------- ball physics (the intro ball is the dot of the G) ---------------- */
function makeBall(yRest,y0,tDrop,tImp,e){
  const T=tImp-tDrop,g=2*(yRest-y0)/(T*T);const imp=[tImp],vim=[g*T];let v=g*T,tt=tImp;
  for(;;){v*=e;const Tb=2*v/g;if(Tb<0.016)break;tt+=Tb;imp.push(tt);vim.push(v);}
  return{yRest,y0,g,imp,vim,rest:tt,
    phys(t){if(t<tImp){const u=Math.max(0,t-tDrop);return{y:y0+0.5*g*u*u,vy:g*u};}
      for(let k=0;k<imp.length-1;k++){if(t<imp[k+1]){const u=t-imp[k],vv=vim[k+1];return{y:yRest-(vv*u-0.5*g*u*u),vy:-(vv-g*u)};}}
      return{y:yRest,vy:0};},
    squash(t,w=0.026,amp=0.5){let s=0;for(let k=0;k<imp.length;k++){const d=(t-imp[k])/w;if(d>-3&&d<3)s+=Math.min(amp*0.92,amp*vim[k]/vim[0])*Math.exp(-d*d);}return s;}};
}
const BALL=Object.assign(makeBall(574-34,-140,0,0.5,0.56),{r:34,floorY:574});

/* ---------------- camera shake / zoom punches ---------------- */
const HITS=[[2.0,14,0.035],[4.0,7,0.018],[6.0,5,0.012],[TR,11,0.03],[8.0,5,0.012],[10.0,16,0.03],[10.5,4,0.01],[11.0,8,0.016],[13.0,9,0.022],[14.0,4,0.008]];
function camFX(t){let x=0,y=0,s=1;for(const[ti,amp,p]of HITS){const u=t-ti;if(u<0||u>0.7)continue;const at=1-Math.exp(-u*90),d=Math.exp(-u*9)*at;x+=amp*d*Math.sin(u*97+ti*13);y+=amp*d*Math.sin(u*83+ti*7+1.3);s+=p*Math.exp(-u*11)*at;}return{x,y,s};}

/* =====================================================================
   00 — EL PUNTO: squash & stretch, anticipation (0 – 2.0 s)
   ===================================================================== */
function ballShape(t){
  const B=BALL,r=B.r;const ph=B.phys(t);const sq=B.squash(t);
  const ant=0.44*E.inCubic(prog(t,B.rest+0.04,2.0));
  const st=Math.min(0.42,0.42*Math.abs(ph.vy)/B.vim[0])*Math.max(0,1-sq*4);
  let sy=(1-sq-ant)*(1+st);let y=ph.y+r*(1-sy);y=Math.min(y,B.floorY-r*sy);let x=CX;
  x+=Math.sin(t*170)*3.5*E.inQuad(prog(t,1.86,2.0));
  if(t>=2.0){const u=t-2.0;sy=lerp(0.56,2.7,E.outExpo(clamp(u/0.035)));y=B.floorY-r*sy-u*13000;}
  return{x,y,sx:1/Math.sqrt(Math.max(0.2,sy)),sy,r};
}
function S1(c,t){
  const B=BALL;bg(c,C.bg);
  const chg=prog(t,B.rest+0.02,2.0);
  if(t<2.0){glow(c,CX,B.floorY-40,620,RGB.blue,0.22*E.inQuad(chg));glow(c,CX,B.floorY-40,300,RGB.purple,0.12*E.inQuad(chg));}
  dotGrid(c,E.outCubic(prog(t,0,1.0)),0.13);
  const fl=E.outExpo(prog(t,0.1,0.75)),fw=420*fl;
  c.fillStyle=C.text2;c.globalAlpha=0.4;c.fillRect(CX-fw,B.floorY,fw*2,2);
  c.globalAlpha=0.6*fl;c.fillRect(CX-fw-1,B.floorY-8,2,18);c.fillRect(CX+fw-1,B.floorY-8,2,18);c.globalAlpha=1;
  for(let k=0;k<B.imp.length;k++){const u=t-B.imp[k];if(u<0||u>0.7)continue;const s=B.vim[k]/B.vim[0];const e=E.outCubic(u/0.7);const rx=30+320*e*(0.3+0.7*s);
    c.strokeStyle=C.blue;c.lineWidth=2;c.globalAlpha=(1-e)*(0.15+0.7*s);c.beginPath();c.ellipse(CX,B.floorY+1,rx,rx*0.12,0,0,7);c.stroke();}
  c.globalAlpha=1;
  if(t>=2.0)dropWipe(c,t);
  if(t<2.12){
    const b=ballShape(t);
    if(t<2.0){
      const hg=clamp((B.floorY-(b.y+b.r*b.sy))/700);
      c.fillStyle=C.blue;c.globalAlpha=0.22*(1-hg);c.beginPath();c.ellipse(CX,B.floorY+5,Math.max(1,b.r*1.35*(1-0.6*hg)*b.sx),Math.max(1,7*(1-0.5*hg)),0,0,7);c.fill();c.globalAlpha=1;
      if(t<B.rest+0.12){for(let k=5;k>=1;k--){const tb=t-k*0.04;if(tb<0)continue;const o=ballShape(tb);c.strokeStyle=C.text2;c.lineWidth=1.5;c.globalAlpha=0.3*(1-k/6)*(1-prog(t,B.rest,B.rest+0.12));c.beginPath();c.ellipse(o.x,o.y,o.r*o.sx,o.r*o.sy,0,0,7);c.stroke();}c.globalAlpha=1;}
      if(chg>0){
        const by=B.floorY-B.r*(1-0.44*E.inCubic(chg));const e=E.inOutCubic(chg);
        c.lineCap='round';c.strokeStyle=C.border;c.lineWidth=6;c.beginPath();c.arc(CX,by,80,0,7);c.stroke();
        c.strokeStyle=rgbRing(c,CX,by,t*6);c.beginPath();c.arc(CX,by,80,-Math.PI/2,-Math.PI/2+Math.PI*2*e);c.stroke();
        for(let i=0;i<22;i++){const pr=prog(t,B.rest+hash(i+9)*0.1,2.0);if(pr<=0)continue;const rr=46+300*(1-E.inCubic(pr));const a=hash(i)*6.283+pr*2.4;
          c.globalAlpha=Math.sin(pr*Math.PI);c.fillStyle=rgba(i%5?GAMA[i%4]:RGB.text);c.fillRect(CX+Math.cos(a)*rr-2,by+Math.sin(a)*rr*0.85-2,4,4);}
        c.globalAlpha=1;c.lineCap='butt';
      }
    }
    c.fillStyle=C.blue;c.beginPath();c.ellipse(b.x,b.y,b.r*b.sx,b.r*b.sy,0,0,7);c.fill();
  }
}
function dropWipe(c,t){
  const u=t-2.0,ox=CX,oy=BALL.floorY;
  for(const[col,d]of[[C.teal,0],[C.pink,0.04],[C.purple,0.08],[C.blue,0.12]]){const e=E.outExpo(clamp((u-d)/0.6));if(e<=0)continue;c.fillStyle=col;c.beginPath();c.arc(ox,oy,1450*e,0,7);c.fill();}
  const se=E.outCubic(clamp(u/0.5));c.strokeStyle=C.text;c.lineWidth=12*(1-se)+1;c.globalAlpha=1-se;c.beginPath();c.arc(ox,oy,50+950*se,0,7);c.stroke();c.globalAlpha=1;
  const be=clamp(u/0.45);
  if(be<1){c.strokeStyle=C.bg;c.lineCap='round';c.lineWidth=9*(1-be)+2;
    for(let i=0;i<24;i++){const a=i/24*Math.PI*2+0.13,j=0.75+0.5*hash(i+3);const rh=80+760*j*E.outExpo(be),rt=80+760*j*E.outExpo(be*0.72);
      c.beginPath();c.moveTo(ox+Math.cos(a)*rt,oy+Math.sin(a)*rt);c.lineTo(ox+Math.cos(a)*rh,oy+Math.sin(a)*rh);c.stroke();}
    c.lineCap='butt';}
}

/* =====================================================================
   01 — ENTRENÁ · REGISTRÁ · PROGRESÁ (kinetic type)
   ===================================================================== */
function typeA(c,t){
  const L=LAY.entrena;
  const ta=E.outCubic(prog(t,2.08,2.35));
  if(ta>0){c.save();c.font=F(900,150);c.strokeStyle=C.bg;c.lineWidth=2;c.globalAlpha=0.16*ta;
    for(let r=0;r<6;r++){const y=40+r*205,dir=r%2?1:-1,off=((t-2)*420*dir+r*333)%900;c.strokeText('ENTRENÁ · REGISTRÁ · PROGRESÁ · ENTRENÁ · REGISTRÁ · PROGRESÁ',-900+off,y);}c.restore();}
  c.save();c.beginPath();c.rect(-100,L.base-L.cap-110,W+200,L.cap+110+50);c.clip();
  c.font=L.f;c.fillStyle=C.bg;
  L.gl.forEach((g,i)=>{const s=2.06+i*0.034;const e=E.outExpo(prog(t,s,s+0.45));const eo=E.inExpo(prog(t,2.47+i*0.012,2.6+i*0.012));
    const dy=(1-e)*(L.cap+130)-eo*(L.cap+150);c.save();c.translate(L.x0+g.x+g.w/2,L.base+dy);c.transform(1,0,-0.28*(1-e)+0.3*eo,1,0,0);c.fillText(g.ch,-g.w/2,0);c.restore();});
  c.restore();
}
function typeB(c,t){

}
const FAST=[[1.97,2.16],[3.72,4.08],[7.7,7.86],[9.5,10.15],[12.95,13.12]];
function subsFor(t){for(const[a,b]of FAST)if(t>=a&&t<=b)return 32;return 12;}
window.renderFrame=function(f,opt={}){
  const t=f/FPS,sub=opt.sub||subsFor(t),shutter=0.5;FRAME_T=t;acc.fill(0);
  for(let s=0;s<sub;s++){const ts=Math.max(0,(f+(sub===1?0:((s+0.5)/sub-0.5)*shutter))/FPS);drawAll(ctx,ts);
    const d=ctx.getImageData(0,0,W,H).data;for(let i=0,j=0;i<d.length;i+=4,j+=3){acc[j]+=d[i];acc[j+1]+=d[i+1];acc[j+2]+=d[i+2];}}
  post(f,sub);return cv.toDataURL('image/png');
};

/* ---------------- boot ---------------- */
window.READY=false;
(async()=>{
  await Promise.all([100,300,400,500,600,700,800,900].map(w=>document.fonts.load(F(w,100))));
  await loadLogo();
  initLayout();initS4();initS5();OUT_IMG=ctx.createImageData(W,H);BIMG=bs.createImageData(480,270);
  window.READY=true;
  if(location.search.includes('play')){
    let t0=null,audio=null;
    const start=()=>{t0=performance.now();if(audio){audio.currentTime=0;audio.play().catch(()=>{});}};
    try{audio=new Audio('soundtrack.wav');}catch(e){}
    document.body.addEventListener('click',start);start();
    const loop=()=>{const t=((performance.now()-t0)/1000)%DUR;FRAME_T=t;drawAll(ctx,t);requestAnimationFrame(loop);};loop();
  }
})();
</script>
