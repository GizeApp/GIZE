<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIZE · Chau descanso eterno · Ep. 04</title><link rel="stylesheet" href="../../brand/fonts/outfit.css">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head><body><canvas id="out"></canvas>
<script type="module">
/* CHAU DESCANSO ETERNO · Ep. 04 · EL DESCANSO (athlete voice).
   Mess: "2 minutes" of rest become 10 of scrolling a (generic) feed.
   GIZE: Iniciar descanso → you leave the app, the rest keeps running (ongoing
   notification "Descanso · termina HH:MM") → "¡Descanso terminado! 💪 / Volvé a la
   próxima serie." → back in the app, next set. Copy from the app's rest notifications. */
import {C,RGB,E,clamp,lerp,prog,ekeys,glow,rr,txt,tw,bg,PF,hash,createReel,rgbRing,drawFirma} from '../lib/engine.js';
import {device,phonePoint,entreno,statusBar} from '../lib/ui.js';
import {BT,T_STAMP,T_DROP,T_OUT,T_LOOP,B_RESULT,B_REWIND,questionBoxes,stampTitle,captionBand,rewindFX,loopWipe,flyChunks,landTime,phoneRise} from '../lib/chau.js';
import {endcard,endcardBg,endcardCues,ENDCARD_LAND} from '../lib/endcard.js';

const T_GO=3.55,REST0=3.62,T_EXIT=4.3,T_SIDE0=4.55,T_SIDE1=4.95,T_NOTIF=7.45,T_BACK=7.9,T_TAPN=8.05,T_RET=8.12,T_CLOSE=8.7,T_CK=9.52;
const REST_END_CLOCK='18:44';

/* ---------- the mess: a generic light feed + the rest that never ends ---------- */
const L_FEED={bg:'#F2F3F5',card:'#FFFFFF',bar:'#DDE0E5',ic:'#8A9099'};
const IMGS=[['#D9CFC4','#B9C3CF'],['#C7D3CC','#E2D6C8'],['#CFC8DA','#D8DDE3'],['#E3D2C8','#C6CDD6'],['#CAD6DE','#DAD2C7']];
const feedPos=t=>ekeys(t,[[0,0],[BT-0.16,-40],[BT+0.06,-760],[2*BT-0.16,-800],[2*BT+0.06,-1540],[3*BT-0.16,-1580],[3*BT+0.06,-2330],[T_STAMP,-2380]]);
function geomF(L){return L.fmt==='9x16'?{x:40,w:1000,ph:1180,top:420,img:760}:{x:150,w:780,ph:960,top:190,img:600};}
function post(c,i,x,y,w,imgH,k){c.fillStyle=L_FEED.card;rr(c,x,y,w,imgH+300*k,28*k);c.fill();c.fillStyle=L_FEED.bar;c.beginPath();c.arc(x+60*k,y+60*k,32*k,0,7);c.fill();rr(c,x+110*k,y+44*k,220*k,22*k,11*k);c.fill();rr(c,x+110*k,y+76*k,140*k,16*k,8*k);c.fill();
  const[a,b]=IMGS[i%IMGS.length],g=c.createLinearGradient(x,y+120*k,x+w,y+120*k+imgH);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(x,y+120*k,w,imgH);
  c.fillStyle='rgba(255,255,255,0.35)';c.beginPath();c.arc(x+w*(0.3+0.4*hash(i)),y+120*k+imgH*(0.35+0.3*hash(i+5)),imgH*0.22,0,7);c.fill();
  const ay=y+120*k+imgH+56*k;c.strokeStyle=L_FEED.ic;c.lineWidth=5*k;c.lineJoin='round';const hx=x+60*k;
  c.beginPath();c.moveTo(hx,ay+14*k);c.bezierCurveTo(hx-34*k,ay-10*k,hx-22*k,ay-38*k,hx,ay-18*k);c.bezierCurveTo(hx+22*k,ay-38*k,hx+34*k,ay-10*k,hx,ay+14*k);c.stroke();
  c.beginPath();c.arc(x+150*k,ay-10*k,24*k,0.4,Math.PI*2-0.2);c.lineTo(x+128*k,ay+18*k);c.stroke();c.beginPath();c.moveTo(x+210*k,ay-6*k);c.lineTo(x+260*k,ay-30*k);c.lineTo(x+240*k,ay+18*k);c.closePath();c.stroke();
  c.fillStyle=L_FEED.bar;rr(c,x+36*k,ay+50*k,w*0.7,18*k,9*k);c.fill();rr(c,x+36*k,ay+84*k,w*0.45,18*k,9*k);c.fill();}
function feedRects(L,t){const G=geomF(L),y0=feedPos(t),k=G.w/1000,out=[];for(let i=0;i<6;i++){const y=G.top+y0+i*G.ph;out.push({i,y,x:G.x,w:G.w,img:G.img,k});}return out;}
// the rest counter: planned 2:00, real 1:10 → 9:58
function restPill(c,t,L){const secs=Math.floor(lerp(70,598,E.inCubic(clamp(t/T_STAMP)))),over=secs>120,y=L.fmt==='9x16'?L.safe.top+70:L.safe.top+50,s=L.fmt==='9x16'?1:0.86;
  c.save();c.translate(L.CX,y);c.scale(s,s);c.fillStyle=over?'#FF4D4D':'#2E3137';rr(c,-230,-52,460,104,52);c.fill();
  txt(c,'DESCANSO',-150,-8,700,22,'rgba(255,255,255,0.8)','left',3);txt(c,'planeado: 2:00',-150,26,500,22,'rgba(255,255,255,0.7)');
  txt(c,`${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`,200,20,800,58,'#fff','right');c.restore();}
function messWorld(c,t,L){c.fillStyle=L_FEED.bg;c.fillRect(-200,-200,L.W+400,L.H+400);for(const p of feedRects(L,t)){if(p.y>L.H||p.y+p.img+300*p.k<0)continue;post(c,p.i,p.x,p.y,p.w,p.img,p.k);}
  c.fillStyle='rgba(242,243,245,0.92)';c.fillRect(0,0,L.W,L.fmt==='9x16'?L.safe.top-20:0);restPill(c,t,L);}

/* ---------- inside the phone: a generic dark feed + the rest notification ---------- */
function darkFeed(c,t,sc){c.fillStyle='#0B0C0F';c.fillRect(0,0,390,844);
  for(let i=0;i<6;i++){const y=92+i*470-sc%470-Math.floor(sc/470)*0;const ii=i+Math.floor(sc/470);const yy=92+i*470-(sc%470);if(yy>844||yy<-470)continue;
    c.fillStyle='#22262E';c.beginPath();c.arc(34,yy+24,16,0,7);c.fill();rr(c,60,yy+14,110,10,5);c.fill();rr(c,60,yy+30,70,8,4);c.fill();
    const[a,b]=[['#3A2E4A','#1F3A44'],['#2E3F3A','#44342A'],['#2A3448','#3F2B3C'],['#41352C','#263541']][ii%4],g=c.createLinearGradient(0,yy+52,390,yy+372);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,yy+52,390,320);
    c.fillStyle='rgba(255,255,255,0.08)';c.beginPath();c.arc(120+150*hash(ii),yy+180+60*hash(ii+3),70,0,7);c.fill();
    c.strokeStyle='#8F98A6';c.lineWidth=2;c.beginPath();c.arc(30,yy+398,9,0,7);c.stroke();c.beginPath();c.arc(64,yy+398,9,0.4,6.1);c.stroke();c.fillStyle='#22262E';rr(c,18,yy+424,250,9,4);c.fill();rr(c,18,yy+442,160,9,4);c.fill();}
  c.fillStyle='rgba(11,12,15,0.94)';c.fillRect(0,0,390,48);}
function notifCard(c,y,a,t){if(a<=0)return;c.save();c.globalAlpha=a;c.fillStyle='#1E2129';rr(c,10,y,370,92,22);c.fill();c.strokeStyle='#2B303B';c.lineWidth=1;c.stroke();
  c.fillStyle='#000';c.beginPath();c.arc(40,y+30,14,0,7);c.fill();drawFirma(c,31,y+21,0.16,{wordmark:false});
  txt(c,'GIZE · ahora',62,y+35,500,12,C.text2);txt(c,'¡Descanso terminado! 💪',24,y+62,800,16,'#fff');txt(c,'Volvé a la próxima serie.',24,y+82,400,13,C.soft);c.restore();}

/* ---------- GIZE: the entreno screen, the rest, the next set ---------- */
const EX=[['Vuelos laterales sentado','✓ 12,5 kg × 12'],['Press inclinado con mancuernas',''],['Jalón unilateral en estocada','0/3 series'],['Peck deck','0/3 series'],['Curl bíceps en polea baja frontal','0/3 series']];
const CARD={name:'Press inclinado con mancuernas',last:[['30',1],['kg × ',0],['10',1],[' · ',0],['30',1],['kg × ',0],['9',1]],propose:'30 kg × 7-10',target:'7-10',note:'Bajá lento, 3 segundos. Codos a 45°.',goal:'Progreso en carga'};
const REV={};
const SA={rev:(k,t)=>{const r=REV[k]??(T_DROP+0.6);return E.outExpo(prog(t,r,r+0.3));},
  scroll:t=>ekeys(t,[[0,0],[3.05,0],[3.35,150]]),
  sets:[{kg:[[0,'32,5']],reps:[[0,'9']],ck:0},{kg:[[8.95,'3'],[9.02,'32'],[9.09,'32,'],[9.16,'32,5']],reps:[[9.32,'9']],ck:T_CK,focusKg:[8.9,9.25],focusReps:[9.25,9.5]},{kg:[],reps:[],ck:1e9}],
  pr:null,rest:{s:REST0,end:T_NOTIF,hide:T_CLOSE+0.05},collapse:1e9,ex:EX,card:CARD,doneBase:3,clock0:754,
  taps:[[142,845,T_GO],[350,745+150,T_CLOSE],[340,426+178+52+22,T_CK]]};
const restLeft=t=>120*(1-prog(t,REST0+0.02,T_NOTIF));
const clockAt=t=>t<6.4?'18:42':t<7.3?'18:43':'18:44';
function phoneScreen(c,t,mode){
  if(mode==='result'){darkFeed(c,t,1200+t*60);statusBar(c,'18:44');notifCard(c,54-120*(1-E.outBack(prog(t,0.02,0.3))),1,t);return;}
  if(t<T_EXIT){entreno(c,t,SA);return;}
  const back=E.outCubic(prog(t,T_RET,T_RET+0.35));
  if(back<1){darkFeed(c,t,Math.max(0,t-T_EXIT)*380+ekeys(t,[[5.6,0],[5.8,260],[6.7,260],[6.9,560]]));statusBar(c,clockAt(t));
    const n=E.outBack(prog(t,T_NOTIF,T_NOTIF+0.3));if(t>=T_NOTIF)notifCard(c,54-130*(1-n)-40*back,1-back,t);
    const ex=E.inOutCubic(prog(t,T_EXIT,T_EXIT+0.4));if(ex<1){c.save();c.globalAlpha=1-ex;c.translate(195,lerp(422,760,ex));c.scale(lerp(1,0.2,ex),lerp(1,0.2,ex));c.translate(-195,-422);c.beginPath();c.roundRect(0,0,390,844,50);c.clip();entreno(c,t,SA);c.restore();}}
  if(back>0){c.save();c.globalAlpha=back;c.translate(195,lerp(100,422,back));c.scale(lerp(0.25,1,back),lerp(0.12,1,back));c.translate(-195,-422);c.beginPath();c.roundRect(0,0,390,844,50);c.clip();entreno(c,t,SA);c.restore();}
  if(t>=T_TAPN-0.06&&t<T_TAPN+0.45){const u=t-T_TAPN,e=E.outCubic(clamp(u/0.45));c.fillStyle=`rgba(255,255,255,${0.35*(1-e)*(u<0?0:1)})`;c.beginPath();c.arc(200,100,10+30*e,0,7);c.fill();}}
const side=t=>E.inOutCubic(prog(t,T_SIDE0,T_SIDE1))*(1-E.inOutCubic(prog(t,T_BACK,T_BACK+0.4)));
function sideP(L,P,k){const d=L.fmt==='9x16'?{dx:-170,s:0.8,y:L.CY}:{dx:-160,s:0.85,y:L.CY+20};P.x=lerp(P.x,L.CX+d.dx,k);P.s=lerp(P.s,P.s*d.s,k);P.y=lerp(P.y,d.y,k);P.ay=lerp(P.ay,422,k);return P;}
function buzz(P,t,t0){const u=t-t0;if(u<0||u>0.55)return P;const d=1-u/0.55;P.x+=7*Math.sin(u*130)*d;P.rot=(P.rot||0)+0.025*Math.sin(u*95)*d;return P;}
function phoneP(t,L){let P=phoneRise(t,L,{push:[8.4,8.8],pull:[20,21],anchorY:640});P=sideP(L,P,side(t));P=buzz(P,t,T_NOTIF);P.y+=1700*E.inBack(prog(t,11.0,11.3));return P;}
// the countdown ring beside the phone (the ongoing notification, as a motion graphic)
function ring(c,t,L,a,{rem,done=0}){if(a<=0)return;const R=L.fmt==='9x16'?140:125,x=L.CX+(L.fmt==='9x16'?275:260),y=L.fmt==='9x16'?L.CY:L.CY+20;
  c.save();c.globalAlpha=a;c.translate(x,y);c.scale(lerp(0.6,1,a),lerp(0.6,1,a));glow(c,0,0,R*2,done?RGB.teal:RGB.blue,0.18+0.3*done);
  c.strokeStyle='#1C2029';c.lineWidth=14;c.beginPath();c.arc(0,0,R,0,7);c.stroke();const f=rem/120;
  if(done<1){c.strokeStyle=rgbRing(c,0,0,-Math.PI/2);c.lineWidth=14;c.lineCap='round';c.beginPath();c.arc(0,0,R,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0.001,f));c.stroke();c.lineCap='butt';}
  if(done>0){c.strokeStyle=`rgba(37,232,200,${done})`;c.lineWidth=14;c.beginPath();c.arc(0,0,R*(1+0.12*(1-done)),0,7);c.stroke();}
  const r=Math.ceil(rem);txt(c,'DESCANSO',0,-R*0.38,700,20,C.text2,'center',3);txt(c,`${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}`,0,R*0.2,800,R*0.5,'#fff','center');
  txt(c,`termina ${REST_END_CLOCK}`,0,R*0.52,500,20,C.text2,'center');c.restore();}
/* ---------- hook b: the result first ---------- */
function resultScene(c,t,L){bg(c,'#000',L);glow(c,L.CX*0.3,L.H*0.2,900,RGB.blue,0.2);glow(c,L.W,L.H,900,RGB.pink,0.15);
  let P=phoneRise(T_DROP+2,L);P=sideP(L,P,1);P=buzz(P,t,0.02);device(c,P,(cc,tt)=>phoneScreen(cc,tt,'result'),t);ring(c,t,L,1,{rem:0,done:E.outCubic(prog(t,0.02,0.3))});
  captionBand(c,t,L,[{t0:0.05,t1:B_RESULT-0.05,lines:['Tu descanso,','al segundo.'],key:[1,'al segundo']}]);}
/* ---------- piece ---------- */
let CH=[];
createReel({dur:15,
  init(L,P){const R=feedRects(L,T_STAMP).filter(p=>p.y>-p.img&&p.y<L.H),py=L.fmt==='9x16'?L.safe.top+70:L.safe.top+50,s=L.fmt==='9x16'?1:0.86;CH=[];
    CH.push({from:[L.CX-230*s,py-52*s,460*s,104*s],text:'',to:[16,240,358,40],g:'pill'});
    R.slice(0,3).forEach((p,j)=>{CH.push({from:[p.x+110*p.k,p.y+40*p.k,220*p.k,50*p.k],text:'',to:[[16,364,358,52],[16,426,358,60],[16,112,260,30]][j],g:['ex0','card','banner'][j]});
      CH.push({from:[p.x+40*p.k,p.y+170*p.k,p.w*0.62,150*p.k],text:'',to:[[28,604,334,44],[28,656,334,44],[28,824,210,42]][j],g:'card'});});
    CH.forEach((ch,i)=>{if(ch.g)REV[ch.g]=Math.min(REV[ch.g]??99,landTime(i)-0.05);});REV.header=T_DROP+0.45;REV.tabs=T_DROP+0.5;REV.nav=T_DROP+0.5;REV.ex2=REV.ex3=REV.ex4=landTime(CH.length-1);REV.save=landTime(CH.length-1);},
  hits:[[T_STAMP,18,0.04],[T_DROP,9,0.025],[T_NOTIF,7,0.02],[T_RET,4,0.01],[T_OUT,7,0.018],[T_OUT+ENDCARD_LAND,4,0.01]],
  fast:[[T_STAMP-0.03,T_STAMP+0.2],[T_DROP-0.02,T_DROP+0.7],[T_EXIT,T_SIDE1],[T_NOTIF,T_NOTIF+0.55],[T_BACK,T_RET+0.35],[10.95,11.35],[B_RESULT,B_REWIND],[0,0.55],[0.9*BT,3.2*BT]],
  bloom:t=>t<T_DROP?0:0.3,vignette:t=>t<T_STAMP?0.25:0.36,
  draw(c,t,L,P){const hookB=P.hook==='b';
    if(t<T_DROP+0.35){if(hookB&&t<B_REWIND){resultScene(c,t,L);rewindFX(c,t,L);}
      else{messWorld(c,Math.min(t,T_STAMP),L);if(!hookB&&t<T_STAMP)questionBoxes(c,t,L,{lines:[['¿Descansás','2','minutos'],['y','scrolleás','10?']],times:[0.1,0.2,0.3,0.55,0.65,0.78]});}}
    if(t>=T_DROP&&t<T_OUT+0.1){c.globalAlpha=E.inOutCubic(prog(t,T_DROP,T_DROP+0.3));bg(c,'#000',L);glow(c,L.W*0.1,L.H*0.15,900,RGB.blue,0.22);glow(c,L.W*0.9,L.H*0.85,900,RGB.pink,0.18);c.globalAlpha=1;}
    if(t>=T_STAMP&&t<T_DROP+0.35)stampTitle(c,t,L,{word:'DESCANSO ETERNO',ep:'04',topic:'EL DESCANSO'});
    if(t>=T_OUT-0.3)endcardBg(c,t,T_OUT,L,E.outCubic(prog(t,T_OUT-0.3,T_OUT)));
    if(t>=T_DROP&&t<11.4){const Pp=phoneP(t,L);device(c,Pp,(cc,tt)=>phoneScreen(cc,tt,'main'),t);flyChunks(c,t,CH,Pp);
      const ra=E.outBack(prog(t,T_SIDE0+0.2,T_SIDE1+0.15))*(1-E.inCubic(prog(t,T_BACK,T_BACK+0.3)));ring(c,t,L,clamp(ra),{rem:restLeft(t),done:E.outCubic(prog(t,T_NOTIF,T_NOTIF+0.3))});}
    if(t>=T_DROP)captionBand(c,t,L,[{t0:3.3,t1:4.45,lines:['Iniciás el descanso.'],key:[0,'descanso']},{t0:5.0,t1:7.3,lines:['Sigue corriendo','aunque salgas de la app.'],key:[1,'aunque salgas de la app']},{t0:9.3,t1:11.0,lines:['Y te avisa justo.','Ni un minuto de más.'],key:[1,'Ni un minuto de más']}]);
    if(t>=T_OUT-0.05)endcard(c,t,T_OUT,L,{cta:P.cta});
    loopWipe(c,t,L,(cc,LL)=>{if(hookB)resultScene(cc,0,LL);else messWorld(cc,0,LL);});},
  cues(L,P){const hookB=P.hook==='b',cues=[];
    if(hookB){cues.push({t:0.02,s:'buzz',d:0.5},{t:0.05,s:'chime'},{t:0.05,s:'whoosh',d:0.3,f0:600,f1:3000},{t:B_RESULT,s:'whoosh',d:0.42,f0:4000,f1:300,g:1.4},{t:B_RESULT+0.05,s:'sweep',f0:1800,f1:200,d:0.35});}
    else{[0.1,0.2,0.3,0.55,0.65,0.78].forEach(t=>cues.push({t,s:'click',f:1800,g:0.9}));for(let k=0;k<8;k++)cues.push({t:k*BT/2,s:'tick',hi:k%2===0,g:0.8+k*0.05});
      [1,2,3].forEach(k=>cues.push({t:k*BT-0.16,s:'whoosh',d:0.24,f0:3000,f1:700,g:0.9}));cues.push({t:0.3,s:'blip',f0:500,f1:300,d:0.18,g:1.1},{t:0,s:'drone',d:T_STAMP});}
    cues.push({t:T_STAMP-0.6,s:'rise',d:0.6},{t:T_STAMP,s:'stamp'},{t:T_STAMP+0.005,s:'strike'},{t:T_STAMP+0.2,s:'marker'},{t:T_STAMP+0.3,s:'pop'},{t:T_DROP-0.36,s:'revcrash',d:0.36},
      {t:T_DROP,s:'hit'},{t:T_DROP,s:'groove',t1:13.6,bpm:128,chords:[[0,'Dm'],[3.75,'F'],[5.625,'C'],[7.5,'G'],[9.375,'Dm'],[T_OUT,'C']]},{t:T_DROP,s:'whoosh',d:0.6,f0:200,f1:3000,g:1.4});
    CH.forEach((ch,i)=>cues.push({t:landTime(i),s:'blip',f0:900+i*120,f1:1400+i*150,d:0.1,g:0.9,p:-0.5+i*0.15}));
    cues.push({t:3.05,s:'whoosh',d:0.3,f0:500,f1:2000,g:0.5},{t:T_GO,s:'tap'},{t:T_GO+0.05,s:'blip',f0:880,f1:1320,d:0.12},{t:T_EXIT,s:'whoosh',d:0.4,f0:3000,f1:400,g:1.1},{t:T_SIDE0+0.2,s:'pop'},
      ...Array.from({length:10},(_,k)=>({t:5.0+k*0.24,s:'click',f:3200,d:0.008,g:0.35})),
      {t:T_NOTIF,s:'buzz',d:0.5},{t:T_NOTIF+0.02,s:'chime'},{t:T_NOTIF,s:'blip',f0:1760,f1:1760,d:0.08,g:0.9},{t:T_NOTIF+0.12,s:'blip',f0:1760,f1:1760,d:0.08,g:0.9},
      {t:T_TAPN,s:'tap'},{t:T_TAPN+0.05,s:'whoosh',d:0.35,f0:400,f1:3500},{t:T_CLOSE,s:'tap'},...[8.95,9.02,9.09,9.16,9.32].map(t=>({t,s:'type'})),{t:T_CK,s:'tap'},{t:T_CK+0.03,s:'pop'},
      {t:9.3,s:'bell',m:84,d:0.8},{t:11.0,s:'whoosh',d:0.35,f0:2500,f1:300});
    return[...cues,{t:T_OUT,s:'hit',g:0.8},{t:T_OUT+ENDCARD_LAND,s:'chord',ch:'C',d:3.2},...endcardCues(L,T_OUT),...Array.from({length:12},(_,q)=>({t:T_LOOP+q*0.045,s:'click',f:1800+q*60,g:0.5}))];},
});
</script></body></html>
