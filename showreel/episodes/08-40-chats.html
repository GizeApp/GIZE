  c.fillStyle=C.surface2;rr(c,x+56,y+24,150,4,2);c.fill();c.fillStyle=rgbLine(c,x+56,0,x+206,0);rr(c,x+56,y+24,150*p,4,2);c.fill();

function phoneScreen(c,t,opt={}){if(opt.result){chat(c,t,{result:true});return;}
