  c.strokeStyle='rgba(60,90,160,0.12)';c.lineWidth=2;for(let k=0;k<9;k++){c.beginPath();c.moveTo(-G.w/2+30,G.y0*0+(-G.h/2+120)+k*G.lh);c.lineTo(G.w/2-30,(-G.h/2+110)+k*G.lh);c.stroke();}

  a=rv('macros');if(a>0){c.globalAlpha=a;[['Proteína',T.p,TGT.p],['Carbos',T.c,TGT.c],['Grasas',T.f,TGT.f]].forEach(([l,v,g],i)=>{const y=352+i*38;txt(c,l,16,y,600,14,'#fff');txt(c,`${Math.round(v)} / ${g} g`,374,y,500,13,C.text2,'right');

  a=rv('meals');if(a>0){c.globalAlpha=a;const cena=[];if(addY(t)>0)cena.push(['🥣','Yogur griego natural','170 g · P 15,3 · C 6,8 · G 8,5','165 kcal',Y_ADD+0.25]);if(addA(t)>0)cena.push(['🍚','Arroz blanco (cocido)','200 g · P 5,3 · C 59,6 · G 0,2','261 kcal',A_ADD+0.25]);

    [['☀️','Desayuno','420 kcal'],['🍽️','Almuerzo','780 kcal'],['🧉','Merienda','260 kcal'],['🌙','Cena',cenaK?`${cenaK} kcal`:'']].forEach(([ic,l,k],i)=>{const y=546+i*40;txt(c,ic,16,y+22,400,15,'#fff');txt(c,l,42,y+22,700,15,'#fff');txt(c,k,318,y+22,500,13,C.text2,'right');

// the scanner (ui/scanner.js): camera view, RGB frame, red laser
function scanner(c,t){const o=E.outCubic(prog(t,SC_OPEN,SC_OPEN+0.22))*(1-E.inCubic(prog(t,SC_CLOSE,SC_CLOSE+0.2)));if(o<=0)return;c.save();c.translate(0,(1-o)*844);

  c.fillStyle='rgba(255,220,180,0.08)';c.beginPath();c.arc(80,160,120,0,7);c.fill();

  if(sel){c.fillStyle='rgba(47,160,255,0.4)';c.fillRect(236-tw('80',700,26),sy+174,tw('80',700,26),30);}txt(c,g,236,sy+197,700,26,'#fff','right');txt(c,'gramos',262,sy+194,500,14,C.text2);
