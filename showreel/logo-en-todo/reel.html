/* "El logo en todo" · 9.6 s, 150 BPM. The GIZE lockup never moves; the world behind it cuts:
   one slow shot, a strobe burst (a cut every 4 frames), a ramp down, then a cut on every beat,
   and the spec card again with «Muy pronto». Every mockup is drawn here: studio light, soft shadows. */

const BLUE='#2F7BFF',BLUE_D='#1446C8',SKIN='#C99A7E';
let LW,LX,LY,K;   // the lockup: width, top-left, scale (fixed for the whole piece)
function lockup(L){LW=L.W*0.5;K=LW/LOGO.w;LX=L.CX-LW/2;LY=L.H*0.46-LOGO.h*K/2;}
function logo(c,col,mono=true){drawFirma(c,LX,LY,K,{color:col,mono});}
const cy=L=>L.H*0.46;
function studio(c,L,top,bot){const g=c.createLinearGradient(0,0,0,L.H);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,0,L.W,L.H);}
function shadow(c,x,y,w,h,a=0.35){const g=c.createRadialGradient(x,y,0,x,y,w/2);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');c.save();c.translate(x,y);c.scale(1,h/w);c.translate(-x,-y);c.fillStyle=g;c.fillRect(x-w/2,y-w/2,w,w);c.restore();}
function sheen(c,x,y,w,h,a=0.25){const g=c.createLinearGradient(x,0,x+w,0);g.addColorStop(0,`rgba(255,255,255,0)`);g.addColorStop(0.35,`rgba(255,255,255,${a})`);g.addColorStop(0.5,`rgba(255,255,255,0)`);c.fillStyle=g;c.fillRect(x,y,w,h);}
