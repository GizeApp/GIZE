       chispas giran hacia adentro; el orbe se forma con sus colores girando y la G se traza con

       con los colores de la marca y rayos de luz detrás. Después sube la palabra GIZE letra por
       letra con un brillo de color, y se va: primero la marca (hacia adelante), después el fondo.
