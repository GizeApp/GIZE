# Arma la versión de GIZE para subir a Play Store (.aab firmado).
# Se corre a mano: Actions → "App Android · Play Store" → Run workflow.
# El archivo queda en la ejecución, sección "Artifacts" (gize-play-store), y se sube en
# Play Console → Probar y publicar → la versión que corresponda → Crear versión.
#
# Corre solo desde main y en el Environment "play-release". Crearlo (hace falta ser admin del
# repo): Settings → Environments → New environment → "play-release"; en «Deployment branches and
# tags» elegir «Selected branches and tags» y agregar solo main, y tildar «Required reviewers» con
# tu usuario. Ahí van estos 4 secrets («Environment secrets»); después borralos de Settings →
# Secrets and variables → Actions: mientras sigan en el repo, un workflow subido en otra rama los
# puede leer. Si se borran del repo sin cargarlos acá, falla en «Preparar la clave de firma».
#   ANDROID_KEYSTORE_BASE64   la clave de subida (.jks) en base64
#   ANDROID_KEYSTORE_PASSWORD contraseña del .jks
#   ANDROID_KEY_ALIAS         alias de la clave (gize)
#   ANDROID_KEY_PASSWORD      contraseña de la clave (la misma que la del .jks)
name: App Android · Play Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión que ve el usuario (ej: 1.0.1)"
        required: true
        default: "1.0.0"

# El token de GitHub de la ejecución solo puede leer el repo.
permissions:
  contents: read

jobs:
  aab:
    # Desde otra rama no arranca, y los secrets de firma están en el Environment (ver arriba).
    if: github.ref == 'refs/heads/main'
    environment: play-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm ci
      - name: Juntar la app web y pasarla al proyecto Android
        run: npm run android
      # La app de Android no usa la ubicación: el plugin queda afuera del build (capacitor.config.json
      # android.includePlugins). Si después de cap sync volviera a aparecer, se frena acá.
      - name: Revisar que no quede el plugin de ubicación
        run: |
          if grep -q "background-geolocation" android/capacitor.settings.gradle android/app/capacitor.build.gradle android/app/src/main/assets/capacitor.plugins.json; then
            echo "::error::El plugin de ubicación quedó en el build de Android (ver android.includePlugins en capacitor.config.json)"; exit 1
          fi
      - name: Preparar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gize-upload.jks"
      - name: Compilar .aab firmado
        working-directory: android
        env:
          GIZE_KEYSTORE: ${{ runner.temp }}/gize-upload.jks
          GIZE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GIZE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GIZE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Cada ejecución sube el número interno: Play Store no acepta repetirlo.
          GIZE_VERSION_CODE: ${{ github.run_number }}
          GIZE_VERSION_NAME: ${{ inputs.version }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gize-play-store
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
