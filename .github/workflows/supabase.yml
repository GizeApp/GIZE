# Tareas de Supabase sin entrar al panel: publicar funciones, cargar secrets, correr SQL,
# crear las cuentas demo para la revisión de Google Play y borrar las fotos de progreso viejas.
# Se corre a mano: Actions → "Supabase" → Run workflow → elegir la tarea.
#
# Corre solo desde main: lanzado desde otra rama no arranca, así no se puede correr SQL
# ni publicar funciones con código que no pasó por main.
#
# Secrets del repo (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  obligatorio. Token de supabase.com/dashboard/account/tokens con
#                          acceso SOLO a este proyecto: Project Settings (read), Logs (read),
#                          Database (read-write), Edge Functions (read-write),
#                          Edge Function Secrets (read-write), Auth Config (read-write).
#   MP_ACCESS_TOKEN        opcional. Access Token de producción de Mercado Pago (tarea "secrets").
#   SMTP_PASSWORD          ya no se usa (los mails salen por Resend, configurado en el panel de Supabase). Se puede borrar.
#   RESEND_API_KEY         opcional. Clave de Resend ("Sending access") para los avisos de pagos
#                          a los socios (tarea "secrets").
#   AVISOS_PAGOS           opcional. Mails que reciben los avisos de pagos, separados por coma.
#   RESEND_FULL_KEY        para "secrets". Clave de Resend con acceso completo ("Full access"): la
#                          función "contacto" la usa para leer los mails que llegan a contacto@gize.ar.
#   RESEND_WEBHOOK_SECRET  para "secrets". El "Signing secret" (whsec_…) del webhook de Resend que
#                          avisa los mails recibidos (función "contacto").
#   DEMO_PASSWORD          para "cuentas-demo". Contraseña de las cuentas demo de Google Play.
#                          Va como secret y no como dato del formulario: el repo es público y
#                          los datos del formulario quedan escritos en el log de la ejecución.
#   SUPABASE_SERVICE_ROLE_KEY  para "borrar-fotos-progreso", solo si el token de arriba no puede
#                          leer las API keys del proyecto (la tarea lo avisa). Supabase → Project
#                          Settings → API Keys → la clave "service_role" (o una "secret"). Da
#                          acceso total a la base: borrarlo de GitHub apenas termine la tarea.
name: Supabase

on:
  workflow_dispatch:
    inputs:
      tarea:
        description: "Qué hacer"
        type: choice
        required: true
        options:
          - funciones
          - secrets
          - sql
          - cuentas-demo
          - borrar-fotos-progreso
      archivo:
        description: "Para 'sql': archivo a correr (ej: supabase/estado.sql)"
        required: false
        default: ""

# El token de GitHub de la ejecución solo puede leer el repo.
permissions:
  contents: read

jobs:
  supabase:
    # Desde otra rama no arranca.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      PROJECT_REF: wegptuzhsrwppbknqstf
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Revisar el token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN"; exit 1; fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.tarea == 'borrar-fotos-progreso'
        with:
          node-version: 22

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: inputs.tarea == 'funciones' || inputs.tarea == 'secrets'
        with:
          # Versión fija: con "latest" cada ejecución bajaba lo último que se publicara.
          version: 2.118.0

      # La app llama a la función de mensajes "rapid-worker" (el nombre que le puso
      # Supabase al crearla desde el panel); el código es el de notificar-cliente.
      # Todas van sin "Verify JWT": suscripcion recibe los avisos de Mercado Pago sin
      # sesión, contacto los mails que avisa Resend (valida la firma del webhook), y las que
      # usa la app validan al usuario por su cuenta con auth.getUser().
      - name: Publicar funciones
        if: inputs.tarea == 'funciones'
        run: |
          cp -r supabase/functions/notificar-cliente supabase/functions/rapid-worker
          for fn in rapid-worker suscripcion descanso avisos-coach admin contacto borrar-audios productos-off vence-plan; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done

      - name: Cargar secrets de las funciones
        if: inputs.tarea == 'secrets'
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FULL_KEY: ${{ secrets.RESEND_FULL_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          AVISOS_PAGOS: ${{ secrets.AVISOS_PAGOS }}
        run: |
          # Se cargan los que estén en GitHub: Mercado Pago y, para la app de iPhone, la clave de Apple.
          set -- 
          [ -n "$MP_ACCESS_TOKEN" ] && set -- "$@" MP_ACCESS_TOKEN="$MP_ACCESS_TOKEN"
          [ -n "$APNS_KEY_P8" ] && set -- "$@" APNS_KEY_P8="$APNS_KEY_P8" APNS_KEY_ID="$APNS_KEY_ID" APPLE_TEAM_ID="$APPLE_TEAM_ID"
          [ -n "$RESEND_API_KEY" ] && set -- "$@" RESEND_API_KEY="$RESEND_API_KEY"
          [ -n "$RESEND_FULL_KEY" ] && set -- "$@" RESEND_FULL_KEY="$RESEND_FULL_KEY"
          [ -n "$RESEND_WEBHOOK_SECRET" ] && set -- "$@" RESEND_WEBHOOK_SECRET="$RESEND_WEBHOOK_SECRET"
          [ -n "$AVISOS_PAGOS" ] && set -- "$@" AVISOS_PAGOS="$AVISOS_PAGOS"
          if [ $# -eq 0 ]; then echo "::error::No hay secrets para cargar en GitHub (Settings → Secrets and variables → Actions)"; exit 1; fi
          supabase secrets set --project-ref "$PROJECT_REF" "$@"
          # Solo los nombres: la lista trae también un resumen (hash) de cada valor y el log es público.
          supabase secrets list --project-ref "$PROJECT_REF" | awk -F'|' '{print $1}'

      # Fotos de progreso viejas: borra TODOS los archivos del bucket "checkins" con la API de
      # Storage (ver scripts/borrar-fotos-progreso.mjs). Después va la tarea "sql" con
      # supabase/borrar-fotos-progreso.sql. Se puede correr de nuevo sin problema.
      # El log es PÚBLICO: solo cantidades. La clave de servicio no se imprime nunca (y por las
      # dudas se enmascara apenas se tiene).
      - name: Borrar fotos de progreso
        if: inputs.tarea == 'borrar-fotos-progreso'
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          KEY="$SERVICE_ROLE_KEY"
          code="(sin pedir)"
          if [ -z "$KEY" ]; then
            # Sin el secret, se le pide la clave a Supabase con el token de siempre (necesita el
            # permiso de leer las API keys). La respuesta queda en un archivo y no va al log.
            code=$(curl -sS -o "$RUNNER_TEMP/keys.json" -w '%{http_code}' \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN") || code="(sin respuesta)"
            if [ "$code" = "200" ]; then
              KEY=$(jq -r '[.[] | select((.api_key | type) == "string")
                           | select((.type == "secret" and (.api_key | test("^sb_secret_[A-Za-z0-9_-]{20,}$")))
                                 or (.name == "service_role" and (.api_key | test("^eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"))))]
                         | sort_by(if .type == "secret" then 0 else 1 end) | .[0].api_key // empty' "$RUNNER_TEMP/keys.json" 2>/dev/null || true)
            fi
            rm -f "$RUNNER_TEMP/keys.json"
          fi
          if [ -z "$KEY" ]; then
            echo "::error::No se pudo conseguir la clave de servicio (Supabase respondió $code). Cargá el secret SUPABASE_SERVICE_ROLE_KEY (ver arriba de este archivo) y corré la tarea de nuevo."
            exit 1
          fi
          echo "::add-mask::$KEY"
          SUPABASE_URL="https://$PROJECT_REF.supabase.co" SUPABASE_SERVICE_KEY="$KEY" node scripts/borrar-fotos-progreso.mjs

      - name: Correr SQL
        if: inputs.tarea == 'sql' || inputs.tarea == 'cuentas-demo'
        env:
          ARCHIVO: ${{ inputs.archivo }}
          TAREA: ${{ inputs.tarea }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ "$TAREA" = "cuentas-demo" ]; then
            if [ ${#DEMO_PASSWORD} -lt 8 ]; then echo "::error::Falta el secret DEMO_PASSWORD (al menos 8 caracteres)"; exit 1; fi
            echo "::add-mask::$DEMO_PASSWORD"
            # Al pegar el secret suele colarse un Enter al final: se saca. Uno en el medio no se acepta.
            python3 -c 'import os,sys; pw=os.environ["DEMO_PASSWORD"].strip(); "\n" in pw and sys.exit("DEMO_PASSWORD tiene un salto de línea en el medio"); sys.stdout.write(open("supabase/cuentas-demo.sql").read().replace("__DEMO_PASSWORD__", pw.replace("\x27","\x27\x27")))' > "$RUNNER_TEMP/q.sql"
          else
            case "$ARCHIVO" in *..*) echo "::error::Ruta inválida"; exit 1;; supabase/*.sql) ;; *) echo "::error::El archivo tiene que ser supabase/<algo>.sql"; exit 1;; esac
            [ -f "$ARCHIVO" ] || { echo "::error::No existe $ARCHIVO"; exit 1; }
            cp "$ARCHIVO" "$RUNNER_TEMP/q.sql"
          fi
          jq -Rs '{query: .}' "$RUNNER_TEMP/q.sql" > "$RUNNER_TEMP/body.json"
          code=$(curl -sS -o "$RUNNER_TEMP/out.json" -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/body.json")
          # El log es PÚBLICO (repo público): no se imprime el resultado, solo si anduvo y cuántas
          # filas devolvió. Para ver datos, correr la consulta en el SQL Editor de Supabase.
          # Si falla, tampoco va el mensaje de Postgres (su DETAIL puede traer valores de filas,
          # ej. «Key (email)=(...) already exists»): solo el código de error (SQLSTATE) si viene.
          jq -r 'if type=="array" then "Filas devueltas: \(length)" else "La consulta falló" + ((.message // "" | tostring | capture("(SQLSTATE|ERROR:)[ :]*(?<c>[0-9A-Z]{5})\\b")? | " (código \(.c))") // "") + ". Para ver el detalle, correr el SQL en el SQL Editor de Supabase." end' "$RUNNER_TEMP/out.json" 2>/dev/null || echo "(respuesta sin formato JSON)"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "::error::Supabase respondió $code"; exit 1; }
