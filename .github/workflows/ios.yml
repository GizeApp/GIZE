# App de iPhone. Compila en una Mac de GitHub (no hace falta tener Mac).
#   · En cada PR que toque ios/ o la config (trabajo «simulador»): compila para el simulador,
#     sin firmar y sin ningún secret, para avisar si algo se rompió. También se corre a mano
#     desde cualquier rama que no sea main (Actions → "App iPhone" → Run workflow, eligiendo la
#     rama), para ver si compila antes de abrir el PR.
#   · A mano y solo desde main (Actions → "App iPhone" → Run workflow, trabajo «testflight»):
#     compila firmada y la sube a App Store Connect / TestFlight.
#
# «testflight» corre en el Environment "ios-release". Crearlo (hace falta ser admin del repo):
# Settings → Environments → New environment → "ios-release"; en «Deployment branches and tags»
# elegir «Selected branches and tags» y agregar solo main, y tildar «Required reviewers» con tu
# usuario. Ahí van estos secrets («Environment secrets»); después borralos de Settings → Secrets
# and variables → Actions: mientras sigan en el repo, un workflow subido en otra rama los puede
# leer. Si se borran del repo sin cargarlos acá, «testflight» falla en «Clave de App Store Connect».
#   APPLE_TEAM_ID   Team ID de 10 caracteres (developer.apple.com → Account → Membership). Lo usa
#                   también la tarea "secrets" de supabase.yml: cargalo además en "production".
#   ASC_KEY_ID      Key ID de la clave de la API de App Store Connect
#   ASC_ISSUER_ID   Issuer ID (App Store Connect → Usuarios y acceso → Integraciones → API)
#   ASC_KEY_P8      contenido completo del archivo AuthKey_XXXX.p8
name: App iPhone

on:
  pull_request:
    paths: ["ios/**", "capacitor.config.json", "package.json", "scripts/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión que ve el usuario (ej: 1.0.0)"
        required: true
        default: "1.0.0"

# El token de GitHub de la ejecución solo puede leer el repo.
permissions:
  contents: read

jobs:
  simulador:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: macos-latest
    # Con «shell: bash» GitHub corre cada paso con pipefail: si xcodebuild falla, el
    # «| tail -40» ya no esconde el error y el paso queda en rojo.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Apple solo acepta apps compiladas con el SDK más nuevo: se usa el Xcode de mayor
      # versión instalado en la Mac de GitHub (no el que viene por defecto).
      - name: Elegir el Xcode más nuevo
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sed -E 's#.*/Xcode_([0-9.]+)\.app#\1 &#' | grep -v beta | sort -V | tail -1 | cut -d' ' -f2)
          echo "Usando $X"; sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      # El plugin de login (lo usa «Continuar con Apple») declara siempre el SDK de Facebook para
      # Swift Package Manager, aunque capacitor.config.json lo apague. GIZE no lo usa: se saca
      # antes de compilar para que no entre a la app (ver el script).
      - name: Sacar Facebook del plugin de login
        run: node scripts/ios-sin-facebook.mjs
      - name: Juntar la app web y pasarla al proyecto iOS
        run: node scripts/build-web.mjs && npx cap sync ios
      # La app de iPhone no usa la ubicación, como la de Android (Apple la rechazó por el modo de
      # fondo "location"): ni un plugin de ubicación en el build, ni textos de permiso de ubicación
      # (NSLocation…) ni el modo de fondo "location" en el Info.plist. Si vuelve algo de eso, se
      # frena acá. Si falta uno de los archivos, grep no encuentra nada y el control pasaría sin
      # mirar: antes se revisa que estén.
      - name: Revisar que la app no use la ubicación
        run: |
          for f in ios/App/CapApp-SPM/Package.swift ios/App/App/capacitor.config.json ios/App/App/Info.plist; do
            if [ ! -f "$f" ]; then echo "::error::Falta $f"; exit 1; fi
          done
          if grep -qi "geolocation" ios/App/CapApp-SPM/Package.swift ios/App/App/capacitor.config.json; then
            echo "::error::Quedó un plugin de ubicación en el build de iPhone (ver package.json)"; exit 1
          fi
          if grep -q "NSLocation" ios/App/App/Info.plist || plutil -extract UIBackgroundModes json -o - ios/App/App/Info.plist 2>/dev/null | grep -q '"location"'; then
            echo "::error::El Info.plist pide la ubicación o tiene el modo de fondo location"; exit 1
          fi

      - name: Compilar para el simulador (sin firmar)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

  # Los mismos pasos de arriba para armar el proyecto, y después la firma y la subida. Solo desde
  # main y en el Environment con los secrets de Apple (ver arriba).
  testflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: ios-release
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Elegir el Xcode más nuevo
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sed -E 's#.*/Xcode_([0-9.]+)\.app#\1 &#' | grep -v beta | sort -V | tail -1 | cut -d' ' -f2)
          echo "Usando $X"; sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Sacar Facebook del plugin de login
        run: node scripts/ios-sin-facebook.mjs
      - name: Juntar la app web y pasarla al proyecto iOS
        run: node scripts/build-web.mjs && npx cap sync ios
      # Lo mismo que en «simulador»: la app no usa la ubicación.
      - name: Revisar que la app no use la ubicación
        run: |
          for f in ios/App/CapApp-SPM/Package.swift ios/App/App/capacitor.config.json ios/App/App/Info.plist; do
            if [ ! -f "$f" ]; then echo "::error::Falta $f"; exit 1; fi
          done
          if grep -qi "geolocation" ios/App/CapApp-SPM/Package.swift ios/App/App/capacitor.config.json; then
            echo "::error::Quedó un plugin de ubicación en el build de iPhone (ver package.json)"; exit 1
          fi
          if grep -q "NSLocation" ios/App/App/Info.plist || plutil -extract UIBackgroundModes json -o - ios/App/App/Info.plist 2>/dev/null | grep -q '"location"'; then
            echo "::error::El Info.plist pide la ubicación o tiene el modo de fondo location"; exit 1
          fi

      - name: Clave de App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ]; then echo "::error::Faltan los secrets de App Store Connect"; exit 1; fi
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      # Certificados intermedios oficiales de Apple (WWDR), para que la firma lleve la cadena
      # completa hasta la raíz de Apple.
      - name: Certificados intermedios de Apple
        run: |
          for c in AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG5 AppleWWDRCAG6; do
            curl -fsSL -o "$RUNNER_TEMP/$c.cer" "https://www.apple.com/certificateauthority/$c.cer"
            security import "$RUNNER_TEMP/$c.cer" -k "$HOME/Library/Keychains/login.keychain-db" || true
          done

      # Se firma con un certificado de distribución propio, creado en cada ejecución
      # (scripts/ios-firma.py); la clave privada se crea en esta Mac y no sale de acá. El
      # certificado NO se revoca después de subir. Apple revisa la firma recién en la revisión de la
      # App Store y, si el certificado ya está revocado, rechaza la versión con el error 90035
      # «Invalid Signature» (pasó con 1.0.0 (59); antes se le había echado la culpa a la falta de
      # sello de tiempo). Para no llegar al tope de certificados de Apple, el script revoca los
      # viejos de CI cuando hace falta, siempre dejando el más nuevo. El script no usa
      # paquetes de PyPI (firma con openssl). Ojo: la compilación de abajo todavía baja en el
      # momento los paquetes de Swift (SPM) de los plugins, sin un Package.resolved que fije cada
      # versión. Pendiente: generarlo en una Mac (xcodebuild -resolvePackageDependencies), subirlo
      # y compilar con -onlyUsePackageVersionsFromResolvedFile.
      - name: Certificado y perfil de App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ar.com.gize.app
          RUN_ID: ${{ github.run_id }}
        run: ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python3 scripts/ios-firma.py crear

      - name: Compilar firmada y subir a TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            "${AUTH[@]}" archive | tail -40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>ar.com.gize.app</key><string>$IOS_PROFILE_NAME</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          # Se exporta el .ipa acá, se revisa la firma y recién después se sube: si Apple la
          # rechaza, el registro dice qué parte está mal (sin nombres ni datos de la cuenta).
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" | tail -40
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa)
          mkdir -p "$RUNNER_TEMP/revisar" && unzip -q "$IPA" -d "$RUNNER_TEMP/revisar"
          for f in "$RUNNER_TEMP"/revisar/Payload/App.app "$RUNNER_TEMP"/revisar/Payload/App.app/Frameworks/*.framework; do
            echo "== $(basename "$f")"
            codesign -dvv "$f" 2>&1 | grep '^Authority=' | sed -E 's/^Authority=(Apple Distribution|Apple Development|iPhone Distribution|iPhone Developer):.*/Authority=\1: (cuenta)/'
            codesign -dvv "$f" 2>&1 | grep -E '^(Timestamp|Signed Time)=' | sed -E 's/=.*/=(presente)/'
            codesign --verify --strict "$f" && echo "verificación local: OK" || echo "verificación local: FALLA"
          done
          mkdir -p ~/.appstoreconnect/private_keys && cp "$RUNNER_TEMP/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          # Desde acá la versión puede llegar a Apple firmada con el certificado: el último paso ya
          # no lo revoca (aunque la subida falle, por las dudas de que algo haya llegado).
          touch "$RUNNER_TEMP/ios-firma-subida"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER" 2>&1 | tail -30

      # Siempre, aunque algo haya fallado: borra el llavero y revoca los certificados de desarrollo
      # que creó Xcode. El de distribución y su perfil se revocan SOLO si no se llegó a subir nada;
      # si se subió quedan (revocarlo invalida la versión en revisión, ver arriba).
      - name: Limpiar la firma
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          [ -f "$RUNNER_TEMP/AuthKey.p8" ] || exit 0
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python3 scripts/ios-firma.py borrar
