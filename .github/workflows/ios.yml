# App de iPhone. Compila en una Mac de GitHub (no hace falta tener Mac).
#   · En cada PR que toque ios/ o la config: compila para el simulador, sin firmar, para
#     avisar si algo se rompió.
#   · A mano (Actions → "App iPhone" → Run workflow): compila firmada y la sube a
#     App Store Connect / TestFlight.
#
# Secrets para subir (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   Team ID de 10 caracteres (developer.apple.com → Account → Membership)
#   ASC_KEY_ID      Key ID de la clave de la API de App Store Connect
#   ASC_ISSUER_ID   Issuer ID (App Store Connect → Usuarios y acceso → Integraciones → API)
#   ASC_KEY_P8      contenido completo del archivo AuthKey_XXXX.p8
name: App iPhone

on:
  pull_request:
    paths: ["ios/**", "capacitor.config.json", "package.json", "scripts/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión que ve el usuario (ej: 1.0.0)"
        required: true
        default: "1.0.0"

# El token de GitHub de la ejecución solo puede leer el repo.
permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Apple solo acepta apps compiladas con el SDK más nuevo: se usa el Xcode de mayor
      # versión instalado en la Mac de GitHub (no el que viene por defecto).
      - name: Elegir el Xcode más nuevo
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sed -E 's#.*/Xcode_([0-9.]+)\.app#\1 &#' | grep -v beta | sort -V | tail -1 | cut -d' ' -f2)
          echo "Usando $X"; sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      # El plugin de login (lo usa «Continuar con Apple») declara siempre el SDK de Facebook para
      # Swift Package Manager, aunque capacitor.config.json lo apague. GIZE no lo usa: se saca
      # antes de compilar para que no entre a la app (ver el script).
      - name: Sacar Facebook del plugin de login
        run: node scripts/ios-sin-facebook.mjs
      - name: Juntar la app web y pasarla al proyecto iOS
        run: node scripts/build-web.mjs && npx cap sync ios

      - name: Compilar para el simulador (sin firmar)
        if: github.event_name == 'pull_request'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Clave de App Store Connect
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ]; then echo "::error::Faltan los secrets de App Store Connect"; exit 1; fi
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Compilar firmada y subir a TestFlight
        if: github.event_name == 'workflow_dispatch'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            "${AUTH[@]}" archive | tail -40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -40
