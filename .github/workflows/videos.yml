# Revisa los videos de ejercicios de YouTube (existen, son Shorts, se pueden insertar y de
# qué canal son). A mano: Actions → "Videos" → Run workflow. También corre solo cada lunes
# sobre la biblioteca de la app, para enterarnos si algún autor borró un video.
name: Videos

on:
  workflow_dispatch:
    inputs:
      archivo:
        description: "Archivo con los videos a revisar"
        required: false
        default: "app/core/videos.js"
  schedule:
    - cron: "17 12 * * 1"

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Revisar videos
        env:
          ARCHIVO: ${{ inputs.archivo || 'app/core/videos.js' }}
        run: |
          case "$ARCHIVO" in *..*|/*) echo "::error::Ruta inválida"; exit 1;; esac
          node scripts/verificar-videos.mjs "$ARCHIVO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: videos-resultado
          path: videos-resultado.json
