# Suma a la base compartida de GIZE (tabla products) los productos argentinos de
# Open Food Facts que tienen la tabla nutricional completa (ver scripts/importar-off.mjs).
# No pisa lo que cargaron los usuarios ni lo que se revisó a mano en el panel.
# Se corre a mano (Actions → "Importar Open Food Facts" → Run workflow) y solo una vez por mes
# para traer lo nuevo (Open Food Facts actualiza su archivo completo todos los días).
# Antes de la primera vez: tarea "sql" de Supabase con supabase/productos-off.sql.
#
# Corre solo desde main y en el Environment "catalogo" (también lo usa importar-super.yml), no en
# "production": ese pide aprobación, y la corrida de cada mes quedaría esperando hasta que GitHub
# la cancele a los 30 días. Crearlo (hace falta ser admin del repo):
# Settings → Environments → New environment → "catalogo"; en «Deployment branches and tags»
# elegir «Selected branches and tags» y agregar solo main, sin revisores. Ahí va su propio
# SUPABASE_ACCESS_TOKEN («Environment secret»): un token de supabase.com/dashboard/account/tokens
# con acceso SOLO a este proyecto y solo Database (read-write), lo único que usan los scripts
# (/database/query).
# El log es PÚBLICO: el script imprime solo cantidades.
name: Importar Open Food Facts

on:
  workflow_dispatch:
    inputs:
      cargar:
        description: "Cargar en la base (sin tildar: solo cuenta cuántos entrarían)"
        type: boolean
        default: true
  schedule:
    - cron: "17 6 3 * *"

permissions:
  contents: read

concurrency:
  group: importar-off
  cancel-in-progress: false

jobs:
  importar:
    if: github.ref == 'refs/heads/main'
    environment: catalogo
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # El archivo completo de Open Food Facts (~1 GB comprimido): su buscador no deja
      # pasar de unas pocas páginas, el archivo es lo que recomiendan para descargas grandes.
      - name: Descargar Open Food Facts
        run: |
          curl -fsSL --retry 5 --retry-delay 30 -A "GIZE/1.0 (https://gize.ar - soporte@gize.ar)" \
            -o "$RUNNER_TEMP/off.csv.gz" https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz
          ls -lh "$RUNNER_TEMP/off.csv.gz" | awk '{print "Descargado:", $5}'

      - name: Importar
        env:
          PROJECT_REF: wegptuzhsrwppbknqstf
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CARGAR: ${{ github.event_name == 'schedule' || inputs.cargar }}
        run: |
          if [ "$CARGAR" = "true" ]; then
            if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN"; exit 1; fi
            node scripts/importar-off.mjs --csv "$RUNNER_TEMP/off.csv.gz" --apply
          else
            node scripts/importar-off.mjs --csv "$RUNNER_TEMP/off.csv.gz" --out "$RUNNER_TEMP/off.sql"
          fi
