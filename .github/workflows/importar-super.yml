# Suma a la base compartida de GIZE (tabla products) los productos de supermercado con su
# tabla nutricional y su código de barras (ver scripts/importar-super.mjs).
# No pisa lo que cargaron los usuarios ni lo que se revisó a mano en el panel.
# Se corre a mano (Actions → "Importar productos de supermercado" → Run workflow) y una vez
# por mes para traer lo nuevo.
#
# Usa el secret SUPABASE_ACCESS_TOKEN (el mismo del workflow "Supabase"). Corre solo desde main.
# El log es PÚBLICO: el script imprime solo cantidades.
name: Importar productos de supermercado

on:
  workflow_dispatch:
    inputs:
      cargar:
        description: "Cargar en la base (sin tildar: solo cuenta cuántos entrarían)"
        type: boolean
        default: true
  schedule:
    - cron: "43 7 5 * *"

permissions:
  contents: read

concurrency:
  group: importar-super
  cancel-in-progress: false

jobs:
  importar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Importar
        env:
          PROJECT_REF: wegptuzhsrwppbknqstf
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CARGAR: ${{ github.event_name == 'schedule' || inputs.cargar }}
        run: |
          if [ "$CARGAR" = "true" ]; then
            if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN"; exit 1; fi
            node scripts/importar-super.mjs --apply
          else
            node scripts/importar-super.mjs --out "$RUNNER_TEMP/filas.json"
          fi
