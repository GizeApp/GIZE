# Arma la app de Android (APK para probar) en cada cambio a main que toque la app,
# o a mano desde Actions → "App Android" → Run workflow.
# El APK queda para descargar en la ejecución, sección "Artifacts" (gize-android-debug).
name: App Android

on:
  push:
    branches: [main]
    paths: ["manifest.json", "install.js", "app/**", "css/**", "brand/**", "vendor/**", "android/**", "capacitor.config.json", "package.json", "scripts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "capacitor.config.json", "package.json", "scripts/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# El token de GitHub de la ejecución solo puede leer el repo.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm ci
      - name: Juntar la app web y pasarla al proyecto Android
        run: npm run android
      # La app de Android no usa la ubicación: el plugin queda afuera del build (capacitor.config.json
      # android.includePlugins). Si después de cap sync volviera a aparecer, se frena acá.
      - name: Revisar que no quede el plugin de ubicación
        run: |
          if grep -q "background-geolocation" android/capacitor.settings.gradle android/app/capacitor.build.gradle android/app/src/main/assets/capacitor.plugins.json; then
            echo "::error::El plugin de ubicación quedó en el build de Android (ver android.includePlugins en capacitor.config.json)"; exit 1
          fi
      - name: Compilar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gize-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
