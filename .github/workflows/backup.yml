# Copia de seguridad de la base de Supabase, cifrada, y prueba de que se puede restaurar.
# Corre sola los lunes y también a mano: Actions → "Backup de la base" → Run workflow.
#
# Qué hace:
#   1. pg_dump de toda la base (datos de usuarios, rutinas, entrenos, planes…). Las fotos
#      (Storage) no entran: son archivos, no filas de la base. Tampoco las sesiones abiertas
#      ni los tokens de inicio de sesión (con una copia robada y descifrada se podría entrar
#      a las cuentas sin contraseña): después de restaurar, cada uno vuelve a iniciar sesión.
#   2. La cifra con BACKUP_PASSWORD (AES-256, con la derivación de clave más lenta de gpg para
#      que probar contraseñas de a millones no sirva). Mientras el repo sea público
#      cualquiera con cuenta de GitHub puede bajar los Artifacts: sin la contraseña el
#      archivo no sirve para nada.
#   3. La restaura en una base vacía y compara cuántas filas tiene cada tabla con la original.
#      Si falta algo, la ejecución sale en rojo.
#   4. Permisos de las funciones y de las tablas: la copia los lleva (GRANT/REVOKE) y además se
#      guarda, cifrado igual, permisos-AAAA-MM-DD.sql, que los vuelve a dejar como en la original
#      después de restaurar. Antes la copia iba sin permisos (--no-privileges) y, al
#      restaurarla, las funciones internas que cuida solo un REVOKE (tomar_avisos_vence,
#      pasos_totales, product_off_lookup, cron_secret…) quedaban abiertas para cualquiera con la
#      clave pública de la app. Aun con los permisos en la copia no alcanza: en Supabase todo lo
#      que se crea en public nace abierto para anon y authenticated, y la copia no lo deshace
#      (por eso el .sql). Lo mismo con las tablas: products volvía a mostrar quién cargó cada
#      producto (created_by, photo_path), y las tablas cerradas con un REVOKE quedaban abiertas.
#      Después de subir la copia se prueba en la base de prueba, abierta igual que Supabase,
#      que con ese .sql ninguna función, tabla ni columna queda más abierta que en la original;
#      si no, la ejecución sale en rojo (la copia ya quedó subida).
#   El archivo queda 21 días en la ejecución (Artifacts → backup-base): alcanza para tener
#   las últimas 3 copias semanales sin dejar meses de copias a disposición.
#
# Corre solo desde main y en el Environment "backup". Crearlo (hace falta ser admin del repo):
# Settings → Environments → New environment → "backup"; en «Deployment branches and tags» elegir
# «Selected branches and tags» y agregar solo main, sin revisores (si no, la copia semanal queda
# esperando). Los secrets de abajo van ahí («Environment secrets»); después borralos de Settings →
# Secrets and variables → Actions: mientras sigan en el repo, un workflow subido en otra rama los
# puede leer. Si se borran del repo sin cargarlos acá, falla en «Revisar los secrets».
#
# Secrets del Environment "backup":
#   SUPABASE_DB_URL   Supabase → botón "Connect" → "Session pooler" → la URI, con la
#                     contraseña de la base en lugar de [YOUR-PASSWORD].
#   BACKUP_PASSWORD   una contraseña larga para cifrar las copias. Guardala aparte (gestor de
#                     contraseñas): sin ella no se puede abrir ninguna copia.
#
# Restaurar una copia de verdad (en una emergencia), con pg_restore 18 o más nuevo (la versión de
# .github/postgres/Dockerfile: uno más viejo no lee la copia):
#   gpg -d backup-AAAA-MM-DD.dump.gpg > backup.dump
#   gpg -d permisos-AAAA-MM-DD.sql.gpg > permisos.sql
#   pg_restore --clean --if-exists --no-owner -d "URI de la base" backup.dump
#   psql "URI de la base" -f permisos.sql
# Y antes de volver a abrir la app, correr supabase/auditoria.sql (workflow "Supabase" → tarea
# sql) y fijarse que en "funciones" las internas (tomar_avisos_vence, soltar_aviso_vence,
# hay_avisos_vence, pasos_totales, product_off_lookup, cron_secret, release_lapsed_clients,
# queue_inactivity_alerts, queue_deload_alerts) digan anon=false y auth=false. Con una copia
# que no trae permisos-…sql (las de antes de octubre de 2026), volver a correr los archivos de
# supabase/ de esas funciones y de las tablas con un REVOKE (por ejemplo,
# productos-off-servidor.sql) y revisar lo mismo.
#
# El log es PÚBLICO: no se imprime ningún dato ni cuántas filas tiene cada tabla, solo si
# cada una llegó completa.
name: Backup de la base

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    environment: backup
    runs-on: ubuntu-24.04
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASS: ${{ secrets.BACKUP_PASSWORD }}
      PG: docker run --rm --network host -v ${{ github.workspace }}/out:/out -e PGPASSWORD=prueba gize-postgres
      # Qué pueden anon y authenticated en public (nombre|anon|auth): llamar cada función y cada
      # permiso de cada tabla (y vista) y de cada columna.
      PERMISOS: >-
        select p.oid::regprocedure::text, has_function_privilege('anon', p.oid, 'execute'),
        has_function_privilege('authenticated', p.oid, 'execute')
        from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.prokind = 'f'
        union all select format('%s %s', c.relname, v), has_table_privilege('anon', c.oid, v), has_table_privilege('authenticated', c.oid, v)
        from pg_class c join pg_namespace n on n.oid = c.relnamespace
        cross join unnest(array['select', 'insert', 'update', 'delete', 'truncate', 'references', 'trigger']) v
        where n.nspname = 'public' and c.relkind in ('r', 'p', 'v', 'm', 'f')
        union all select format('%s.%s %s', c.relname, a.attname, v), has_column_privilege('anon', c.oid, a.attnum, v),
        has_column_privilege('authenticated', c.oid, a.attnum, v)
        from pg_attribute a join pg_class c on c.oid = a.attrelid join pg_namespace n on n.oid = c.relnamespace
        cross join unnest(array['select', 'insert', 'update', 'references']) v
        where n.nspname = 'public' and c.relkind in ('r', 'p', 'v', 'm', 'f') and a.attnum > 0 and not a.attisdropped
      # El .sql que deja todo como en la original, sin dar nada que la original no diera:
      #   · a la función que anon (o authenticated) no podía llamar, se le saca el permiso a public
      #     y a ese rol;
      #   · a cada tabla se le saca todo a anon y authenticated y se les vuelve a dar exactamente lo
      #     que tenían en la original (relacl y attacl). Sacar el permiso de la tabla también saca
      #     el de las columnas: por eso van después, de a una.
      CERRAR: >-
        select s from (
        select 1 as o, format('revoke execute on function %I.%I(%s) from public, %s;', n.nspname, p.proname,
        pg_get_function_identity_arguments(p.oid), concat_ws(', ',
        case when not has_function_privilege('anon', p.oid, 'execute') then 'anon' end,
        case when not has_function_privilege('authenticated', p.oid, 'execute') then 'authenticated' end)) as s
        from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.prokind = 'f'
        and not (has_function_privilege('anon', p.oid, 'execute') and has_function_privilege('authenticated', p.oid, 'execute'))
        union all select 2, format('revoke all on table %I.%I from anon, authenticated;', n.nspname, c.relname)
        from pg_class c join pg_namespace n on n.oid = c.relnamespace
        where n.nspname = 'public' and c.relkind in ('r', 'p', 'v', 'm', 'f')
        union all select 3, format('grant %s on table %I.%I to %I;', string_agg(distinct a.privilege_type, ', '), n.nspname, c.relname, r.rolname)
        from pg_class c join pg_namespace n on n.oid = c.relnamespace cross join aclexplode(c.relacl) a join pg_roles r on r.oid = a.grantee
        where n.nspname = 'public' and c.relkind in ('r', 'p', 'v', 'm', 'f') and r.rolname in ('anon', 'authenticated')
        group by n.nspname, c.relname, r.rolname
        union all select distinct 4, format('grant %s (%I) on table %I.%I to %I;', a.privilege_type, t.attname, n.nspname, c.relname, r.rolname)
        from pg_attribute t join pg_class c on c.oid = t.attrelid join pg_namespace n on n.oid = c.relnamespace
        cross join aclexplode(t.attacl) a join pg_roles r on r.oid = a.grantee
        where n.nspname = 'public' and c.relkind in ('r', 'p', 'v', 'm', 'f') and r.rolname in ('anon', 'authenticated')
        and t.attnum > 0 and not t.attisdropped
        ) x order by o, s
      # Tablas que se comparan después de restaurar.
      TABLAS: >-
        auth.users public.profiles public.routines public.sessions public.session_entries
        public.body_weights public.daily_logs public.checkins
        public.food_entries public.coach_billing public.routine_templates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Revisar los secrets
        run: |
          [ -n "$DB_URL" ] || { echo "::error::Falta el secret SUPABASE_DB_URL"; exit 1; }
          [ ${#PASS} -ge 16 ] || { echo "::error::Falta el secret BACKUP_PASSWORD (al menos 16 caracteres)"; exit 1; }
          echo "::add-mask::$DB_URL"
          mkdir -p out

      # La imagen de Postgres recibe la URI de la base y arma la copia: no puede ser un tag que
      # se mueva. Sale de .github/postgres/Dockerfile, fijada por digest (la actualiza Dependabot).
      - name: Imagen de Postgres
        run: |
          IMG=$(sed -n 's/^FROM \([^ ]*\).*/\1/p' .github/postgres/Dockerfile)
          [[ "$IMG" =~ ^postgres:[0-9.]+@sha256:[0-9a-f]{64}$ ]] || { echo "::error::.github/postgres/Dockerfile tiene que fijar la imagen con @sha256:"; exit 1; }
          docker pull -q "$IMG" > /dev/null
          docker tag "$IMG" gize-postgres

      # Base vacía para la prueba. No es un "service" de GitHub: esos imprimen al final todo
      # lo que dijo Postgres, y un error de restauración puede citar valores de una fila.
      # Acá no se registra nada y su salida no llega al log.
      - name: Levantar la base de prueba
        run: |
          docker run -d --name prueba -e POSTGRES_PASSWORD=prueba -p 5432:5432 gize-postgres \
            -c log_min_messages=panic -c log_min_error_statement=panic > /dev/null
          for i in $(seq 1 30); do docker exec prueba pg_isready -U postgres > /dev/null 2>&1 && break; sleep 2; done
          docker exec prueba pg_isready -U postgres > /dev/null

      - name: Copiar la base
        run: |
          # Filas por tabla ANTES y DESPUÉS del pg_dump (quedan en el runner, no en el log).
          # La copia es una foto de algún momento entre los dos conteos: si alguien carga o
          # borra algo mientras corre, lo restaurado tiene que quedar entre uno y otro.
          contar() { $PG psql "$DB_URL" -Atc "select count(*) from $1" 2>/dev/null || echo "?"; }
          for t in $TABLAS; do echo "$t $(contar $t)" >> out/antes.txt; done
          $PG pg_dump "$DB_URL" -Fc --no-owner \
            --exclude-table-data='auth.sessions' --exclude-table-data='auth.refresh_tokens' \
            --exclude-table-data='auth.one_time_tokens' --exclude-table-data='auth.flow_state' \
            --exclude-table-data='auth.mfa_challenges' --exclude-table-data='auth.mfa_amr_claims' \
            -f /out/backup.dump
          while read -r t a; do echo "$t $a $(contar $t)" >> out/filas.txt; done < out/antes.txt
          # Permisos de las funciones y las tablas (ver arriba, punto 4). Si no se pueden leer, la
          # copia sigue.
          $PG psql "$DB_URL" -Atc "$PERMISOS" 2>/dev/null | sort -t '|' -k1,1 > out/permisos.txt || true
          $PG psql "$DB_URL" -Atc "$CERRAR" > out/permisos.sql 2>/dev/null || rm -f out/permisos.sql

      - name: Probar que se puede restaurar
        run: |
          # Lo que en Supabase ya existe y la copia da por hecho (roles y extensiones), y que lo
          # que se crea en public nace abierto para anon y authenticated, como en Supabase.
          $PG psql -h localhost -U postgres -qc "
            do \$\$ declare r text; begin
              foreach r in array array['anon','authenticated','service_role','supabase_admin','supabase_auth_admin','supabase_storage_admin','authenticator','dashboard_user','pgbouncer'] loop
                if not exists (select 1 from pg_roles where rolname = r) then execute format('create role %I', r); end if;
              end loop; end \$\$;
            create schema if not exists extensions;
            create extension if not exists pgcrypto with schema extensions;
            create extension if not exists \"uuid-ossp\" with schema extensions;
            alter default privileges in schema public grant all on tables to anon, authenticated, service_role;
            alter default privileges in schema public grant all on functions to anon, authenticated, service_role;"
          # Algunos objetos propios de Supabase no existen en un Postgres común: esos errores
          # se ignoran; lo que importa es que lleguen todas las filas.
          $PG pg_restore -h localhost -U postgres -d postgres --no-owner /out/backup.dump > /dev/null 2>&1 || true
          mal=0
          while read -r t a n; do
            m=$($PG psql -h localhost -U postgres -Atc "select count(*) from $t" 2>/dev/null || echo "x")
            if [ "$a" = "?" ] || [ "$n" = "?" ]; then echo "- $t: no existe en la base (se saltea)"; continue; fi
            lo=$(( a < n ? a : n )); hi=$(( a < n ? n : a ))
            if [ "$m" != "x" ] && [ "$m" -ge "$lo" ] && [ "$m" -le "$hi" ]; then echo "OK $t";
            else echo "::error::$t no se restauró completa"; mal=1; fi
          done < out/filas.txt
          [ $mal -eq 0 ] || exit 1

      - name: Cifrar
        run: |
          f="backup-$(date -u +%F).dump.gpg"
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            -o "out/$f" out/backup.dump
          if [ -s out/permisos.sql ]; then
            printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
              -o "out/permisos-$(date -u +%F).sql.gpg" out/permisos.sql
          else echo "::warning::No se pudieron leer los permisos: esta copia va sin permisos-…sql"; fi
          rm -f out/backup.dump out/filas.txt out/antes.txt
          ls out/*.gpg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backup-base
          path: out/*.gpg
          retention-days: 21

      # Después de subir la copia (si esto falla, la copia igual quedó): con permisos.sql, en la
      # base de prueba abierta como Supabase, ninguna función, tabla ni columna de public queda
      # más abierta que en la original. El log muestra solo nombres de funciones, tablas y
      # columnas (están en el repo), ningún dato.
      - name: Probar los permisos de las funciones y las tablas
        run: |
          if [ ! -s out/permisos.txt ] || [ ! -s out/permisos.sql ]; then echo "- no se pudieron leer de la original (se saltea)"; exit 0; fi
          $PG psql -h localhost -U postgres -q -f /out/permisos.sql > /dev/null 2>&1 || true
          $PG psql -h localhost -U postgres -Atc "$PERMISOS" 2>/dev/null | sort -t '|' -k1,1 > out/permisos-copia.txt || true
          abiertas=$(join -t '|' out/permisos.txt out/permisos-copia.txt | awk -F'|' '($4 == "t" && $2 == "f") || ($5 == "t" && $3 == "f") { print $1 }')
          rm -f out/permisos.sql out/permisos.txt out/permisos-copia.txt
          if [ -n "$abiertas" ]; then echo "::error::Restauradas quedan abiertas: $(echo "$abiertas" | paste -sd ';' -)"; exit 1; fi
          echo "OK permisos de las funciones y las tablas"

      - name: Apagar la base de prueba
        if: always()
        run: docker rm -f prueba > /dev/null 2>&1 || true
