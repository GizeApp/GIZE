# Copia de seguridad de la base de Supabase, cifrada, y prueba de que se puede restaurar.
# Corre sola los lunes y también a mano: Actions → "Backup de la base" → Run workflow.
#
# Qué hace:
#   1. pg_dump de toda la base (datos de usuarios, rutinas, entrenos, planes…). Las fotos
#      (Storage) no entran: son archivos, no filas de la base. Tampoco las sesiones abiertas
#      ni los tokens de inicio de sesión (con una copia robada y descifrada se podría entrar
#      a las cuentas sin contraseña): después de restaurar, cada uno vuelve a iniciar sesión.
#   2. La cifra con BACKUP_PASSWORD (AES-256, con la derivación de clave más lenta de gpg para
#      que probar contraseñas de a millones no sirva). Mientras el repo sea público
#      cualquiera con cuenta de GitHub puede bajar los Artifacts: sin la contraseña el
#      archivo no sirve para nada.
#   3. La restaura en una base vacía y compara cuántas filas tiene cada tabla con la original.
#      Si falta algo, la ejecución sale en rojo.
#   El archivo queda 21 días en la ejecución (Artifacts → backup-base): alcanza para tener
#   las últimas 3 copias semanales sin dejar meses de copias a disposición.
#
# Corre solo desde main.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL   Supabase → botón "Connect" → "Session pooler" → la URI, con la
#                     contraseña de la base en lugar de [YOUR-PASSWORD].
#   BACKUP_PASSWORD   una contraseña larga para cifrar las copias. Guardala aparte (gestor de
#                     contraseñas): sin ella no se puede abrir ninguna copia.
#
# Restaurar una copia de verdad (en una emergencia):
#   gpg -d backup-AAAA-MM-DD.dump.gpg > backup.dump
#   pg_restore --clean --if-exists --no-owner -d "URI de la base" backup.dump
#
# El log es PÚBLICO: no se imprime ningún dato ni cuántas filas tiene cada tabla, solo si
# cada una llegó completa.
name: Backup de la base

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASS: ${{ secrets.BACKUP_PASSWORD }}
      PG: docker run --rm --network host -v ${{ github.workspace }}/out:/out -e PGPASSWORD=prueba postgres:18
      # Tablas que se comparan después de restaurar.
      TABLAS: >-
        auth.users public.profiles public.routines public.sessions public.session_entries
        public.body_weights public.daily_logs public.checkins public.checkin_photos
        public.food_entries public.coach_billing public.routine_templates
    steps:
      - name: Revisar los secrets
        run: |
          [ -n "$DB_URL" ] || { echo "::error::Falta el secret SUPABASE_DB_URL"; exit 1; }
          [ ${#PASS} -ge 16 ] || { echo "::error::Falta el secret BACKUP_PASSWORD (al menos 16 caracteres)"; exit 1; }
          echo "::add-mask::$DB_URL"
          mkdir -p out

      # Base vacía para la prueba. No es un "service" de GitHub: esos imprimen al final todo
      # lo que dijo Postgres, y un error de restauración puede citar valores de una fila.
      # Acá no se registra nada y su salida no llega al log.
      - name: Levantar la base de prueba
        run: |
          docker run -d --name prueba -e POSTGRES_PASSWORD=prueba -p 5432:5432 postgres:18 \
            -c log_min_messages=panic -c log_min_error_statement=panic > /dev/null
          for i in $(seq 1 30); do docker exec prueba pg_isready -U postgres > /dev/null 2>&1 && break; sleep 2; done
          docker exec prueba pg_isready -U postgres > /dev/null

      - name: Copiar la base
        run: |
          # Filas por tabla ANTES y DESPUÉS del pg_dump (quedan en el runner, no en el log).
          # La copia es una foto de algún momento entre los dos conteos: si alguien carga o
          # borra algo mientras corre, lo restaurado tiene que quedar entre uno y otro.
          contar() { $PG psql "$DB_URL" -Atc "select count(*) from $1" 2>/dev/null || echo "?"; }
          for t in $TABLAS; do echo "$t $(contar $t)" >> out/antes.txt; done
          $PG pg_dump "$DB_URL" -Fc --no-owner --no-privileges \
            --exclude-table-data='auth.sessions' --exclude-table-data='auth.refresh_tokens' \
            --exclude-table-data='auth.one_time_tokens' --exclude-table-data='auth.flow_state' \
            --exclude-table-data='auth.mfa_challenges' --exclude-table-data='auth.mfa_amr_claims' \
            -f /out/backup.dump
          while read -r t a; do echo "$t $a $(contar $t)" >> out/filas.txt; done < out/antes.txt

      - name: Probar que se puede restaurar
        run: |
          # Lo que en Supabase ya existe y la copia da por hecho (roles y extensiones).
          $PG psql -h localhost -U postgres -qc "
            do \$\$ declare r text; begin
              foreach r in array array['anon','authenticated','service_role','supabase_admin','supabase_auth_admin','supabase_storage_admin','authenticator','dashboard_user','pgbouncer'] loop
                if not exists (select 1 from pg_roles where rolname = r) then execute format('create role %I', r); end if;
              end loop; end \$\$;
            create schema if not exists extensions;
            create extension if not exists pgcrypto with schema extensions;
            create extension if not exists \"uuid-ossp\" with schema extensions;"
          # Algunos objetos propios de Supabase no existen en un Postgres común: esos errores
          # se ignoran; lo que importa es que lleguen todas las filas.
          $PG pg_restore -h localhost -U postgres -d postgres --no-owner --no-privileges /out/backup.dump > /dev/null 2>&1 || true
          mal=0
          while read -r t a n; do
            m=$($PG psql -h localhost -U postgres -Atc "select count(*) from $t" 2>/dev/null || echo "x")
            if [ "$a" = "?" ] || [ "$n" = "?" ]; then echo "- $t: no existe en la base (se saltea)"; continue; fi
            lo=$(( a < n ? a : n )); hi=$(( a < n ? n : a ))
            if [ "$m" != "x" ] && [ "$m" -ge "$lo" ] && [ "$m" -le "$hi" ]; then echo "OK $t";
            else echo "::error::$t no se restauró completa"; mal=1; fi
          done < out/filas.txt
          [ $mal -eq 0 ] || exit 1

      - name: Cifrar
        run: |
          f="backup-$(date -u +%F).dump.gpg"
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            -o "out/$f" out/backup.dump
          rm -f out/backup.dump out/filas.txt out/antes.txt
          ls out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backup-base
          path: out/*.gpg
          retention-days: 21

      - name: Apagar la base de prueba
        if: always()
        run: docker rm -f prueba > /dev/null 2>&1 || true
