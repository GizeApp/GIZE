# Las actions de los workflows van fijadas por SHA (un tag se puede mover, un commit no).
# Dependabot abre un PR por mes cuando sale una versión nueva, con el SHA y el tag actualizados.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # La imagen de Postgres de la copia de seguridad, fijada por digest (.github/postgres/Dockerfile).
  # Solo dentro de la misma versión mayor: con otra, las copias salen de un pg_dump nuevo y
  # restaurarlas pide un pg_restore igual o más nuevo (ver backup.yml). Ese cambio va a mano.
  - package-ecosystem: docker
    directory: /.github/postgres
    schedule:
      interval: monthly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  # Pillow del workflow «Fotos de videos», con versión y hash fijos (scripts/fotos-videos-requirements.txt).
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
